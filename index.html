                  <div style="font-size:22px;color:#fb923c;margin-bottom:10px;">挑战 #${ch.order}：${ch.name} ${done ? '🏆 已通关' : ''}</div>
                  <div style="background:#111820;padding:14px;border-radius:10px;font-size:15px;line-height:1.6;">
                    ${ch.desc}
                  </div>
                </div>
                <div style="text-align:right;margin-top:18px;">
                  <button class="bal-btn btn-green" id="start-chg-btn" style="font-size:18px;padding:12px 30px;">⚔ 开启挑战</button>
                </div>
              </div>
            </div>
          `;
          bodyEl.querySelectorAll('[data-chidx]').forEach((b) => {
            b.onclick = () => { selChallengeIdx = Number(b.dataset.chidx); Balatro.audio.play('button'); render(); };
          });
          document.getElementById('start-chg-btn').onclick = () => {
            close();
            onStartRun({ deckId: 'b_red', stake: 1, challengeId: ch.id });
          };
        }
      };
      render();
    });
  };

  // ==================== 2. 牌局信息弹窗（12种牌型 / 盲注 / 优惠券） ====================
  Balatro.openRunInfoModal = function openRunInfoModal(run) {
    if (!run) return;
    let tab = 'hands';
    openModalShell('牌局信息 (Run Info)', (tabsEl, bodyEl) => {
      const render = () => {
        tabsEl.innerHTML = `
          <button class="bal-btn ${tab === 'hands' ? 'btn-blue' : 'btn-slate'}" id="ri-hands">扑克牌型</button>
          <button class="bal-btn ${tab === 'blinds' ? 'btn-orange' : 'btn-slate'}" id="ri-blinds">本底注盲注</button>
          <button class="bal-btn ${tab === 'vouchers' ? 'btn-green' : 'btn-slate'}" id="ri-vouchers">已购优惠券</button>
        `;
        document.getElementById('ri-hands').onclick = () => { tab = 'hands'; Balatro.audio.play('button'); render(); };
        document.getElementById('ri-blinds').onclick = () => { tab = 'blinds'; Balatro.audio.play('button'); render(); };
        document.getElementById('ri-vouchers').onclick = () => { tab = 'vouchers'; Balatro.audio.play('button'); render(); };

        if (tab === 'hands') {
          const visibleHands = Balatro.POKER_HANDS.filter((h) => !h.secret || run.unlockedSecretHands[h.id]);
          bodyEl.innerHTML = visibleHands.map((h) => {
            const st = run.getHandLevel(h.id);
            const cnt = run.handPlayCounts[h.id] || 0;
            return `
              <div class="hand-info-row">
                <span class="hud-hand-lv" style="text-align:center;font-size:13px;">Lv.${st.level}</span>
                <div>
                  <div style="font-size:16px;">${h.name} <span style="font-size:12px;color:#94a3b8">${h.enName}</span></div>
                  <div style="font-size:11px;color:#94a3b8">${h.desc}</div>
                </div>
                <div style="display:flex;align-items:center;justify-content:center;gap:6px;">
                  <span style="background:var(--chip-blue);padding:3px 9px;border-radius:6px;">${st.chips}</span>
                  <span style="color:var(--mult-red);">X</span>
                  <span style="background:var(--mult-red);padding:3px 9px;border-radius:6px;">${st.mult}</span>
                </div>
                <div style="text-align:right;font-size:13px;color:#cbd5e1;">#${cnt} 次</div>
              </div>
            `;
          }).join('');
        } else if (tab === 'blinds') {
          bodyEl.innerHTML = `<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;">
            ${run.anteBlinds.map((b, idx) => `
              <div style="background:#172026;border:2px solid ${b.color};border-radius:14px;padding:14px;text-align:center;">
                <div style="font-size:28px;margin-bottom:6px;">${b.symbol}</div>
                <div style="font-size:18px;margin-bottom:4px;">${b.name}</div>
                <div style="font-size:13px;color:#cbd5e1;min-height:36px;">${b.desc}</div>
                <div style="font-size:20px;color:var(--mult-red);margin-top:8px;">目标: ${Balatro.formatNumber(run.getBlindTargetScore(b))}</div>
                <div style="font-size:12px;color:#94a3b8;margin-top:4px;">${idx < run.blindIdx ? '✅ 已通过' : (idx === run.blindIdx ? '⚔ 当前盲注' : '⏳ 待挑战')}</div>
              </div>
            `).join('')}
          </div>`;
        } else {
          const ownedIds = Object.keys(run.vouchers);
          if (ownedIds.length === 0) {
            bodyEl.innerHTML = '<div style="text-align:center;color:#94a3b8;padding:40px;">本局尚未购买任何优惠券</div>';
          } else {
            bodyEl.innerHTML = '<div class="collection-grid" id="ri-voucher-grid"></div>';
            const g = document.getElementById('ri-voucher-grid');
            ownedIds.forEach((vid) => {
              const v = Balatro.VOUCHER_MAP[vid];
              if (v) g.appendChild(Balatro.renderSpecialCardEl(Object.assign({ kind: 'Voucher' }, v), run));
            });
          }
        }
      };
      render();
    });
  };

  // ==================== 3. 全牌库 4×13 实时矩阵透视器 ====================
  Balatro.openDeckViewerModal = function openDeckViewerModal(run) {
    if (!run) return;
    let viewRemOnly = true;

    openModalShell('牌组透视器 (Deck Viewer)', (tabsEl, bodyEl) => {
      const render = () => {
        const cards = viewRemOnly ? run.drawPile : run.masterDeck;
        tabsEl.innerHTML = `
          <button class="bal-btn ${viewRemOnly ? 'btn-blue' : 'btn-slate'}" id="dv-rem">剩余未抽牌堆 (${run.drawPile.length} 张)</button>
          <button class="bal-btn ${!viewRemOnly ? 'btn-orange' : 'btn-slate'}" id="dv-all">完整牌组总览 (${run.masterDeck.length} 张)</button>
        `;
        document.getElementById('dv-rem').onclick = () => { viewRemOnly = true; Balatro.audio.play('button'); render(); };
        document.getElementById('dv-all').onclick = () => { viewRemOnly = false; Balatro.audio.play('button'); render(); };

        const ranksDesc = [14, 13, 12, 11, 10, 9, 8, 7, 6, 5, 4, 3, 2];
        const stones = cards.filter((c) => c.enhancement === 'stone').length;
        const enhCnt = cards.filter((c) => !!c.enhancement).length;

        let matrixHtml = `
          <div style="display:flex;gap:16px;margin-bottom:12px;font-size:13px;color:#cbd5e1;">
            <span>人头牌: <b>${cards.filter((c) => Balatro.isFaceCard(c, run)).length}</b></span>
            <span>A (Ace): <b>${cards.filter((c) => c.enhancement !== 'stone' && c.rank === 14).length}</b></span>
            <span>增强牌: <b>${enhCnt}</b></span>
            <span>石头牌: <b>${stones}</b></span>
          </div>
          <div class="deck-matrix-row" style="font-size:12px;color:#94a3b8;">
            <div>花色 \\ 点数</div>
            ${ranksDesc.map((r) => `<div style="text-align:center">${Balatro.RANK_LABELS[r]}</div>`).join('')}
          </div>
        `;

        Balatro.SUITS.forEach((s) => {
          const sm = Balatro.SUIT_META[s];
          const suitCards = cards.filter((c) => c.enhancement !== 'stone' && c.suit === s);
          matrixHtml += `
            <div class="deck-matrix-row">
              <div style="color:${Balatro.getSuitColor(s)}">${sm.symbol} ${sm.name} (${suitCards.length})</div>
              ${ranksDesc.map((r) => {
                const cnt = suitCards.filter((c) => c.rank === r).length;
                return `<div class="deck-matrix-cell ${cnt === 0 ? 'empty' : (cnt > 1 ? 'multiple' : '')}">${cnt}</div>`;
              }).join('')}
            </div>
          `;
        });

        matrixHtml += '<div style="margin-top:14px;font-size:13px;color:#94a3b8;margin-bottom:8px;">卡牌逐张明细（鼠标悬停可查看增强/蜡封/版本）：</div><div class="collection-grid" id="dv-cards-grid"></div>';
        bodyEl.innerHTML = matrixHtml;

        const grid = document.getElementById('dv-cards-grid');
        const sorted = cards.slice().sort((a, b) => (b.rank - a.rank));
        sorted.forEach((c) => {
          const copy = Object.assign({}, c, { selected: false, faceDown: false });
          grid.appendChild(Balatro.renderPlayingCardEl(copy, run));
        });
      };
      render();
    });
  };

  // ==================== 4. 340+ 全收藏图鉴 (Collection) ====================
  Balatro.openCollectionModal = function openCollectionModal(run) {
    let cat = 'jokers';
    let jokerPage = 0;

    openModalShell('全量收藏图鉴 (Collection - 340+ 项)', (tabsEl, bodyEl) => {
      const render = () => {
        const cats = [
          { id: 'jokers', label: `小丑牌 (${Balatro.JOKERS.length})` },
          { id: 'tarots', label: `塔罗牌 (${Balatro.TAROTS.length})` },
          { id: 'planets', label: `星球牌 (${Balatro.PLANETS.length})` },
          { id: 'spectrals', label: `幻灵牌 (${Balatro.SPECTRALS.length})` },
          { id: 'vouchers', label: `优惠券 (${Balatro.VOUCHERS.length})` },
          { id: 'blinds', label: `盲注 (${Balatro.BLINDS.length})` },
          { id: 'tags', label: `标签 (${Balatro.TAGS.length})` }
        ];

        tabsEl.innerHTML = cats.map((c) => `
          <button class="bal-btn ${cat === c.id ? 'btn-orange' : 'btn-slate'}" data-cat="${c.id}" style="font-size:13px;padding:7px 12px;">${c.label}</button>
        `).join('');
        tabsEl.querySelectorAll('[data-cat]').forEach((b) => {
          b.onclick = () => { cat = b.dataset.cat; Balatro.audio.play('button'); render(); };
        });

        bodyEl.innerHTML = '';
        if (cat === 'jokers') {
          const perPage = 15; // 原版 10 页 × 每页 15 张 = 150 张！
          const totalPages = Math.ceil(Balatro.JOKERS.length / perPage);
          const slice = Balatro.JOKERS.slice(jokerPage * perPage, (jokerPage + 1) * perPage);

          const grid = document.createElement('div');
          grid.className = 'collection-grid';
          grid.style.gridTemplateColumns = 'repeat(5, 1fr)';
          slice.forEach((jm) => {
            const inst = Balatro.createJokerInstance(jm.id);
            grid.appendChild(Balatro.renderJokerCardEl(inst, run, { showSticker: true }));
          });
          bodyEl.appendChild(grid);

          const pager = document.createElement('div');
          pager.style.cssText = 'display:flex;justify-content:center;align-items:center;gap:14px;margin-top:16px;';
          pager.innerHTML = `
            <button class="bal-btn btn-red" id="jp-prev">◀ 上一页</button>
            <span>第 ${jokerPage + 1} / ${totalPages} 页 (编号 #${jokerPage * perPage + 1} - #${Math.min(150, (jokerPage + 1) * perPage)})</span>
            <button class="bal-btn btn-red" id="jp-next">下一页 ▶</button>
          `;
          bodyEl.appendChild(pager);
          document.getElementById('jp-prev').onclick = () => { jokerPage = (jokerPage - 1 + totalPages) % totalPages; Balatro.audio.play('cardSlide'); render(); };
          document.getElementById('jp-next').onclick = () => { jokerPage = (jokerPage + 1) % totalPages; Balatro.audio.play('cardSlide'); render(); };
        } else if (cat === 'tarots' || cat === 'planets' || cat === 'spectrals' || cat === 'vouchers') {
          const grid = document.createElement('div');
          grid.className = 'collection-grid';
          const list = cat === 'tarots' ? Balatro.TAROTS : (cat === 'planets' ? Balatro.PLANETS : (cat === 'spectrals' ? Balatro.SPECTRALS : Balatro.VOUCHERS));
          list.forEach((m) => {
            const item = cat === 'vouchers' ? Object.assign({ kind: 'Voucher' }, m) : Balatro.createConsumableInstance(m.id);
            grid.appendChild(Balatro.renderSpecialCardEl(item, run));
          });
          bodyEl.appendChild(grid);
        } else if (cat === 'blinds') {
          bodyEl.innerHTML = `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;">
            ${Balatro.BLINDS.map((b) => `
              <div style="background:#172026;border-left:5px solid ${b.color};border-radius:10px;padding:10px 12px;">
                <div style="font-size:15px;">${b.symbol} ${b.name} <span style="color:#facc15;font-size:12px;">(${b.mult}X)</span></div>
                <div style="font-size:12px;color:#cbd5e1;margin-top:4px;">${b.desc}</div>
              </div>
            `).join('')}
          </div>`;
        } else if (cat === 'tags') {
          bodyEl.innerHTML = `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;">
            ${Balatro.TAGS.map((t) => `
              <div style="background:#172026;border-left:5px solid ${t.color};border-radius:10px;padding:10px 12px;">
                <div style="font-size:15px;">[${t.icon}] ${t.name}</div>
                <div style="font-size:12px;color:#cbd5e1;margin-top:4px;">${Balatro.formatDesc(t.desc)}</div>
              </div>
            `).join('')}
          </div>`;
        }
      };
      render();
    });
  };

  // ==================== 5. 选项设置与档案管理面板 ====================
  Balatro.openOptionsModal = function openOptionsModal(app) {
    openModalShell('选项与档案设置 (Options & Profile)', (tabsEl, bodyEl, close) => {
      const render = () => {
        const s = Balatro.storage.settings;
        const p = Balatro.storage.profile;
        const run = app.run;

        tabsEl.innerHTML = [0, 1, 2].map((idx) => `
          <button class="bal-btn ${Balatro.storage.data.activeProfile === idx ? 'btn-blue' : 'btn-slate'}" data-prof="${idx}">
            档案 ${idx + 1} (胜场: ${Balatro.storage.data.profiles[idx].stats.wins})
          </button>
        `).join('');

        tabsEl.querySelectorAll('[data-prof]').forEach((b) => {
          b.onclick = () => {
            Balatro.storage.switchProfile(Number(b.dataset.prof));
            Balatro.audio.play('button');
            render();
          };
        });

        bodyEl.innerHTML = `
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
            <div style="background:#172026;padding:16px;border-radius:14px;display:flex;flex-direction:column;gap:12px;">
              <div style="font-size:17px;color:#38bdf8;">音画与游戏速度</div>
              <label style="display:flex;justify-content:space-between;align-items:center;">
                <span>主音量 (${s.masterVolume}%)</span>
                <input type="range" min="0" max="100" value="${s.masterVolume}" id="opt-master" />
              </label>
              <label style="display:flex;justify-content:space-between;align-items:center;">
                <span>音乐音量 (${s.musicVolume}%)</span>
                <input type="range" min="0" max="100" value="${s.musicVolume}" id="opt-music" />
              </label>
              <label style="display:flex;justify-content:space-between;align-items:center;">
                <span>音效音量 (${s.sfxVolume}%)</span>
                <input type="range" min="0" max="100" value="${s.sfxVolume}" id="opt-sfx" />
              </label>
              <label style="display:flex;justify-content:space-between;align-items:center;">
                <span>CRT 扫描线滤镜 (${s.crtIntensity}%)</span>
                <input type="range" min="0" max="100" value="${s.crtIntensity}" id="opt-crt" />
              </label>
              <label style="display:flex;justify-content:space-between;align-items:center;">
                <span>震屏强度 (${s.screenShake}%)</span>
                <input type="range" min="0" max="100" value="${s.screenShake}" id="opt-shake" />
              </label>
              <div style="display:flex;justify-content:space-between;align-items:center;">
                <span>结算动画倍速</span>
                <div style="display:flex;gap:6px;">
                  ${[0.5, 1, 2, 4].map((sp) => `<button class="bal-btn ${s.gameSpeed === sp ? 'btn-orange' : 'btn-slate'}" data-spd="${sp}" style="padding:5px 10px;font-size:13px;">${sp}X</button>`).join('')}
                </div>
              </div>
              <label style="display:flex;justify-content:space-between;align-items:center;cursor:pointer;">
                <span>高对比度扑克花色 (蓝梅花/橙方块)</span>
                <input type="checkbox" ${s.highContrastCards ? 'checked' : ''} id="opt-hc" style="width:18px;height:18px;" />
              </label>
            </div>

            <div style="background:#172026;padding:16px;border-radius:14px;display:flex;flex-direction:column;justify-content:space-between;gap:12px;">
              <div style="display:flex;flex-direction:column;gap:8px;">
                <div style="font-size:17px;color:#facc15;">当前档案与牌局操作</div>
                <div style="font-size:13px;color:#cbd5e1;">档案状态：${p.unlockAll ? '🔓 全内容已解锁' : `已解锁 ${p.unlockedDecks.length}/15 牌组`}</div>
                ${run ? `<div style="font-size:14px;">当前牌局种子：<span class="hl-money">${run.rng.seed}</span></div>` : ''}
                <button class="bal-btn btn-gold" id="opt-unlock-all">🔓 一键全解锁当前档案</button>
                <button class="bal-btn btn-blue" id="opt-open-col">📖 查看全收藏图鉴</button>
              </div>
              <div style="display:flex;flex-direction:column;gap:8px;">
                ${run ? `
                  <button class="bal-btn btn-green" id="opt-new-run">🔄 开启新牌局</button>
                  <button class="bal-btn btn-red" id="opt-to-title">🏠 返回主菜单</button>
                ` : ''}
              </div>
            </div>
          </div>
        `;

        const bindSlider = (id, key) => {
          document.getElementById(id).oninput = (e) => {
            Balatro.storage.updateSetting(key, Number(e.target.value));
            render();
          };
        };
        bindSlider('opt-master', 'masterVolume');
        bindSlider('opt-music', 'musicVolume');
        bindSlider('opt-sfx', 'sfxVolume');
        bindSlider('opt-crt', 'crtIntensity');
        bindSlider('opt-shake', 'screenShake');

        bodyEl.querySelectorAll('[data-spd]').forEach((b) => {
          b.onclick = () => { Balatro.storage.updateSetting('gameSpeed', Number(b.dataset.spd)); Balatro.audio.play('button'); render(); };
        });
        document.getElementById('opt-hc').onchange = (e) => {
          Balatro.storage.updateSetting('highContrastCards', e.target.checked);
          app.renderAll();
        };
        document.getElementById('opt-unlock-all').onclick = () => {
          Balatro.storage.unlockAllInCurrentProfile();
          Balatro.audio.play('win');
          render();
        };
        document.getElementById('opt-open-col').onclick = () => {
          close();
          Balatro.openCollectionModal(app.run);
        };
        if (run) {
          document.getElementById('opt-new-run').onclick = () => {
            close();
            Balatro.openNewRunModal((cfg) => app.startNewRun(cfg));
          };
          document.getElementById('opt-to-title').onclick = () => {
            close();
            app.returnToTitle();
          };
        }
      };
      render();
    });
  };
})(window);

</script>
  <script>
'use strict';

/**
 * iPhone / iPad 移动端适配与 iOS PWA 全屏增强控制器
 * - 自动生成 180×180 PNG apple-touch-icon（解决 iOS 添加到主屏幕不支持 SVG 图标的问题）
 * - 注册离线 Service Worker（支持飞行模式断网游玩）
 * - iPhone 横屏等比缩放引擎（自动避让灵动岛/刘海与底部 Home 条安全区）
 * - 支持「竖屏方向锁定」下的一键画面 90° 横置模式
 */
(function initMobilePWA(global) {
  const Balatro = global.Balatro;

  const DESIGN_W = 1280;
  const DESIGN_H = 690;

  Balatro.viewportScale = 1;
  Balatro.viewportRotated = false;
  Balatro.forceRotatedLandscape = false;
  Balatro.isTouchDevice = false;
  Balatro.lastPointerType = 'mouse';

  // 1. 生成高清 180x180 PNG Apple Touch Icon 挂载到 head，保证添加到 iPhone 桌面图标清晰美观
  function injectAppleTouchIconPNG() {
    try {
      const cv = document.createElement('canvas');
      cv.width = 180;
      cv.height = 180;
      const ctx = cv.getContext('2d');

      // 渐变底色
      const grad = ctx.createLinearGradient(0, 0, 180, 180);
      grad.addColorStop(0, '#e63946');
      grad.addColorStop(0.5, '#1e293b');
      grad.addColorStop(1, '#009dff');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 180, 180);

      // 中央金色镶边扑克白卡
      ctx.fillStyle = '#f8fafc';
      ctx.strokeStyle = '#facc15';
      ctx.lineWidth = 6;
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(32, 18, 116, 144, 14);
      else ctx.rect(32, 18, 116, 144);
      ctx.fill();
      ctx.stroke();

      // 左上角 A 与中央红桃小丑徽记
      ctx.fillStyle = '#e63946';
      ctx.font = '900 26px Arial, sans-serif';
      ctx.fillText('A', 44, 48);
      ctx.font = '64px Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('🃏', 90, 96);

      const pngUrl = cv.toDataURL('image/png');
      let link = document.querySelector('link[rel="apple-touch-icon"]');
      if (!link) {
        link = document.createElement('link');
        link.rel = 'apple-touch-icon';
        document.head.appendChild(link);
      }
      link.href = pngUrl;
    } catch (_) {}
  }

  // 2. 在 HTTP/HTTPS 环境下自动注册离线缓存 Service Worker
  function registerServiceWorker() {
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.protocol === 'http:')) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  }

  // 3. 读取 iOS 刘海/灵动岛安全区边距
  function readSafeAreaInsets() {
    const probe = document.getElementById('safe-area-probe');
    if (!probe) return { top: 0, right: 0, bottom: 0, left: 0 };
    const cs = global.getComputedStyle(probe);
    return {
      top: parseFloat(cs.top) || 0,
      right: parseFloat(cs.right) || 0,
      bottom: parseFloat(cs.bottom) || 0,
      left: parseFloat(cs.left) || 0
    };
  }

  // 4. 计算并应用视口等比缩放（兼容桌面全尺寸、iPhone 横屏及 iPhone 竖屏锁定强制 90° 横置）
  Balatro.updateViewportLayout = function updateViewportLayout() {
    const appRoot = document.getElementById('app-root');
    const guard = document.getElementById('portrait-guard');
    const exitFab = document.getElementById('exit-rotate-fab');
    const modalBackdrop = document.getElementById('modal-backdrop');
    if (!appRoot) return;

    const vv = global.visualViewport;
    const vw = vv ? vv.width : global.innerWidth;
    const vh = vv ? vv.height : global.innerHeight;
    const safe = readSafeAreaInsets();
    const isPortraitPhone = vh > vw && vw < 760;

    // 若用户已经把手机物理横过来了，自动解除强制旋转开关并隐藏提示
    if (!isPortraitPhone && Balatro.forceRotatedLandscape) {
      Balatro.forceRotatedLandscape = false;
    }

    if (isPortraitPhone && !Balatro.forceRotatedLandscape) {
      if (guard) guard.classList.add('visible');
      if (exitFab) exitFab.classList.remove('visible');
    } else {
      if (guard) guard.classList.remove('visible');
      if (exitFab) {
        exitFab.classList.toggle('visible', !!Balatro.forceRotatedLandscape);
      }
    }

    // 情况 A：强制竖屏内 90° 横置模式（专门服务开了 iPhone 竖排方向锁定的玩家）
    if (isPortraitPhone && Balatro.forceRotatedLandscape) {
      const availLong = vh - safe.top - safe.bottom - 8;
      const availShort = vw - safe.left - safe.right - 6;
      const scale = Math.min(availLong / DESIGN_W, availShort / DESIGN_H);

      Balatro.viewportScale = scale;
      Balatro.viewportRotated = true;

      const cx = safe.left + (vw - safe.left - safe.right) * 0.5;
      const cy = safe.top + (vh - safe.top - safe.bottom) * 0.5;

      appRoot.style.position = 'fixed';
      appRoot.style.width = `${DESIGN_W}px`;
      appRoot.style.height = `${DESIGN_H}px`;
      appRoot.style.left = `${Math.round(cx)}px`;
      appRoot.style.top = `${Math.round(cy)}px`;
      appRoot.style.transformOrigin = '50% 50%';
      appRoot.style.transform = `translate(-50%, -50%) rotate(90deg) scale(${scale.toFixed(4)})`;

      if (modalBackdrop) {
        modalBackdrop.style.transformOrigin = '50% 50%';
        modalBackdrop.style.width = `${vh}px`;
        modalBackdrop.style.height = `${vw}px`;
        modalBackdrop.style.left = `${Math.round((vw - vh) * 0.5)}px`;
        modalBackdrop.style.top = `${Math.round((vh - vw) * 0.5)}px`;
        modalBackdrop.style.transform = 'rotate(90deg)';
      }
      return;
    }

    // 恢复模态框常规方向
    Balatro.viewportRotated = false;
    if (modalBackdrop) {
      modalBackdrop.style.width = '';
      modalBackdrop.style.height = '';
      modalBackdrop.style.left = '';
      modalBackdrop.style.top = '';
      modalBackdrop.style.transform = '';
    }

    // 情况 B：iPhone / iPad 横屏或小窗口浏览器（小于 1280×700 时按安全区自动等比缩放）
    const availW = vw - safe.left - safe.right;
    const availH = vh - safe.top - safe.bottom;

    if (availW < DESIGN_W || availH < DESIGN_H) {
      const scale = Math.min(availW / DESIGN_W, availH / DESIGN_H);
      Balatro.viewportScale = scale;

      const scaledW = DESIGN_W * scale;
      const scaledH = DESIGN_H * scale;
      const leftPx = safe.left + (availW - scaledW) * 0.5;
      const topPx = safe.top + (availH - scaledH) * 0.5;

      appRoot.style.position = 'fixed';
      appRoot.style.width = `${DESIGN_W}px`;
      appRoot.style.height = `${DESIGN_H}px`;
      appRoot.style.left = `${Math.round(leftPx)}px`;
      appRoot.style.top = `${Math.round(topPx)}px`;
      appRoot.style.transformOrigin = '0 0';
      appRoot.style.transform = `scale(${scale.toFixed(4)})`;
    } else {
      // 情况 C：PC 大屏原生 1:1 铺满
      Balatro.viewportScale = 1;
      appRoot.style.position = 'relative';
      appRoot.style.width = '100vw';
      appRoot.style.height = '100vh';
      appRoot.style.left = '';
      appRoot.style.top = '';
      appRoot.style.transformOrigin = '';
      appRoot.style.transform = '';
    }
  };

  function bindTouchAndViewportEvents() {
    // 探测指针类型（区分手指触控与桌面鼠标）
    global.addEventListener('pointerdown', (e) => {
      Balatro.lastPointerType = e.pointerType || 'mouse';
      if (e.pointerType === 'touch') {
        Balatro.isTouchDevice = true;
        document.body.classList.add('is-touch-device');
      }
    }, { passive: true });

    // 阻止 iOS Safari 双指缩放手势破坏全屏牌桌布局
    document.addEventListener('gesturestart', (e) => e.preventDefault(), { passive: false });

    const btnForceRotate = document.getElementById('btn-force-landscape');
    if (btnForceRotate) {
      btnForceRotate.onclick = () => {
        Balatro.forceRotatedLandscape = true;
        Balatro.audio.play('button');
        Balatro.updateViewportLayout();
      };
    }

    const exitFab = document.getElementById('exit-rotate-fab');
    if (exitFab) {
      exitFab.onclick = () => {
        Balatro.forceRotatedLandscape = false;
        Balatro.audio.play('button');
        Balatro.updateViewportLayout();
      };
    }

    global.addEventListener('resize', () => Balatro.updateViewportLayout());
    global.addEventListener('orientationchange', () => {
      setTimeout(() => Balatro.updateViewportLayout(), 120);
    });
    if (global.visualViewport) {
      global.visualViewport.addEventListener('resize', () => Balatro.updateViewportLayout());
    }
  }

  global.addEventListener('DOMContentLoaded', () => {
    if ('ontouchstart' in global || navigator.maxTouchPoints > 0) {
      Balatro.isTouchDevice = true;
      document.body.classList.add('is-touch-device');
    }
    injectAppleTouchIconPNG();
    registerServiceWorker();
    bindTouchAndViewportEvents();
    Balatro.updateViewportLayout();
  });
})(window);

</script>
  <script>
'use strict';

/**
 * 游戏主控制器 (App Controller)
 * 串联 WebGL 漩涡背景、特效层、左侧实时 HUD、顶部小丑/消耗品槽、中央多态舞台、底部扇形手牌与快捷键
 */
(function initApp(global) {
  const Balatro = global.Balatro;

  class BalatroApp {
    constructor() {
      this.run = null;
      this.busyAnimating = false;
      this.activeCardMenuUid = null;

      this.bgShader = new Balatro.BackgroundShader(document.getElementById('bg-canvas'));
      this.fx = new Balatro.FXController(
        document.getElementById('fx-canvas'),
        document.getElementById('flame-canvas')
      );

      this._bindStaticButtons();
      this._bindKeyboardShortcuts();
      this._renderTitleHeroCards();
      this._startMainLoop();
      this.renderAll();
    }

    _startMainLoop() {
      let lastT = performance.now();
      const rootEl = document.getElementById('app-root');
      const tick = (now) => {
        const dt = Math.min(0.05, (now - lastT) / 1000);
        lastT = now;
        this.bgShader.render(dt);
        this.fx.updateAndRender(dt, rootEl);
        requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    }

    _renderTitleHeroCards() {
      const wrap = document.getElementById('title-hero-cards');
      if (!wrap) return;
      wrap.innerHTML = '';
      const demo1 = Balatro.createPlayingCard('Spades', 14, { edition: 'polychrome', seal: 'Red' });
      const demoJ = Balatro.createJokerInstance('j_joker', { edition: 'holo' });
      const demo2 = Balatro.createPlayingCard('Hearts', 13, { enhancement: 'gold', edition: 'foil' });
      [
        Balatro.renderPlayingCardEl(demo1, null),
        Balatro.renderJokerCardEl(demoJ, null),
        Balatro.renderPlayingCardEl(demo2, null)
      ].forEach((el) => wrap.appendChild(el));
    }

    _bindStaticButtons() {
      const contBtn = document.getElementById('btn-title-continue');
      if (contBtn) {
        contBtn.onclick = () => {
          const snap = Balatro.storage.profile.savedRun;
          if (snap) {
            try {
              this.run = Balatro.GameRun.fromJSON(snap);
              Balatro.audio.play('cardSlide');
              this.renderAll();
            } catch (err) {
              console.warn('恢复存档失败:', err);
              Balatro.storage.clearSavedRun();
              this.renderAll();
            }
          }
        };
      }
      document.getElementById('btn-title-play').onclick = () => {
        Balatro.openNewRunModal((cfg) => this.startNewRun(cfg));
      };
      document.getElementById('btn-title-collection').onclick = () => {
        Balatro.openCollectionModal(null);
      };
      document.getElementById('btn-title-options').onclick = () => {
        Balatro.openOptionsModal(this);
      };

      document.getElementById('btn-run-info').onclick = () => {
        if (this.run) Balatro.openRunInfoModal(this.run);
      };
      document.getElementById('btn-run-options').onclick = () => {
        Balatro.openOptionsModal(this);
      };

      document.getElementById('btn-play-hand').onclick = () => this.onPlayHandClicked();
      document.getElementById('btn-discard-hand').onclick = () => this.onDiscardClicked();
      document.getElementById('btn-sort-rank').onclick = () => {
        if (!this.run || this.busyAnimating) return;
        this.run.sortHand('rank');
        Balatro.audio.play('cardSlide');
        this.renderHandZone();
      };
      document.getElementById('btn-sort-suit').onclick = () => {
        if (!this.run || this.busyAnimating) return;
        this.run.sortHand('suit');
        Balatro.audio.play('cardSlide');
        this.renderHandZone();
      };
      document.getElementById('deck-pile-widget').onclick = () => {
        if (this.run) Balatro.openDeckViewerModal(this.run);
      };

      // 点击空白处收起卡牌下方使用/出售小按钮及触屏说明气泡
      document.addEventListener('pointerdown', (e) => {
        if (!e.target.closest('.bal-card') && !e.target.closest('#card-tooltip')) {
          this.activeCardMenuUid = null;
          document.querySelectorAll('.bal-card.active-actions').forEach((el) => el.classList.remove('active-actions'));
          if (Balatro.lastPointerType === 'touch') Balatro.hideTooltip();
        }
      });
    }

    _bindKeyboardShortcuts() {
      global.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT') return;
        const backdrop = document.getElementById('modal-backdrop');
        if (!backdrop.classList.contains('hidden')) {
          if (e.key === 'Escape') {
            backdrop.classList.add('hidden');
            backdrop.innerHTML = '';
          }
          return;
        }
        if (e.key === 'Escape') {
          Balatro.openOptionsModal(this);
          return;
        }
        if (!this.run || this.busyAnimating) return;
        if (this.run.state === Balatro.STATES.PLAYING) {
          if (e.code === 'Space' || e.key === 'Enter') {
            e.preventDefault();
            this.onPlayHandClicked();
          } else if (e.key === 'd' || e.key === 'D') {
            this.onDiscardClicked();
          } else if (e.key === 'r' || e.key === 'R') {
            this.run.sortHand('rank');
            Balatro.audio.play('cardSlide');
            this.renderHandZone();
          } else if (e.key === 's' || e.key === 'S') {
            this.run.sortHand('suit');
            Balatro.audio.play('cardSlide');
            this.renderHandZone();
          }
        }
      });
    }

    toast(msg) {
      if (!msg) return;
      const wrap = document.getElementById('toast-container');
      const div = document.createElement('div');
      div.className = 'bal-toast';
      div.innerHTML = Balatro.formatDesc(msg);
      wrap.appendChild(div);
      setTimeout(() => div.remove(), 2200);
    }

    startNewRun(cfg) {
      this.run = new Balatro.GameRun(cfg);
      this.busyAnimating = false;
      Balatro.audio.play('cardSlide');
      this.fx.resize();
      this.renderAll();
    }

    returnToTitle() {
      this.run = null;
      this.busyAnimating = false;
      this.fx.setFlame(0, false);
      this.renderAll();
    }

    _syncAtmosphere() {
      if (!this.run) {
        this.bgShader.setPalette('TITLE');
        Balatro.audio.setMusicMode('MAIN');
        return;
      }
      const st = this.run.state;
      if (st === Balatro.STATES.SHOP) {
        this.bgShader.setPalette('SHOP');
        Balatro.audio.setMusicMode('SHOP');
      } else if (st === Balatro.STATES.PACK_OPEN && this.run.packState) {
        const pk = this.run.packState.pack.packKind;
        if (pk === 'Celestial') this.bgShader.setPalette('PACK_PLANET');
        else if (pk === 'Spectral') this.bgShader.setPalette('PACK_SPECTRAL');
        else this.bgShader.setPalette('PACK_ARCANA');
        Balatro.audio.setMusicMode('PACK');
      } else if (st === Balatro.STATES.GAME_OVER) {
        this.bgShader.setPalette('GAME_OVER');
        Balatro.audio.setMusicMode('SHOP');
      } else if (st === Balatro.STATES.PLAYING || st === Balatro.STATES.SCORING) {
        const b = this.run.currentBlind;
        if (b && b.boss && !this.run.bossDisabled) {
          this.bgShader.setPalette('BOSS', b.color);
          Balatro.audio.setMusicMode('BOSS');
        } else if (this.run.ante > 8) {
          this.bgShader.setPalette('ENDLESS');
          Balatro.audio.setMusicMode('MAIN');
        } else {
          this.bgShader.setPalette('PLAY');
          Balatro.audio.setMusicMode('MAIN');
        }
      } else {
        this.bgShader.setPalette(this.run.ante > 8 ? 'ENDLESS' : 'BLIND_SELECT');
        Balatro.audio.setMusicMode('MAIN');
      }
    }

    renderAll() {
      Balatro.hideTooltip();
      this._syncAtmosphere();

      const titleEl = document.getElementById('title-screen');
      const runEl = document.getElementById('run-screen');

      if (!this.run) {
        titleEl.classList.remove('hidden');
        runEl.classList.add('hidden');
        document.getElementById('active-tags-strip').innerHTML = '';
        const contBtn = document.getElementById('btn-title-continue');
        const saved = Balatro.storage.profile.savedRun;
        if (contBtn) {
          if (saved) {
            contBtn.classList.remove('hidden');
            contBtn.textContent = `▶ 继续牌局 (底注 ${saved.ante})`;
          } else {
            contBtn.classList.add('hidden');
          }
        }
        return;
      }

      if (!this.busyAnimating && this.run.state !== Balatro.STATES.GAME_OVER) {
        Balatro.storage.saveRunSnapshot(this.run.toJSON());
      }

      titleEl.classList.add('hidden');
      runEl.classList.remove('hidden');
      this.fx.resize();

      this.renderHUD();
      this.renderTopTrays();
      this.renderCenterStage();
      this.renderHandZone();
      this.renderQueuedTagsStrip();
    }

    renderQueuedTagsStrip() {
      const strip = document.getElementById('active-tags-strip');
      if (!this.run) { strip.innerHTML = ''; return; }
      const pills = [];
      if (this.run.doubleTagStack > 0) {
        pills.push(`<div class="tag-mini-badge" style="--tag-col:#f43f5e">x2 双倍标签 ×${this.run.doubleTagStack}</div>`);
      }
      if (this.run.investmentTags > 0) {
        pills.push(`<div class="tag-mini-badge" style="--tag-col:#eab308">$ 投资标签 ×${this.run.investmentTags}</div>`);
      }
      if (this.run.juggleStacks > 0) {
        pills.push(`<div class="tag-mini-badge" style="--tag-col:#0ea5e9">+${this.run.juggleStacks} 杂耍手牌上限</div>`);
      }
      (this.run.pendingShopTags || []).forEach((tid) => {
        const tm = Balatro.TAG_MAP[tid];
        if (tm) pills.push(`<div class="tag-mini-badge" style="--tag-col:${tm.color}">[${tm.icon}] ${tm.name}</div>`);
      });
      strip.innerHTML = pills.join('');
    }

    renderHUD() {
      const run = this.run;
      if (!run) return;

      const activeBlind = (run.state === Balatro.STATES.PLAYING || run.state === Balatro.STATES.SCORING || run.state === Balatro.STATES.ROUND_EVAL)
        ? run.currentBlind
        : run.anteBlinds[run.blindIdx];

      const blindBox = document.getElementById('hud-blind-box');
      if (activeBlind) {
        blindBox.style.setProperty('--blind-accent', activeBlind.color || '#3b82f6');
        document.getElementById('hud-blind-name').textContent = `${activeBlind.symbol} ${activeBlind.name}`;
        document.getElementById('hud-blind-desc').textContent = (activeBlind.boss && run.bossDisabled)
          ? '（特殊能力已被无效化！）'
          : (activeBlind.boss ? activeBlind.desc : '');
        const tgt = (run.state === Balatro.STATES.PLAYING || run.state === Balatro.STATES.SCORING)
          ? run.targetScore
          : run.getBlindTargetScore(activeBlind);
        document.getElementById('hud-target-score').textContent = Balatro.formatNumber(tgt);
        const rw = (run.stake >= 2 && activeBlind.id === 'bl_small') ? 0 : activeBlind.dollars;
        document.getElementById('hud-blind-reward').textContent = rw > 0 ? `过关赏金: ${'$'.repeat(Math.min(6, rw))}` : '无基础赏金';
      }

      document.getElementById('hud-round-score').textContent = Balatro.formatNumber(run.roundScore);
      document.getElementById('hud-hands-left').textContent = run.handsLeft;
      document.getElementById('hud-discards-left').textContent = run.discardsLeft;
      document.getElementById('hud-money').textContent = Balatro.formatMoney(run.money);
      document.getElementById('hud-ante').textContent = `${run.ante} / 8`;
      document.getElementById('hud-round').textContent = run.round;

      if (!this.busyAnimating) {
        this.updateHandPreviewHUD();
      }
    }

    /** 实时预览当前勾选的手牌构成的牌型、等级与基础筹码×倍率 */
    updateHandPreviewHUD() {
      const run = this.run;
      const previewEl = document.getElementById('hud-hand-preview');
      const chipsEl = document.getElementById('hud-chips-val');
      const multEl = document.getElementById('hud-mult-val');
      if (!run) return;

      if (run.state !== Balatro.STATES.PLAYING) {
        previewEl.innerHTML = '<span style="color:#64748b;font-size:14px;">等待出牌</span>';
        chipsEl.textContent = '0';
        multEl.textContent = '0';
        return;
      }

      const selected = run.hand.filter((c) => c.selected);
      if (selected.length === 0) {
        previewEl.innerHTML = '<span style="color:#94a3b8;font-size:14px;">请选择 1~5 张手牌</span>';
        chipsEl.textContent = '0';
        multEl.textContent = '0';
        return;
      }

      if (selected.some((c) => c.faceDown)) {
        previewEl.innerHTML = '<span>???</span> <span class="hud-hand-lv">未知牌面</span>';
        chipsEl.textContent = '?';
        multEl.textContent = '?';
        return;
      }

      const ev = Balatro.evaluatePokerHand(selected, run);
      const st = run.getHandLevel(ev.handId);
      const b = run.currentBlind;
      let warn = '';
      if (b && b.boss && !run.bossDisabled) {
        if (b.id === 'bl_psychic' && selected.length < 5) warn = ' <span class="hl-mult">(不满5张不计分!)</span>';
        else if (b.id === 'bl_eye' && run.handsPlayedThisRoundMap[ev.handId]) warn = ' <span class="hl-mult">(已打过!)</span>';
        else if (b.id === 'bl_mouth' && run.lockedMouthHand && run.lockedMouthHand !== ev.handId) warn = ' <span class="hl-mult">(非锁定牌型!)</span>';
      }

      previewEl.innerHTML = `<span>${ev.displayName}</span> <span class="hud-hand-lv">Lv.${st.level}</span>${warn}`;
      chipsEl.textContent = Balatro.formatNumber(st.chips);
      multEl.textContent = Balatro.formatNumber(st.mult);
    }

    /** 渲染顶部小丑栏（可左右拖拽换位 + 点击出售）与消耗品栏（点击使用/出售） */
    renderTopTrays() {
      const run = this.run;
      const jokerTray = document.getElementById('joker-tray');
      const consTray = document.getElementById('consumable-tray');
      if (!run) return;

      // 1. 小丑栏
      jokerTray.innerHTML = `<div class="slot-tray-count">小丑牌 ${run.jokers.length} / ${run.getEffectiveJokerSlots()}</div>`;
      if (run.jokers.length === 0) {
        const hint = document.createElement('div');
        hint.className = 'slot-tray-hint';
        hint.textContent = run.jokerSlots === 0 ? '无小丑槽位' : '小丑牌槽位（可左右拖拽调整 +倍率 与 X倍率 结算顺序）';
        jokerTray.appendChild(hint);
      } else {
        run.jokers.forEach((jk) => {
          const el = Balatro.renderJokerCardEl(jk, run);
          if (!this.busyAnimating && !jk.eternal) {
            const sellVal = Balatro.getSellValue(jk, run);
            const pills = document.createElement('div');
            pills.className = 'card-action-pills';
            pills.innerHTML = `<button class="mini-act-btn btn-green">出售 $${sellVal}</button>`;
            pills.querySelector('button').onclick = (e) => {
              e.stopPropagation();
              const res = run.sellOwnedCard(jk.uid);
              if (res.ok) {
                Balatro.audio.play(res.sfx || 'coin');
                this.toast(res.msg);
                this.renderAll();
              } else {
                Balatro.audio.play('nope');
                this.toast(res.msg);
              }
            };
            el.appendChild(pills);
          }
          jokerTray.appendChild(el);
        });

        if (!this.busyAnimating) {
          Balatro.bindSortableCardRow(jokerTray, run.jokers, {
            canDragItem: (item) => !item.pinnedLeft,
            onReorder: () => this.renderTopTrays(),
            onClick: (item, el) => {
              document.querySelectorAll('.bal-card.active-actions').forEach((n) => { if (n !== el) n.classList.remove('active-actions'); });
              const active = el.classList.toggle('active-actions');
              if (Balatro.lastPointerType === 'touch') {
                if (active) Balatro.inspectCardOnTouch(el);
                else Balatro.hideTooltip();
              }
            }
          });
        }
      }

      // 2. 消耗品栏
      consTray.innerHTML = `<div class="slot-tray-count">消耗品 ${run.consumables.length} / ${run.getEffectiveConsumableSlots()}</div>`;
      if (run.consumables.length === 0) {
        const hint = document.createElement('div');
        hint.className = 'slot-tray-hint';
        hint.textContent = '塔罗 / 星球 / 幻灵';
        consTray.appendChild(hint);
      } else {
        run.consumables.forEach((cs) => {
          const el = Balatro.renderSpecialCardEl(cs, run);
          if (!this.busyAnimating) {
            const canUse = Balatro.canUseConsumable(run, cs);
            const sellVal = Balatro.getSellValue(cs, run);
            const pills = document.createElement('div');
            pills.className = 'card-action-pills';
            pills.innerHTML = `
              <button class="mini-act-btn btn-red" data-act="use" ${!canUse.ok ? 'style="opacity:0.5"' : ''}>使用</button>
              <button class="mini-act-btn btn-green" data-act="sell">售 $${sellVal}</button>
            `;
            pills.querySelector('[data-act="use"]').onclick = (e) => {
              e.stopPropagation();
              const check = Balatro.canUseConsumable(run, cs);
              if (!check.ok) {
                Balatro.audio.play('nope');
                this.toast(check.reason);
                return;
              }
              const idx = run.consumables.findIndex((x) => x.uid === cs.uid);
              if (idx !== -1) run.consumables.splice(idx, 1);
              const res = Balatro.applyConsumable(run, cs, false);
              Balatro.audio.play(res.sfx || 'tarot');
              if (res.burnedCards && res.burnedCards.length > 0) {
                this.fx.spawnBurnParticles(global.innerWidth * 0.55, global.innerHeight * 0.72, 220, 90);
              }
              this.toast(res.message);
              this.renderAll();
            };
            pills.querySelector('[data-act="sell"]').onclick = (e) => {
              e.stopPropagation();
              const res = run.sellOwnedCard(cs.uid);
              if (res.ok) {
                Balatro.audio.play('coin');
                this.toast(res.msg);
                this.renderAll();
              }
            };
            el.appendChild(pills);
            el.onclick = () => {
              document.querySelectorAll('.bal-card.active-actions').forEach((n) => { if (n !== el) n.classList.remove('active-actions'); });
              const active = el.classList.toggle('active-actions');
              if (Balatro.lastPointerType === 'touch') {
                if (active) Balatro.inspectCardOnTouch(el);
                else Balatro.hideTooltip();
              }
            };
          }
          consTray.appendChild(el);
        });
      }
    }

    /** 渲染中央舞台（选盲注 / 出牌毡面 / 收据结算单 / 商店 / 开包舞台 / 胜利与失败结算） */
    renderCenterStage() {
      const run = this.run;
      const arena = document.getElementById('center-arena');
      arena.innerHTML = '';
      if (!run) return;

      switch (run.state) {
        case Balatro.STATES.BLIND_SELECT:
          this._renderBlindSelectArena(arena);
          break;
        case Balatro.STATES.PLAYING:
        case Balatro.STATES.SCORING:
          this._renderPlayingArena(arena);
          break;
        case Balatro.STATES.ROUND_EVAL:
          this._renderCashOutArena(arena);
          break;
        case Balatro.STATES.SHOP:
          this._renderShopArena(arena);
          break;
        case Balatro.STATES.PACK_OPEN:
          this._renderPackOpenArena(arena);
          break;
        case Balatro.STATES.VICTORY:
          this._renderEndSummaryArena(arena, true);
          break;
        case Balatro.STATES.GAME_OVER:
          this._renderEndSummaryArena(arena, false);
          break;
        default:
          break;
      }
    }

    _renderBlindSelectArena(arena) {
      const run = this.run;
      const grid = document.createElement('div');
      grid.className = 'blind-select-grid';

      const canRerollBoss = run.vouchers['v_retcon'] || (run.vouchers['v_directors_cut'] && !run.bossRerolledThisAnte);

      run.anteBlinds.forEach((b, idx) => {
        const isCurrent = idx === run.blindIdx;
        const isPast = idx < run.blindIdx;
        const col = document.createElement('div');
        col.className = `blind-column ${isCurrent ? 'is-active' : (isPast ? 'is-defeated' : 'is-upcoming')}`;

        const req = run.getBlindTargetScore(b);
        const tag = idx < 2 ? run.anteTags[idx] : null;
        let tagDesc = tag ? tag.desc : '';
        if (tag && tag.id === 'tag_orbital') {
          tagDesc = `将 {C:attention}${tag.orbitalHandName}{} 立即提升 {C:planet}3 个等级{}`;
        }

        col.innerHTML = `
          <button class="bal-btn ${isCurrent ? 'btn-orange' : 'btn-slate'}" data-selblind="${idx}" style="width:100%;font-size:17px;" ${!isCurrent ? 'disabled' : ''}>
            ${isPast ? '已通过' : (isCurrent ? '▶ 选择挑战' : '待解锁')}
          </button>
          <div style="font-size:18px;margin-top:2px;">${b.name}</div>
          <div class="blind-chip-emblem" style="background:${b.color}">${b.symbol}</div>
          <div style="font-size:12px;color:#cbd5e1;text-align:center;min-height:32px;">${b.desc}</div>
          <div class="blind-col-score">
            <div style="font-size:11px;color:#94a3b8;">过关至少得分</div>
            <div style="font-size:22px;color:var(--mult-red);font-weight:900;">${Balatro.formatNumber(req)}</div>
          </div>
          ${idx < 2 && tag ? `
            <div class="skip-tag-box">
              <div style="font-size:12px;color:${tag.color};margin-bottom:4px;">[${tag.icon}] ${tag.name}</div>
              <div style="font-size:11px;color:#cbd5e1;margin-bottom:8px;line-height:1.35;">${Balatro.formatDesc(tagDesc)}</div>
              <button class="bal-btn btn-red" data-skipblind="${idx}" style="width:100%;font-size:13px;padding:6px;" ${!isCurrent ? 'disabled' : ''}>跳过盲注</button>
            </div>
          ` : `
            <div class="skip-tag-box">
              <div style="font-size:12px;color:#facc15;margin-bottom:6px;">底注 ${run.ante} 守关 Boss</div>
              ${canRerollBoss ? `<button class="bal-btn btn-gold" id="btn-reroll-boss" style="width:100%;font-size:13px;padding:6px;" ${!run.canAfford(10) ? 'disabled' : ''}>🎲 重掷 Boss ($10)</button>` : '<div style="font-size:11px;color:#64748b;">不可跳过</div>'}
            </div>
          `}
        `;
        grid.appendChild(col);
      });

      arena.appendChild(grid);

      const selBtn = grid.querySelector(`[data-selblind="${run.blindIdx}"]`);
      if (selBtn) {
        selBtn.onclick = () => {
          Balatro.audio.play('cardSlide');
          run.startBlind();
          this.renderAll();
        };
      }
      const skipBtn = grid.querySelector(`[data-skipblind="${run.blindIdx}"]`);
      if (skipBtn) {
        skipBtn.onclick = () => {
          Balatro.audio.play('coin');
          const notes = run.skipCurrentBlind() || [];
          notes.forEach((n) => this.toast(n));
          this.renderAll();
        };
      }
      const rerollBossBtn = document.getElementById('btn-reroll-boss');
      if (rerollBossBtn) {
        rerollBossBtn.onclick = () => {
          if (run.rerollBossBlind(false)) {
            Balatro.audio.play('reroll');
            this.toast(`Boss 已重掷为「${run.anteBoss.name}」！`);
            this.renderAll();
          }
        };
      }
    }

    _renderPlayingArena(arena) {
      const stage = document.createElement('div');
      stage.className = 'played-cards-stage';
      this.run.playedZone.forEach((c) => {
        stage.appendChild(Balatro.renderPlayingCardEl(c, this.run));
      });
      arena.appendChild(stage);
    }

    _renderCashOutArena(arena) {
      const sum = this.run.cashOutSummary || { lines: [], totalPayout: 0, roundEndNotes: [] };
      const box = document.createElement('div');
      box.className = 'cashout-receipt';
      box.innerHTML = `
        <button class="bal-btn btn-orange" id="btn-cash-out" style="font-size:22px;padding:14px;">
          套现收款：+$${sum.totalPayout} ▶
        </button>
        <div class="cashout-list">
          ${sum.lines.map((l) => `
            <div class="cashout-row">
              <span>${l.label}</span>
              <span class="hl-money">${l.amount > 0 ? '$' + l.amount : '-'}</span>
            </div>
          `).join('')}
          ${(sum.roundEndNotes || []).map((n) => `
            <div class="cashout-row" style="color:#fb923c;">
              <span>• ${n}</span><span></span>
            </div>
          `).join('')}
        </div>
      `;
      arena.appendChild(box);
      document.getElementById('btn-cash-out').onclick = () => {
        Balatro.audio.play('coin');
        this.run.cashOutAndEnterShop();
        this.renderAll();
      };
    }

    _renderShopArena(arena) {
      const run = this.run;
      const cab = document.createElement('div');
      cab.className = 'shop-cabinet';

      const rerollPrice = run.shop.rerollCost;
      cab.innerHTML = `
        <div class="shop-top-row">
          <div class="shop-sign-actions">
            <div class="shop-neon-sign">SHOP</div>
            <button class="bal-btn btn-red" id="btn-leave-shop" style="font-size:16px;padding:11px;">下一回合 ▶</button>
            <button class="bal-btn btn-green" id="btn-reroll-shop" style="font-size:15px;padding:10px;" ${!run.canAfford(rerollPrice) ? 'disabled' : ''}>
              🎲 重掷 ($${rerollPrice})
            </button>
          </div>
          <div class="shop-shelf-box" id="shop-items-row"></div>
        </div>
        <div class="shop-bottom-row">
          <div class="shop-sub-box" id="shop-voucher-row">
            <span class="shop-sub-label">底注 ${run.ante} 优惠券</span>
          </div>
          <div class="shop-sub-box" id="shop-packs-row">
            <span class="shop-sub-label">补充包 (Booster Packs)</span>
          </div>
        </div>
      `;
      arena.appendChild(cab);

      const renderBuyable = (container, list, category) => {
        if (list.length === 0) {
          const empty = document.createElement('span');
          empty.style.cssText = 'color:#64748b;font-size:13px;';
          empty.textContent = '已售罄';
          container.appendChild(empty);
          return;
        }
        list.forEach((it) => {
          let el = null;
          if (it.kind === 'Joker') el = Balatro.renderJokerCardEl(it, run);
          else if (it.kind === 'PlayingCard') el = Balatro.renderPlayingCardEl(it, run);
          else el = Balatro.renderSpecialCardEl(it, run);

          const price = Balatro.getBuyCost(it, run);
          const tag = document.createElement('div');
          tag.className = 'shop-price-tag';
          tag.textContent = price === 0 ? '免费!' : `$${price}`;
          el.appendChild(tag);

          const isCons = it.kind === 'Tarot' || it.kind === 'Planet' || it.kind === 'Spectral';
          const pills = document.createElement('div');
          pills.className = 'card-action-pills hover-show';
          pills.innerHTML = `
            <button class="mini-act-btn btn-orange" data-buy="hold">${category === 'pack' ? '拆开' : (category === 'voucher' ? '兑换' : '购买')}</button>
            ${isCons && Balatro.canUseConsumable(run, it).ok ? '<button class="mini-act-btn btn-red" data-buy="use">买并使用</button>' : ''}
          `;

          pills.querySelectorAll('button').forEach((btn) => {
            btn.onclick = (e) => {
              e.stopPropagation();
              const res = run.buyShopEntry(category, it.uid, btn.dataset.buy === 'use');
              if (res.ok) {
                Balatro.audio.play(res.sfx || 'coin');
                this.toast(res.msg);
                this.renderAll();
              } else {
                Balatro.audio.play('nope');
                this.toast(res.msg);
              }
            };
          });
          el.appendChild(pills);
          el.onclick = () => {
            if (Balatro.lastPointerType === 'touch' && !el.classList.contains('active-actions')) {
              document.querySelectorAll('.bal-card.active-actions').forEach((n) => n.classList.remove('active-actions'));
              el.classList.add('active-actions');
              Balatro.audio.play('cardFocus');
              Balatro.inspectCardOnTouch(el);
              return;
            }
            const res = run.buyShopEntry(category, it.uid, false);
            if (res.ok) {
              Balatro.audio.play(res.sfx || 'coin');
              this.toast(res.msg);
              this.renderAll();
            } else {
              Balatro.audio.play('nope');
              this.toast(res.msg);
            }
          };
          container.appendChild(el);
        });
      };

      renderBuyable(document.getElementById('shop-items-row'), run.shop.items, 'item');
      renderBuyable(document.getElementById('shop-voucher-row'), run.shop.vouchers, 'voucher');
      renderBuyable(document.getElementById('shop-packs-row'), run.shop.packs, 'pack');

      document.getElementById('btn-reroll-shop').onclick = () => {
        if (run.rerollShop()) {
          Balatro.audio.play('reroll');
          this.renderAll();
        }
      };
      document.getElementById('btn-leave-shop').onclick = () => {
        Balatro.audio.play('cardSlide');
        const notes = run.leaveShop();
        notes.forEach((n) => this.toast(n));
        this.renderAll();
      };
    }

    _renderPackOpenArena(arena) {
      const run = this.run;
      const ps = run.packState;
      if (!ps) return;

      const wrap = document.createElement('div');
      wrap.className = 'pack-open-stage';
      wrap.innerHTML = `
        <div style="font-size:20px;">正在开启：${ps.pack.name} <span class="hl-attn">(还可选择 ${ps.choosesLeft} 张)</span></div>
        <div style="font-size:12px;color:#cbd5e1;">${ps.tempHand ? '提示：需要指定目标的塔罗/幻灵牌，请先在下方扇形手牌中点选或拖拽调整左右顺序！' : '点击任意一张卡牌立即获取或生效'}</div>
        <div class="pack-cards-row" id="pack-cards-container"></div>
        <button class="bal-btn btn-slate" id="btn-skip-pack">跳过剩余卡牌 ▶</button>
      `;
      arena.appendChild(wrap);

      const row = document.getElementById('pack-cards-container');
      ps.cards.forEach((c) => {
        let el = null;
        if (c.kind === 'Joker') el = Balatro.renderJokerCardEl(c, run);
        else if (c.kind === 'PlayingCard') el = Balatro.renderPlayingCardEl(c, run);
        else el = Balatro.renderSpecialCardEl(c, run);

        const doPick = () => {
          const res = run.pickCardFromPack(c.uid);
          if (res.ok) {
            Balatro.audio.play(res.sfx || 'cardSelect');
            if (res.burnedCards && res.burnedCards.length > 0) {
              this.fx.spawnBurnParticles(global.innerWidth * 0.55, global.innerHeight * 0.72, 220, 90);
            }
            this.toast(res.msg);
            this.renderAll();
          } else {
            Balatro.audio.play('nope');
            this.toast(res.msg);
          }
        };

        const pills = document.createElement('div');
        pills.className = 'card-action-pills hover-show';
        pills.innerHTML = `<button class="mini-act-btn btn-orange">${c.kind === 'Joker' || c.kind === 'PlayingCard' ? '选择获取' : '选择使用'}</button>`;
        pills.querySelector('button').onclick = (e) => {
          e.stopPropagation();
          doPick();
        };
        el.appendChild(pills);

        el.onclick = () => {
          if (Balatro.lastPointerType === 'touch' && !el.classList.contains('active-actions')) {
            document.querySelectorAll('.bal-card.active-actions').forEach((n) => n.classList.remove('active-actions'));
            el.classList.add('active-actions');
            Balatro.audio.play('cardFocus');
            Balatro.inspectCardOnTouch(el);
            return;
          }
          doPick();
        };
        row.appendChild(el);
      });

      document.getElementById('btn-skip-pack').onclick = () => {
        Balatro.audio.play('button');
        run.skipCurrentPack();
        this.renderAll();
      };
    }

    _renderEndSummaryArena(arena, isWin) {
      const run = this.run;
      const most = run.getMostPlayedHands()[0];
      const mostName = most && Balatro.POKER_HAND_MAP[most] ? Balatro.POKER_HAND_MAP[most].name : '无';

      const box = document.createElement('div');
      box.className = 'cashout-receipt';
      box.style.borderColor = isWin ? '#facc15' : '#fe5f55';
      box.style.width = '500px';
      box.innerHTML = `
        <div style="text-align:center;font-size:32px;color:${isWin ? '#facc15' : '#fe5f55'};font-weight:900;">
          ${isWin ? '🏆 恭喜赢下牌局！(YOU WIN!)' : '💀 牌局结束 (GAME OVER)'}
        </div>
        <div class="cashout-list">
          <div class="cashout-row"><span>单手最高得分</span><span class="hl-mult">${Balatro.formatNumber(run.bestHandScore)}</span></div>
          <div class="cashout-row"><span>最常打出牌型</span><span class="hl-chips">${mostName}</span></div>
          <div class="cashout-row"><span>到达底注 / 回合</span><span>底注 ${run.ante} · 第 ${run.round} 回合</span></div>
          <div class="cashout-row"><span>累计打出 / 弃掉卡牌</span><span>${run.cardsPlayedTotal} 张 / ${run.cardsDiscardedTotal} 张</span></div>
          <div class="cashout-row"><span>牌局随机种子 (Seed)</span><span class="hl-money">${run.rng.seed}</span></div>
        </div>
        <div style="display:flex;gap:10px;justify-content:center;margin-top:6px;">
          ${isWin ? '<button class="bal-btn btn-blue" id="btn-go-endless" style="flex:1;font-size:16px;">♾ 进入无尽模式</button>' : ''}
          <button class="bal-btn btn-green" id="btn-end-newrun" style="flex:1;font-size:16px;">🔄 新的一局</button>
          <button class="bal-btn btn-slate" id="btn-end-title">主菜单</button>
        </div>
      `;
      arena.appendChild(box);

      if (isWin) {
        Balatro.audio.play('win');
        document.getElementById('btn-go-endless').onclick = () => {
          run.endless = true;
          run.cashOutAndEnterShop();
          this.renderAll();
        };
      } else {
        Balatro.audio.play('lose');
      }

      document.getElementById('btn-end-newrun').onclick = () => {
        Balatro.openNewRunModal((cfg) => this.startNewRun(cfg));
      };
      document.getElementById('btn-end-title').onclick = () => {
        this.returnToTitle();
      };
    }

    /** 渲染底部扇形手牌（支持打牌态与秘术/幻灵开包态）与右侧牌堆组件 */
    renderHandZone() {
      const run = this.run;
      const bottomZone = document.getElementById('bottom-hand-zone');
      const handRow = document.getElementById('hand-cards-row');
      const controlsBar = document.getElementById('hand-controls-bar');

      if (!run) return;
      const showHand = run.state === Balatro.STATES.PLAYING
        || run.state === Balatro.STATES.SCORING
        || (run.state === Balatro.STATES.PACK_OPEN && run.packState && run.packState.tempHand);

      // 同步右下牌组背面颜色与剩余计数
      const deckMeta = Balatro.DECK_MAP[run.deckId] || Balatro.DECKS[0];
      document.getElementById('deck-pile-widget').style.setProperty('--deck-back-color', deckMeta.color);
      document.getElementById('deck-count-text').textContent = `${run.drawPile.length} / ${run.masterDeck.length}`;

      if (!showHand) {
        bottomZone.classList.add('compact-bottom');
        handRow.innerHTML = '';
        controlsBar.style.visibility = 'hidden';
        return;
      }
      bottomZone.classList.remove('compact-bottom');

      const activeHand = run.getInteractiveHand();
      const overlap = activeHand.length > 9 ? Math.max(-38, -10 - (activeHand.length - 8) * 5) : -10;
      handRow.style.setProperty('--hand-overlap', `${overlap}px`);
      handRow.innerHTML = '';

      activeHand.forEach((card) => {
        const el = Balatro.renderPlayingCardEl(card, run);
        handRow.appendChild(el);
      });

      if (!this.busyAnimating) {
        Balatro.bindSortableCardRow(handRow, activeHand, {
          canDragItem: () => true,
          onReorder: () => {
            this.renderHandZone();
            this.updateHandPreviewHUD();
          },
          onClick: (card) => {
            if (card.forcedSelect) {
              Balatro.audio.play('nope');
              this.toast('蔚蓝铃铛强制锁定了这张牌！');
              return;
            }
            if (!card.selected) {
              const curSel = activeHand.filter((c) => c.selected).length;
              if (curSel >= 5) {
                Balatro.audio.play('nope');
                return;
              }
              card.selected = true;
              Balatro.audio.play('cardSelect');
            } else {
              card.selected = false;
              Balatro.audio.play('cardDeselect');
            }
            this.renderHandZone();
            this.renderTopTrays();
            this.updateHandPreviewHUD();
          }
        });
      }

      // 出牌与弃牌按钮仅在 PLAYING 状态显示可用，并同步高亮当前理牌模式按钮
      const curSort = run.sortMode || 'rank';
      document.getElementById('btn-sort-rank').classList.toggle('sort-active', curSort === 'rank');
      document.getElementById('btn-sort-suit').classList.toggle('sort-active', curSort === 'suit');

      if (run.state === Balatro.STATES.PLAYING) {
        controlsBar.style.visibility = 'visible';
        const selCount = activeHand.filter((c) => c.selected).length;
        document.getElementById('btn-play-hand').disabled = this.busyAnimating || selCount === 0 || run.handsLeft <= 0;
        document.getElementById('btn-discard-hand').disabled = this.busyAnimating || selCount === 0 || run.discardsLeft <= 0;
      } else {
        controlsBar.style.visibility = 'hidden';
      }
    }

    async onPlayHandClicked() {
      if (!this.run || this.busyAnimating || this.run.state !== Balatro.STATES.PLAYING) return;
      const packet = this.run.playSelectedHand();
      if (!packet) return;

      this.busyAnimating = true;
      Balatro.hideTooltip();
      (packet.hookFeedback || []).forEach((f) => this.toast(f));
      this.renderAll();

      await Balatro.playScoringTimeline(this.run, packet, {
        fx: this.fx,
        bg: this.bgShader,
        onMoneySync: () => {
          document.getElementById('hud-money').textContent = Balatro.formatMoney(this.run.money);
        },
        onCalcUpdate: (chips, mult) => {
          const cEl = document.getElementById('hud-chips-val');
          const mEl = document.getElementById('hud-mult-val');
          cEl.textContent = Balatro.formatNumber(chips);
          mEl.textContent = Balatro.formatNumber(mult);
          cEl.parentElement.classList.remove('bump');
          mEl.parentElement.classList.remove('bump');
          void cEl.offsetWidth;
          cEl.parentElement.classList.add('bump');
          mEl.parentElement.classList.add('bump');
        }
      });

      const outcome = this.run.finishHandResolution(packet.pipelineResult);
      if (outcome === 'SAVED_BY_BONES') {
        this.toast('🦴 骨头先生粉碎自身，救了你一命！');
      }
      this.busyAnimating = false;
      this.renderAll();
    }

    onDiscardClicked() {
      if (!this.run || this.busyAnimating || this.run.state !== Balatro.STATES.PLAYING) return;
      const notes = this.run.discardSelected();
      if (!notes) return;
      Balatro.audio.play('cardSlide');
      notes.forEach((n) => this.toast(n));
      this.renderAll();
    }
  }

  global.addEventListener('DOMContentLoaded', () => {
    Balatro.app = new BalatroApp();
  });
})(window);

</script>
