    const hasScoringFace = scoringCards.some((c) => Balatro.isFaceCard(c, run));
    run.jokers.forEach((jk) => {
      if (jk.debuffed) return;
      if (jk.id === 'j_green_joker') {
        jk.state.mult = (jk.state.mult || 0) + 1;
        pushEvt({ type: 'joker_scale', jokerUid: jk.uid, text: '+1 倍率', color: '#ef4444', sfx: 'mult' });
      } else if (jk.id === 'j_ride_the_bus') {
        if (hasScoringFace) {
          if (jk.state.mult > 0) {
            jk.state.mult = 0;
            pushEvt({ type: 'joker_scale', jokerUid: jk.uid, text: '重置!', color: '#94a3b8', sfx: 'nope' });
          }
        } else {
          jk.state.mult = (jk.state.mult || 0) + 1;
          pushEvt({ type: 'joker_scale', jokerUid: jk.uid, text: '+1 倍率', color: '#ef4444', sfx: 'mult' });
        }
      } else if (jk.id === 'j_runner' && contains['Straight']) {
        jk.state.chips = (jk.state.chips || 0) + 15;
        pushEvt({ type: 'joker_scale', jokerUid: jk.uid, text: '+15 筹码', color: '#009dff', sfx: 'chip' });
      } else if (jk.id === 'j_square' && playedCards.length === 4) {
        jk.state.chips = (jk.state.chips || 0) + 4;
        pushEvt({ type: 'joker_scale', jokerUid: jk.uid, text: '+4 筹码', color: '#009dff', sfx: 'chip' });
      } else if (jk.id === 'j_trousers' && contains['Two Pair']) {
        jk.state.mult = (jk.state.mult || 0) + 2;
        pushEvt({ type: 'joker_scale', jokerUid: jk.uid, text: '+2 倍率', color: '#ef4444', sfx: 'mult' });
      } else if (jk.id === 'j_obelisk') {
        if (mostPlayedHandsBefore.includes(handId) && run.totalHandsPlayed > 1) {
          jk.state.xMult = 1.0;
          pushEvt({ type: 'joker_scale', jokerUid: jk.uid, text: '重置 X1!', color: '#94a3b8', sfx: 'nope' });
        } else {
          jk.state.xMult = Number(((jk.state.xMult || 1.0) + 0.2).toFixed(2));
          pushEvt({ type: 'joker_scale', jokerUid: jk.uid, text: '升级 X' + jk.state.xMult, color: '#ef4444', sfx: 'xmult' });
        }
      } else if (jk.id === 'j_vampire') {
        let drained = 0;
        scoringCards.forEach((sc) => {
          if (!sc.debuffed && sc.enhancement) {
            sc.enhancement = null;
            drained++;
          }
        });
        if (drained > 0) {
          jk.state.xMult = Number(((jk.state.xMult || 1.0) + drained * 0.1).toFixed(2));
          pushEvt({ type: 'joker_scale', jokerUid: jk.uid, text: `吸取! X${jk.state.xMult}`, color: '#ef4444', sfx: 'xmult' });
        }
      } else if (jk.id === 'j_midas_mask') {
        let gilded = 0;
        scoringCards.forEach((sc) => {
          if (!sc.debuffed && Balatro.isFaceCard(sc, run)) {
            sc.enhancement = 'gold';
            gilded++;
          }
        });
        if (gilded > 0) {
          pushEvt({ type: 'joker_scale', jokerUid: jk.uid, text: '点金!', color: '#facc15', sfx: 'coin' });
        }
      } else if (jk.id === 'j_sixth_sense' && run.handsPlayedInRound === 1 && playedCards.length === 1) {
        const only = playedCards[0];
        if (!Balatro.isStoneCard(only) && only.rank === 6) {
          sixthSenseDestroyUid = only.uid;
          run.spawnRandomConsumable('Spectral');
          pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, text: '+幻灵牌!', color: '#6366f1', sfx: 'spectral' });
        }
      }
    });

    // 出牌瞬间支持蓝图/头脑风暴复制的触发器（DNA、太空小丑、待办清单、流浪者、叠加态、降神会、斗牛士）
    run.jokers.forEach((jk) => {
      const eff = Balatro.resolveJokerEffect(jk, run.jokers);
      if (!eff) return;

      if (eff.id === 'j_dna' && run.handsPlayedInRound === 1 && playedCards.length === 1) {
        const cloned = Balatro.clonePlayingCard(playedCards[0], false);
        run.addPlayingCardToDeck(cloned, true);
        heldCards.push(cloned);
        pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, text: '复制 DNA!', color: '#ec4899', sfx: 'tarot' });
      } else if (eff.id === 'j_space') {
        if (run.rng.chance(1, 4, probMult, 'space_joker')) {
          run.upgradeHand(handId, 1);
          pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, text: '升级牌型!', color: '#38bdf8', sfx: 'planet' });
        }
      } else if (eff.id === 'j_todo_list' && eff.state && eff.state.targetHand === handId) {
        run.addMoney(4);
        pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, text: '+$4', color: '#eab308', sfx: 'coin' });
      } else if (eff.id === 'j_vagabond' && run.money <= 4) {
        if (run.spawnRandomConsumable('Tarot')) {
          pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, text: '+塔罗牌', color: '#a855f7', sfx: 'tarot' });
        }
      } else if (eff.id === 'j_superposition' && contains['Straight'] && scoringCards.some((c) => !Balatro.isStoneCard(c) && c.rank === 14)) {
        if (run.spawnRandomConsumable('Tarot')) {
          pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, text: '+塔罗牌', color: '#a855f7', sfx: 'tarot' });
        }
      } else if (eff.id === 'j_seance' && contains['Straight Flush']) {
        if (run.spawnRandomConsumable('Spectral')) {
          pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, text: '+幻灵牌', color: '#6366f1', sfx: 'spectral' });
        }
      } else if (eff.id === 'j_matador' && bossTriggeredThisHand) {
        run.addMoney(8);
        pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, text: '+$8', color: '#eab308', sfx: 'coin' });
      }
    });

    // ==================== 阶段 2：读取牌型基础筹码与倍率 ====================
    const handStats = run.getHandLevel(handId);
    curChips = handStats.chips;
    curMult = handStats.mult;

    if (bossActive && blind.id === 'bl_flint') {
      curChips = Math.max(1, Math.round(curChips * 0.5));
      curMult = Math.max(1, Math.round(curMult * 0.5));
      pushEvt({ type: 'boss_shout', text: '燧石减半!', color: '#f97316', sfx: 'mult' });
    } else {
      pushEvt({ type: 'hand_base', text: `${evalRes.displayName} Lv.${handStats.level}`, sfx: 'cardSelect' });
    }

    // ==================== 阶段 3：出牌区从左到右逐张计分与重触发 ====================
    const firstScoringFace = scoringCards.find((c) => Balatro.isFaceCard(c, run));

    for (let sIdx = 0; sIdx < scoringCards.length; sIdx++) {
      const card = scoringCards[sIdx];
      if (!scoringSet.has(card.uid)) continue;

      if (card.debuffed) {
        pushEvt({ type: 'card_debuff', cardUid: card.uid, text: '已失效!', color: '#94a3b8', sfx: 'nope' });
        continue;
      }

      // 统计该张计分牌的总重触发次数
      let retriggers = 0;
      if (card.seal === 'Red') retriggers += 1;

      run.jokers.forEach((jk) => {
        const eff = Balatro.resolveJokerEffect(jk, run.jokers);
        if (!eff) return;
        if (eff.id === 'j_hanging_chad' && sIdx === 0) retriggers += 2;
        else if (eff.id === 'j_sock_and_buskin' && Balatro.isFaceCard(card, run)) retriggers += 1;
        else if (eff.id === 'j_hack' && !Balatro.isStoneCard(card) && (card.rank >= 2 && card.rank <= 5)) retriggers += 1;
        else if (eff.id === 'j_dusk' && isFinalHand) retriggers += 1;
        else if (eff.id === 'j_selzer' && (eff.state ? eff.state.handsLeft > 0 : true)) retriggers += 1;
      });

      const totalPasses = 1 + retriggers;
      for (let pass = 0; pass < totalPasses; pass++) {
        if (pass > 0) {
          pushEvt({ type: 'card_retrigger', cardUid: card.uid, text: '再来一次!', color: '#f59e0b', sfx: 'retrigger' });
        }

        // 3.1 基础点数筹码 + 远足者永久加成
        const baseC = (card.enhancement === 'stone' ? 50 : (Balatro.BASE_RANK_CHIPS[card.rank] || 0)) + (card.permaBonusChips || 0);
        if (baseC > 0) {
          curChips += baseC;
          pushEvt({ type: 'card_score', cardUid: card.uid, text: `+${baseC}`, color: '#009dff', sfx: 'chip' });
        }

        // 3.2 卡牌增强结算
        if (card.enhancement === 'bonus') {
          curChips += 30;
          pushEvt({ type: 'card_score', cardUid: card.uid, text: '+30', color: '#009dff', sfx: 'chip' });
        } else if (card.enhancement === 'mult') {
          curMult += 4;
          pushEvt({ type: 'card_score', cardUid: card.uid, text: '+4 倍率', color: '#ef4444', sfx: 'mult' });
        } else if (card.enhancement === 'glass') {
          curMult *= 2;
          pushEvt({ type: 'card_score', cardUid: card.uid, text: 'X2 倍率', color: '#ef4444', sfx: 'xmult' });
        } else if (card.enhancement === 'lucky') {
          let luckyHit = false;
          if (run.rng.chance(1, 5, probMult, 'lucky_mult')) {
            curMult += 20;
            luckyHit = true;
            pushEvt({ type: 'card_score', cardUid: card.uid, text: '+20 倍率!', color: '#ef4444', sfx: 'mult' });
          }
          if (run.rng.chance(1, 15, probMult, 'lucky_money')) {
            run.addMoney(20);
            luckyHit = true;
            pushEvt({ type: 'card_score', cardUid: card.uid, text: '+$20!', color: '#eab308', sfx: 'coin' });
          }
          if (luckyHit) {
            run.jokers.forEach((cat) => {
              if (!cat.debuffed && cat.id === 'j_lucky_cat') {
                cat.state.xMult = Number(((cat.state.xMult || 1.0) + 0.25).toFixed(2));
                pushEvt({ type: 'joker_scale', jokerUid: cat.uid, text: `招财! X${cat.state.xMult}`, color: '#ef4444', sfx: 'xmult' });
              }
            });
          }
        }

        // 3.3 金蜡封
        if (card.seal === 'Gold') {
          run.addMoney(3);
          pushEvt({ type: 'card_score', cardUid: card.uid, text: '+$3', color: '#eab308', sfx: 'coin' });
        }

        // 3.4 卡牌版本特效
        if (card.edition === 'foil') {
          curChips += 50;
          pushEvt({ type: 'card_score', cardUid: card.uid, text: '+50 闪箔', color: '#009dff', sfx: 'foil' });
        } else if (card.edition === 'holo') {
          curMult += 10;
          pushEvt({ type: 'card_score', cardUid: card.uid, text: '+10 全息', color: '#ef4444', sfx: 'holo' });
        } else if (card.edition === 'polychrome') {
          curMult *= 1.5;
          pushEvt({ type: 'card_score', cardUid: card.uid, text: 'X1.5 多彩', color: '#ef4444', sfx: 'polychrome' });
        }

        // 3.5 从左到右扫描小丑栏“单牌计分触发型”效果
        for (let jIdx = 0; jIdx < run.jokers.length; jIdx++) {
          const jk = run.jokers[jIdx];
          const eff = Balatro.resolveJokerEffect(jk, run.jokers);
          if (!eff) continue;
          const isStone = Balatro.isStoneCard(card);
          const isFace = Balatro.isFaceCard(card, run);

          switch (eff.id) {
            case 'j_greedy_joker':
              if (Balatro.matchesSuit(card, 'Diamonds', run)) {
                curMult += 3;
                pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, cardUid: card.uid, text: '+3 倍率', color: '#ef4444', sfx: 'mult' });
              }
              break;
            case 'j_lusty_joker':
              if (Balatro.matchesSuit(card, 'Hearts', run)) {
                curMult += 3;
                pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, cardUid: card.uid, text: '+3 倍率', color: '#ef4444', sfx: 'mult' });
              }
              break;
            case 'j_wrathful_joker':
              if (Balatro.matchesSuit(card, 'Spades', run)) {
                curMult += 3;
                pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, cardUid: card.uid, text: '+3 倍率', color: '#ef4444', sfx: 'mult' });
              }
              break;
            case 'j_gluttenous_joker':
              if (Balatro.matchesSuit(card, 'Clubs', run)) {
                curMult += 3;
                pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, cardUid: card.uid, text: '+3 倍率', color: '#ef4444', sfx: 'mult' });
              }
              break;
            case 'j_fibonacci':
              if (!isStone && [14, 2, 3, 5, 8].includes(card.rank)) {
                curMult += 8;
                pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, cardUid: card.uid, text: '+8 倍率', color: '#ef4444', sfx: 'mult' });
              }
              break;
            case 'j_scary_face':
              if (isFace) {
                curChips += 30;
                pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, cardUid: card.uid, text: '+30 筹码', color: '#009dff', sfx: 'chip' });
              }
              break;
            case 'j_even_steven':
              if (!isStone && [2, 4, 6, 8, 10].includes(card.rank)) {
                curMult += 4;
                pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, cardUid: card.uid, text: '+4 倍率', color: '#ef4444', sfx: 'mult' });
              }
              break;
            case 'j_odd_todd':
              if (!isStone && [14, 3, 5, 7, 9].includes(card.rank)) {
                curChips += 31;
                pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, cardUid: card.uid, text: '+31 筹码', color: '#009dff', sfx: 'chip' });
              }
              break;
            case 'j_scholar':
              if (!isStone && card.rank === 14) {
                curChips += 20;
                curMult += 4;
                pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, cardUid: card.uid, text: '+20筹码 +4倍率', color: '#ef4444', sfx: 'mult' });
              }
              break;
            case 'j_business':
              if (isFace && run.rng.chance(1, 2, probMult, 'business')) {
                run.addMoney(2);
                pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, cardUid: card.uid, text: '+$2', color: '#eab308', sfx: 'coin' });
              }
              break;
            case 'j_8_ball':
              if (!isStone && card.rank === 8 && run.rng.chance(1, 4, probMult, '8ball')) {
                if (run.spawnRandomConsumable('Tarot')) {
                  pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, cardUid: card.uid, text: '+塔罗牌', color: '#a855f7', sfx: 'tarot' });
                }
              }
              break;
            case 'j_hiker':
              card.permaBonusChips = (card.permaBonusChips || 0) + 5;
              pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, cardUid: card.uid, text: '永久+5筹码', color: '#009dff', sfx: 'chip' });
              break;
            case 'j_photograph':
              if (firstScoringFace && card.uid === firstScoringFace.uid) {
                curMult *= 2;
                pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, cardUid: card.uid, text: 'X2 倍率', color: '#ef4444', sfx: 'xmult' });
              }
              break;
            case 'j_walkie_talkie':
              if (!isStone && (card.rank === 10 || card.rank === 4)) {
                curChips += 10;
                curMult += 4;
                pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, cardUid: card.uid, text: '+10筹码 +4倍率', color: '#ef4444', sfx: 'mult' });
              }
              break;
            case 'j_smiley':
              if (isFace) {
                curMult += 5;
                pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, cardUid: card.uid, text: '+5 倍率', color: '#ef4444', sfx: 'mult' });
              }
              break;
            case 'j_golden_ticket':
              if (card.enhancement === 'gold') {
                run.addMoney(4);
                pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, cardUid: card.uid, text: '+$4', color: '#eab308', sfx: 'coin' });
              }
              break;
            case 'j_rough_gem':
              if (Balatro.matchesSuit(card, 'Diamonds', run)) {
                run.addMoney(1);
                pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, cardUid: card.uid, text: '+$1', color: '#eab308', sfx: 'coin' });
              }
              break;
            case 'j_bloodstone':
              if (Balatro.matchesSuit(card, 'Hearts', run) && run.rng.chance(1, 2, probMult, 'bloodstone')) {
                curMult *= 1.5;
                pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, cardUid: card.uid, text: 'X1.5 倍率', color: '#ef4444', sfx: 'xmult' });
              }
              break;
            case 'j_arrowhead':
              if (Balatro.matchesSuit(card, 'Spades', run)) {
                curChips += 50;
                pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, cardUid: card.uid, text: '+50 筹码', color: '#009dff', sfx: 'chip' });
              }
              break;
            case 'j_onyx_agate':
              if (Balatro.matchesSuit(card, 'Clubs', run)) {
                curMult += 7;
                pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, cardUid: card.uid, text: '+7 倍率', color: '#ef4444', sfx: 'mult' });
              }
              break;
            case 'j_wee':
              // 注意：微小丑成长仅在其自身格触发（蓝图不替微小丑长身体，只在阶段5复制其当前筹码）
              if (jk.id === 'j_wee' && !isStone && card.rank === 2) {
                jk.state.chips = (jk.state.chips || 0) + 8;
                pushEvt({ type: 'joker_scale', jokerUid: jk.uid, cardUid: card.uid, text: '成长+8筹码', color: '#009dff', sfx: 'chip' });
              }
              break;
            case 'j_ancient':
              if (Balatro.matchesSuit(card, (eff.state && eff.state.suit) || 'Spades', run)) {
                curMult *= 1.5;
                pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, cardUid: card.uid, text: 'X1.5 倍率', color: '#ef4444', sfx: 'xmult' });
              }
              break;
            case 'j_idol': {
              const tgtR = (eff.state && eff.state.rank) || 14;
              const tgtS = (eff.state && eff.state.suit) || 'Spades';
              if (!isStone && card.rank === tgtR && Balatro.matchesSuit(card, tgtS, run)) {
                curMult *= 2;
                pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, cardUid: card.uid, text: 'X2 倍率', color: '#ef4444', sfx: 'xmult' });
              }
              break;
            }
            case 'j_triboulet':
              if (!isStone && (card.rank === 12 || card.rank === 13)) {
                curMult *= 2;
                pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, cardUid: card.uid, text: 'X2 倍率', color: '#ef4444', sfx: 'xmult' });
              }
              break;
            default:
              break;
          }
        }
      }
    }

    // ==================== 阶段 4：手牌区从左到右留存触发与哑剧演员重触发 ====================
    // 查找手牌中点数最低的牌（原版规则：若有多张并列最低，取最右侧那张作为举起拳头宿主！）
    let lowestHeldCard = null;
    let lowestRankVal = 999;
    heldCards.forEach((hc) => {
      if (!hc.debuffed && hc.enhancement !== 'stone') {
        const val = hc.rank === 14 ? 11 : (hc.rank >= 11 ? 10 : hc.rank);
        const rankCmp = hc.rank; // Ace 在排序上视为最高 14，不会是最低（除非全是 A）
        if (rankCmp <= lowestRankVal) {
          lowestRankVal = rankCmp;
          lowestHeldCard = { card: hc, addMult: val * 2 };
        }
      }
    });

    // 统计哑剧演员 (Mime) 重触发次数（支持蓝图复制哑剧演员！）
    let mimeRetriggers = 0;
    run.jokers.forEach((jk) => {
      const eff = Balatro.resolveJokerEffect(jk, run.jokers);
      if (eff && eff.id === 'j_mime') mimeRetriggers += 1;
    });

    for (let hIdx = 0; hIdx < heldCards.length; hIdx++) {
      const hc = heldCards[hIdx];
      if (hc.debuffed) continue;

      const passes = 1 + (hc.seal === 'Red' ? 1 : 0) + mimeRetriggers;
      const isStone = Balatro.isStoneCard(hc);
      const isFace = Balatro.isFaceCard(hc, run);

      for (let p = 0; p < passes; p++) {
        let anyEffectOnPass = false;

        if (hc.enhancement === 'steel') {
          curMult *= 1.5;
          anyEffectOnPass = true;
          pushEvt({ type: 'held_score', cardUid: hc.uid, text: p > 0 ? '重触发 X1.5' : '钢铁 X1.5', color: '#ef4444', sfx: 'xmult' });
        }

        for (let jIdx = 0; jIdx < run.jokers.length; jIdx++) {
          const jk = run.jokers[jIdx];
          const eff = Balatro.resolveJokerEffect(jk, run.jokers);
          if (!eff) continue;

          if (eff.id === 'j_raised_fist' && lowestHeldCard && lowestHeldCard.card.uid === hc.uid) {
            curMult += lowestHeldCard.addMult;
            anyEffectOnPass = true;
            pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, cardUid: hc.uid, text: `+${lowestHeldCard.addMult} 倍率`, color: '#ef4444', sfx: 'mult' });
          } else if (eff.id === 'j_shoot_the_moon' && !isStone && hc.rank === 12) {
            curMult += 13;
            anyEffectOnPass = true;
            pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, cardUid: hc.uid, text: '+13 倍率', color: '#ef4444', sfx: 'mult' });
          } else if (eff.id === 'j_baron' && !isStone && hc.rank === 13) {
            curMult *= 1.5;
            anyEffectOnPass = true;
            pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, cardUid: hc.uid, text: 'X1.5 倍率', color: '#ef4444', sfx: 'xmult' });
          } else if (eff.id === 'j_reserved_parking' && isFace && run.rng.chance(1, 2, probMult, 'parking')) {
            run.addMoney(1);
            anyEffectOnPass = true;
            pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, cardUid: hc.uid, text: '+$1', color: '#eab308', sfx: 'coin' });
          }
        }
        if (!anyEffectOnPass) break; // 无留存效果则无需空跑后续重触发
      }
    }

    // ==================== 阶段 5：小丑栏与消耗品栏从左到右独立结算 ====================
    // 先处理忠诚卡步进计数
    run.jokers.forEach((jk) => {
      if (!jk.debuffed && jk.id === 'j_loyalty_card') {
        if (jk.state.rem === 0) {
          jk.state._fireNow = true;
          jk.state.rem = 5;
        } else {
          jk.state._fireNow = false;
          jk.state.rem = (jk.state.rem !== undefined ? jk.state.rem : 5) - 1;
        }
      }
    });

    const baseballCount = run.jokers.filter((jk) => {
      const eff = Balatro.resolveJokerEffect(jk, run.jokers);
      return eff && eff.id === 'j_baseball';
    }).length;

    const fullDeck = run.getFullDeck();

    for (let jIdx = 0; jIdx < run.jokers.length; jIdx++) {
      const jk = run.jokers[jIdx];
      if (jk.debuffed) continue;

      // 5.1 小丑牌自身的闪箔 / 全息版本先触发
      if (jk.edition === 'foil') {
        curChips += 50;
        pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, text: '+50 闪箔', color: '#009dff', sfx: 'foil' });
      } else if (jk.edition === 'holo') {
        curMult += 10;
        pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, text: '+10 全息', color: '#ef4444', sfx: 'holo' });
      }

      // 5.2 小丑牌主体独立加分/乘算效果（支持蓝图与头脑风暴代理！）
      const eff = Balatro.resolveJokerEffect(jk, run.jokers);
      if (eff) {
        const st = eff.state || {};
        switch (eff.id) {
          case 'j_joker':
            curMult += 4;
            pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, text: '+4 倍率', color: '#ef4444', sfx: 'mult' });
            break;
          case 'j_jolly':
            if (contains['Pair']) { curMult += 8; pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, text: '+8 倍率', color: '#ef4444', sfx: 'mult' }); }
            break;
          case 'j_zany':
            if (contains['Three of a Kind']) { curMult += 12; pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, text: '+12 倍率', color: '#ef4444', sfx: 'mult' }); }
            break;
          case 'j_mad':
            if (contains['Two Pair']) { curMult += 10; pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, text: '+10 倍率', color: '#ef4444', sfx: 'mult' }); }
            break;
          case 'j_crazy':
            if (contains['Straight']) { curMult += 12; pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, text: '+12 倍率', color: '#ef4444', sfx: 'mult' }); }
            break;
          case 'j_droll':
            if (contains['Flush']) { curMult += 10; pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, text: '+10 倍率', color: '#ef4444', sfx: 'mult' }); }
            break;
          case 'j_sly':
            if (contains['Pair']) { curChips += 50; pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, text: '+50 筹码', color: '#009dff', sfx: 'chip' }); }
            break;
          case 'j_wily':
            if (contains['Three of a Kind']) { curChips += 100; pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, text: '+100 筹码', color: '#009dff', sfx: 'chip' }); }
            break;
          case 'j_clever':
            if (contains['Two Pair']) { curChips += 80; pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, text: '+80 筹码', color: '#009dff', sfx: 'chip' }); }
            break;
          case 'j_devious':
            if (contains['Straight']) { curChips += 100; pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, text: '+100 筹码', color: '#009dff', sfx: 'chip' }); }
            break;
          case 'j_crafty':
            if (contains['Flush']) { curChips += 80; pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, text: '+80 筹码', color: '#009dff', sfx: 'chip' }); }
            break;
          case 'j_half':
            if (playedCards.length <= 3) { curMult += 20; pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, text: '+20 倍率', color: '#ef4444', sfx: 'mult' }); }
            break;
          case 'j_stencil': {
            const stencils = run.jokers.filter((x) => x.id === 'j_stencil' && !x.debuffed).length;
            const xm = Math.max(1, (run.jokerSlots - run.jokers.length) + stencils);
            if (xm > 1) { curMult *= xm; pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, text: `X${xm} 倍率`, color: '#ef4444', sfx: 'xmult' }); }
            break;
          }
          case 'j_ceremonial':
            if (st.mult > 0) { curMult += st.mult; pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, text: `+${st.mult} 倍率`, color: '#ef4444', sfx: 'mult' }); }
            break;
          case 'j_banner':
            if (run.discardsLeft > 0) { const c = run.discardsLeft * 30; curChips += c; pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, text: `+${c} 筹码`, color: '#009dff', sfx: 'chip' }); }
            break;
          case 'j_mystic_summit':
            if (run.discardsLeft === 0) { curMult += 15; pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, text: '+15 倍率', color: '#ef4444', sfx: 'mult' }); }
            break;
          case 'j_loyalty_card':
            if (st._fireNow) { curMult *= 4; pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, text: 'X4 倍率!', color: '#ef4444', sfx: 'xmult' }); }
            break;
          case 'j_misprint': {
            const rnd = run.rng.int(0, 23, 'misprint');
            if (rnd > 0) { curMult += rnd; pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, text: `+${rnd} 倍率`, color: '#ef4444', sfx: 'mult' }); }
            break;
          }
          case 'j_steel_joker': {
            const steels = fullDeck.filter((c) => c.enhancement === 'steel').length;
            const xm = Number((1 + steels * 0.2).toFixed(2));
            if (xm > 1) { curMult *= xm; pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, text: `X${xm} 倍率`, color: '#ef4444', sfx: 'xmult' }); }
            break;
          }
          case 'j_abstract': {
            const m = run.jokers.length * 3;
            if (m > 0) { curMult += m; pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, text: `+${m} 倍率`, color: '#ef4444', sfx: 'mult' }); }
            break;
          }
          case 'j_gros_michel':
            curMult += 15;
            pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, text: '+15 倍率', color: '#ef4444', sfx: 'mult' });
            break;
          case 'j_cavendish':
            curMult *= 3;
            pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, text: 'X3 倍率', color: '#ef4444', sfx: 'xmult' });
            break;
          case 'j_supernova': {
            const cnt = run.handPlayCounts[handId] || 1;
            curMult += cnt;
            pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, text: `+${cnt} 倍率`, color: '#ef4444', sfx: 'mult' });
            break;
          }
          case 'j_ride_the_bus':
          case 'j_green_joker':
          case 'j_red_card':
          case 'j_flash':
          case 'j_popcorn':
          case 'j_trousers':
            if ((st.mult || 0) > 0) { curMult += st.mult; pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, text: `+${st.mult} 倍率`, color: '#ef4444', sfx: 'mult' }); }
            break;
          case 'j_runner':
          case 'j_ice_cream':
          case 'j_square':
          case 'j_castle':
          case 'j_wee':
            if ((st.chips || 0) > 0) { curChips += st.chips; pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, text: `+${st.chips} 筹码`, color: '#009dff', sfx: 'chip' }); }
            break;
          case 'j_blue_joker': {
            const c = run.drawPile.length * 2;
            if (c > 0) { curChips += c; pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, text: `+${c} 筹码`, color: '#009dff', sfx: 'chip' }); }
            break;
          }
          case 'j_blackboard': {
            const allBlack = heldCards.length === 0 || heldCards.every((hc) => {
              if (hc.enhancement === 'stone') return false;
              return Balatro.matchesSuit(hc, 'Spades', run) || Balatro.matchesSuit(hc, 'Clubs', run);
            });
            if (allBlack) { curMult *= 3; pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, text: 'X3 倍率', color: '#ef4444', sfx: 'xmult' }); }
            break;
          }
          case 'j_constellation':
          case 'j_madness':
          case 'j_vampire':
          case 'j_hologram':
          case 'j_obelisk':
          case 'j_lucky_cat':
          case 'j_ramen':
          case 'j_campfire':
          case 'j_glass':
          case 'j_hit_the_road':
          case 'j_caino':
          case 'j_yorick':
            if ((st.xMult || 1) > 1) { curMult *= st.xMult; pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, text: `X${st.xMult} 倍率`, color: '#ef4444', sfx: 'xmult' }); }
            break;
          case 'j_card_sharp':
            if (playedBeforeInRound) { curMult *= 3; pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, text: 'X3 倍率', color: '#ef4444', sfx: 'xmult' }); }
            break;
          case 'j_erosion': {
            const diff = Math.max(0, run.startingDeckSize - fullDeck.length);
            if (diff > 0) { curMult += diff * 4; pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, text: `+${diff * 4} 倍率`, color: '#ef4444', sfx: 'mult' }); }
            break;
          }
          case 'j_fortune_teller':
            if (run.tarotsUsed > 0) { curMult += run.tarotsUsed; pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, text: `+${run.tarotsUsed} 倍率`, color: '#ef4444', sfx: 'mult' }); }
            break;
          case 'j_stone': {
            const stones = fullDeck.filter((c) => c.enhancement === 'stone').length;
            if (stones > 0) { curChips += stones * 25; pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, text: `+${stones * 25} 筹码`, color: '#009dff', sfx: 'chip' }); }
            break;
          }
          case 'j_bull': {
            const bChips = Math.max(0, run.money * 2);
            if (bChips > 0) { curChips += bChips; pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, text: `+${bChips} 筹码`, color: '#009dff', sfx: 'chip' }); }
            break;
          }
          case 'j_acrobat':
            if (isFinalHand) { curMult *= 3; pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, text: 'X3 倍率', color: '#ef4444', sfx: 'xmult' }); }
            break;
          case 'j_swashbuckler': {
            let sumSell = 0;
            run.jokers.forEach((other) => {
              if (other.uid !== eff.uid) sumSell += Balatro.getSellValue(other, run);
            });
            if (sumSell > 0) { curMult += sumSell; pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, text: `+${sumSell} 倍率`, color: '#ef4444', sfx: 'mult' }); }
            break;
          }
          case 'j_throwback':
            if (run.blindsSkipped > 0) {
              const xm = Number((1 + run.blindsSkipped * 0.25).toFixed(2));
              curMult *= xm;
              pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, text: `X${xm} 倍率`, color: '#ef4444', sfx: 'xmult' });
            }
            break;
          case 'j_flower_pot': {
            // 检查计分牌是否能无冲突分配满全部 4 种花色
            const activeScoring = scoringCards.filter((c) => !c.debuffed && !Balatro.isStoneCard(c));
            const suits4 = ['Spades', 'Hearts', 'Clubs', 'Diamonds'];
            let ok = false;
            if (activeScoring.length >= 4) {
              // 回溯匹配 4 种花色
              const matchSuitIdx = (sIdx, usedSet) => {
                if (sIdx === 4) return true;
                for (let k = 0; k < activeScoring.length; k++) {
                  const cd = activeScoring[k];
                  if (!usedSet.has(cd.uid) && Balatro.matchesSuit(cd, suits4[sIdx], run)) {
                    usedSet.add(cd.uid);
                    if (matchSuitIdx(sIdx + 1, usedSet)) return true;
                    usedSet.delete(cd.uid);
                  }
                }
                return false;
              };
              ok = matchSuitIdx(0, new Set());
            }
            if (ok) { curMult *= 3; pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, text: 'X3 倍率', color: '#ef4444', sfx: 'xmult' }); }
            break;
          }
          case 'j_seeing_double': {
            const activeSc = scoringCards.filter((c) => !c.debuffed && !Balatro.isStoneCard(c));
            let hasPairClubOther = false;
            for (let a = 0; a < activeSc.length; a++) {
              for (let b = 0; b < activeSc.length; b++) {
                if (a === b) continue;
                const ca = activeSc[a], cb = activeSc[b];
                const aClub = Balatro.matchesSuit(ca, 'Clubs', run);
                const bOther = Balatro.matchesSuit(cb, 'Spades', run) || Balatro.matchesSuit(cb, 'Hearts', run) || Balatro.matchesSuit(cb, 'Diamonds', run);
                if (aClub && bOther) { hasPairClubOther = true; break; }
              }
              if (hasPairClubOther) break;
            }
            if (hasPairClubOther) { curMult *= 2; pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, text: 'X2 倍率', color: '#ef4444', sfx: 'xmult' }); }
            break;
          }
          case 'j_duo':
            if (contains['Pair']) { curMult *= 2; pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, text: 'X2 倍率', color: '#ef4444', sfx: 'xmult' }); }
            break;
          case 'j_trio':
            if (contains['Three of a Kind']) { curMult *= 3; pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, text: 'X3 倍率', color: '#ef4444', sfx: 'xmult' }); }
            break;
          case 'j_family':
            if (contains['Four of a Kind']) { curMult *= 4; pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, text: 'X4 倍率', color: '#ef4444', sfx: 'xmult' }); }
            break;
          case 'j_order':
            if (contains['Straight']) { curMult *= 3; pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, text: 'X3 倍率', color: '#ef4444', sfx: 'xmult' }); }
            break;
          case 'j_tribe':
            if (contains['Flush']) { curMult *= 2; pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, text: 'X2 倍率', color: '#ef4444', sfx: 'xmult' }); }
            break;
          case 'j_stuntman':
            curChips += 250;
            pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, text: '+250 筹码', color: '#009dff', sfx: 'chip' });
            break;
          case 'j_drivers_license': {
            const enhCnt = fullDeck.filter((c) => !!c.enhancement).length;
            if (enhCnt >= 16) { curMult *= 3; pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, text: 'X3 倍率', color: '#ef4444', sfx: 'xmult' }); }
            break;
          }
          case 'j_bootstraps': {
            const bm = Math.max(0, Math.floor(run.money / 5) * 2);
            if (bm > 0) { curMult += bm; pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, text: `+${bm} 倍率`, color: '#ef4444', sfx: 'mult' }); }
            break;
          }
          default:
            break;
        }
      }

      // 5.3 棒球卡对每张罕见小丑牌触发 X1.5
      if (baseballCount > 0 && jk.rarity === 2) {
        for (let b = 0; b < baseballCount; b++) {
          curMult *= 1.5;
          pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, text: '棒球 X1.5', color: '#ef4444', sfx: 'xmult' });
        }
      }

      // 5.4 小丑牌自身的多彩版本在最后乘算
      if (jk.edition === 'polychrome') {
        curMult *= 1.5;
        pushEvt({ type: 'joker_trigger', jokerUid: jk.uid, text: 'X1.5 多彩', color: '#ef4444', sfx: 'polychrome' });
      }
    }

    // 5.5 天文台 (Observatory) 优惠券：消耗品槽内对应星球牌给予 X1.5
    if (run.vouchers['v_observatory']) {
      run.consumables.forEach((cs) => {
        const pm = Balatro.PLANET_MAP[cs.id];
        if (pm && pm.handId === handId) {
          curMult *= 1.5;
          pushEvt({ type: 'consumable_trigger', consumableUid: cs.uid, text: '天文台 X1.5', color: '#38bdf8', sfx: 'xmult' });
        }
      });
    }

    // ==================== 阶段 6：挑战封顶、等离子牌组平衡与玻璃碎裂 ====================
    if (run.challengeRules && run.challengeRules.chipsCapToMoney) {
      const cap = Math.max(0, run.money);
      if (curChips > cap) {
        curChips = cap;
        pushEvt({ type: 'boss_shout', text: `筹码上限 $${cap}!`, color: '#eab308', sfx: 'mult' });
      }
    }

    if (run.deckConfig && run.deckConfig.plasmaBalance) {
      const balanced = Math.floor((curChips + curMult) / 2);
      curChips = balanced;
      curMult = balanced;
      pushEvt({ type: 'plasma_balance', text: '等离子平衡!', color: '#c084fc', sfx: 'plasma' });
    }

    const handScore = Math.floor(curChips * curMult);

    // 玻璃牌碎裂判定
    const shatteredUids = [];
    scoringCards.forEach((sc) => {
      if (!sc.debuffed && sc.enhancement === 'glass') {
        if (run.rng.chance(1, 4, probMult, 'glass_shatter')) {
          shatteredUids.push(sc.uid);
          pushEvt({ type: 'glass_shatter', cardUid: sc.uid, text: '碎裂!', color: '#bae6fd', sfx: 'glassBreak' });
          run.onPlayingCardDestroyed(sc, events);
        }
      }
    });

    if (sixthSenseDestroyUid) {
      const target = playedCards.find((c) => c.uid === sixthSenseDestroyUid);
      if (target) run.onPlayingCardDestroyed(target, events);
    }

    // 单手后衰减类小丑更新（冰淇淋、苏打水）与孤注一掷挑战失效
    for (let i = run.jokers.length - 1; i >= 0; i--) {
      const jk = run.jokers[i];
      if (jk.debuffed) continue;
      if (jk.id === 'j_ice_cream') {
        jk.state.chips -= 5;
        if (jk.state.chips <= 0) {
          run.jokers.splice(i, 1);
          pushEvt({ type: 'joker_extinct', jokerUid: jk.uid, text: '融化了!', color: '#67e8f9', sfx: 'nope' });
        }
      } else if (jk.id === 'j_selzer') {
        jk.state.handsLeft -= 1;
        if (jk.state.handsLeft <= 0) {
          run.jokers.splice(i, 1);
          pushEvt({ type: 'joker_extinct', jokerUid: jk.uid, text: '喝光了!', color: '#22d3ee', sfx: 'nope' });
        }
      }
    }

    if (run.challengeRules && run.challengeRules.debuffAfterPlay) {
      scoringCards.forEach((sc) => { sc.permaDebuffed = true; sc.debuffed = true; });
    }

    pushEvt({ type: 'hand_total', handScore, text: `+${Balatro.formatNumber(handScore)}` });

    return {
      cancelledByBoss: false,
      handId,
      displayName: evalRes.displayName,
      scoringCards,
      finalChips: curChips,
      finalMult: curMult,
      handScore,
      shatteredUids,
      sixthSenseDestroyUid,
      events
    };
  };
})(window);

  <script>
'use strict';

/**
 * 全部 22 张塔罗牌、12 张星球牌、18 张幻灵牌与 32 张优惠券的执行引擎
 */
(function initConsumableEffects(global) {
  const Balatro = global.Balatro;

  /**
   * 判断当前消耗品是否满足使用条件，返回 { ok: boolean, reason?: string }
   */
  Balatro.canUseConsumable = function canUseConsumable(run, cons) {
    if (!run || !cons) return { ok: false, reason: '无效道具' };
    const id = cons.id;
    const activeHand = run.getInteractiveHand();
    const selected = activeHand.filter((c) => c.selected);

    if (cons.kind === 'Planet') {
      return { ok: true };
    }

    const meta = Balatro.TAROT_MAP[id] || Balatro.SPECTRAL_MAP[id];
    if (!meta) return { ok: false, reason: '未知道具' };

    if (meta.minSel > 0 || meta.maxSel > 0) {
      if (activeHand.length === 0) return { ok: false, reason: '当前没有可操作的手牌' };
      if (selected.length < meta.minSel || selected.length > meta.maxSel) {
        return {
          ok: false,
          reason: meta.minSel === meta.maxSel
            ? `需要恰好选中 ${meta.minSel} 张手牌`
            : `需要选中 ${meta.minSel}~${meta.maxSel} 张手牌`
        };
      }
    }

    if (meta.needHandCards && activeHand.length === 0) {
      return { ok: false, reason: '需要在有手牌时使用' };
    }

    switch (id) {
      case 'c_fool': {
        if (!run.lastTarotOrPlanetId || run.lastTarotOrPlanetId === 'c_fool') {
          return { ok: false, reason: '本局尚未使用过其他塔罗或星球牌' };
        }
        return { ok: true };
      }
      case 'c_judgement':
      case 'c_wraith':
      case 'c_soul':
        if (run.jokers.length >= run.getEffectiveJokerSlots()) {
          return { ok: false, reason: '小丑牌槽位已满' };
        }
        return { ok: true };
      case 'c_wheel_of_fortune':
        if (!run.jokers.some((j) => !j.edition)) {
          return { ok: false, reason: '没有无版本的基础小丑牌' };
        }
        return { ok: true };
      case 'c_ectoplasm':
        if (!run.jokers.some((j) => !j.edition)) {
          return { ok: false, reason: '没有可附加负片的基础小丑牌' };
        }
        return { ok: true };
      case 'c_hex':
        if (!run.jokers.some((j) => !j.edition)) {
          return { ok: false, reason: '没有可附加多彩的基础小丑牌' };
        }
        return { ok: true };
      case 'c_ankh':
        if (run.jokers.length === 0) {
          return { ok: false, reason: '当前没有可复制的小丑牌' };
        }
        if (run.jokers.filter((j) => j.eternal).length >= run.getEffectiveJokerSlots() && run.jokers.every((j) => j.eternal)) {
          return { ok: false, reason: '小丑槽位已满且全为永恒' };
        }
        return { ok: true };
      default:
        return { ok: true };
    }
  };

  /**
   * 执行消耗品效果，返回 { ok: boolean, message: string, sfx: string, nope?: boolean, burnedCards?: [] }
   */
  Balatro.applyConsumable = function applyConsumable(run, cons, fromPack) {
    const check = Balatro.canUseConsumable(run, cons);
    if (!check.ok) return { ok: false, message: check.reason, sfx: 'nope' };

    const id = cons.id;
    const activeHand = run.getInteractiveHand();
    // 严格保持手牌数组从左到右顺序（死神 XIII 左变右核心依赖！）
    const selectedOrdered = activeHand.filter((c) => c.selected);
    const probMult = run.getProbMult();
    const burnedCards = [];

    // 1. 星球牌处理
    if (cons.kind === 'Planet') {
      const pm = Balatro.PLANET_MAP[id];
      run.lastTarotOrPlanetId = id;
      run.planetsUsed += 1;
      run.uniquePlanetsUsed[id] = true;
      run.upgradeHand(pm.handId, 1);

      // 星座小丑成长
      run.jokers.forEach((jk) => {
        if (!jk.debuffed && jk.id === 'j_constellation') {
          jk.state.xMult = Number(((jk.state.xMult || 1.0) + 0.1).toFixed(2));
        }
      });

      Balatro.storage.discover('planets', id, run.isSeeded);
      const hName = Balatro.POKER_HAND_MAP[pm.handId].name;
      const lv = run.getHandLevel(pm.handId).level;
      return { ok: true, message: `${hName} 升至 Lv.${lv}！`, sfx: 'planet' };
    }

    // 2. 塔罗牌处理
    if (cons.kind === 'Tarot') {
      if (id !== 'c_fool') {
        run.lastTarotOrPlanetId = id;
      }
      run.tarotsUsed += 1;
      Balatro.storage.discover('tarots', id, run.isSeeded);

      switch (id) {
        case 'c_fool': {
          const created = Balatro.createConsumableInstance(run.lastTarotOrPlanetId);
          if (created && (fromPack ? run.canAddConsumable() : true)) {
            run.consumables.push(created);
            return { ok: true, message: `愚者生成了「${created.name}」！`, sfx: 'tarot' };
          }
          return { ok: true, message: '消耗品栏已满', sfx: 'nope' };
        }
        case 'c_magician':
          selectedOrdered.forEach((c) => { c.enhancement = 'lucky'; c.selected = false; });
          return { ok: true, message: '已增强为幸运牌！', sfx: 'tarot' };
        case 'c_high_priestess': {
          let made = 0;
          for (let i = 0; i < 2; i++) {
            if (run.spawnRandomConsumable('Planet')) made++;
          }
          return { ok: true, message: made > 0 ? `生成了 ${made} 张星球牌！` : '消耗品槽已满', sfx: 'planet' };
        }
        case 'c_empress':
          selectedOrdered.forEach((c) => { c.enhancement = 'mult'; c.selected = false; });
          return { ok: true, message: '已增强为倍率牌 (+4倍率)！', sfx: 'tarot' };
        case 'c_emperor': {
          let made = 0;
          for (let i = 0; i < 2; i++) {
            if (run.spawnRandomConsumable('Tarot')) made++;
          }
          return { ok: true, message: made > 0 ? `生成了 ${made} 张塔罗牌！` : '消耗品槽已满', sfx: 'tarot' };
        }
        case 'c_hierophant':
          selectedOrdered.forEach((c) => { c.enhancement = 'bonus'; c.selected = false; });
          return { ok: true, message: '已增强为奖励牌 (+30筹码)！', sfx: 'tarot' };
        case 'c_lovers':
          selectedOrdered.forEach((c) => { c.enhancement = 'wild'; c.selected = false; });
          return { ok: true, message: '已增强为万能牌！', sfx: 'tarot' };
        case 'c_chariot':
          selectedOrdered.forEach((c) => { c.enhancement = 'steel'; c.selected = false; });
          return { ok: true, message: '已增强为钢铁牌 (X1.5)！', sfx: 'tarot' };
        case 'c_justice':
          selectedOrdered.forEach((c) => { c.enhancement = 'glass'; c.selected = false; });
          return { ok: true, message: '已增强为玻璃牌 (X2)！', sfx: 'tarot' };
        case 'c_hermit': {
          const add = Balatro.clamp(Math.max(0, run.money), 0, 20);
          run.addMoney(add);
          return { ok: true, message: `隐士给予 +$${add}！`, sfx: 'coin' };
        }
        case 'c_wheel_of_fortune': {
          const candidates = run.jokers.filter((j) => !j.edition);
          if (candidates.length > 0 && run.rng.chance(1, 4, probMult, 'wheel')) {
            const target = run.rng.pick(candidates, 'wheel_target');
            const ed = run.rng.weightedPick([
              { item: 'foil', weight: 50 },
              { item: 'holo', weight: 35 },
              { item: 'polychrome', weight: 15 }
            ], 'wheel_ed');
            target.edition = ed;
            return { ok: true, message: `${target.name} 获得了「${Balatro.EDITIONS[ed].name}」！`, sfx: ed };
          }
          return { ok: true, message: '落空！(Nope!)', sfx: 'nope', nope: true };
        }
        case 'c_strength':
          selectedOrdered.forEach((c) => {
            c.rank = c.rank === 14 ? 2 : c.rank + 1;
            c.selected = false;
          });
          run.sortCardList(activeHand, run.sortMode || 'rank');
          return { ok: true, message: '点数已 +1！', sfx: 'tarot' };
        case 'c_hanged_man':
          selectedOrdered.forEach((c) => {
            burnedCards.push(c);
            run.destroyPlayingCard(c);
          });
          return { ok: true, message: `已摧毁 ${selectedOrdered.length} 张牌！`, sfx: 'burn', burnedCards };
        case 'c_death': {
          const left = selectedOrdered[0];
          const right = selectedOrdered[1];
          left.suit = right.suit;
          left.rank = right.rank;
          left.enhancement = right.enhancement;
          left.edition = right.edition;
          left.seal = right.seal;
          left.permaBonusChips = right.permaBonusChips || 0;
          left.selected = false;
          right.selected = false;
          return { ok: true, message: '死神：左侧牌已化为右侧牌！', sfx: 'tarot' };
        }
        case 'c_temperance': {
          let total = 0;
          run.jokers.forEach((j) => { total += Balatro.getSellValue(j, run); });
          const gain = Math.min(50, total);
          run.addMoney(gain);
          return { ok: true, message: `节制给予 +$${gain}！`, sfx: 'coin' };
        }
        case 'c_devil':
          selectedOrdered.forEach((c) => { c.enhancement = 'gold'; c.selected = false; });
          return { ok: true, message: '已增强为黄金牌！', sfx: 'coin' };
        case 'c_tower':
          selectedOrdered.forEach((c) => { c.enhancement = 'stone'; c.selected = false; });
          return { ok: true, message: '已增强为石头牌 (+50筹码)！', sfx: 'tarot' };
        case 'c_star':
          selectedOrdered.forEach((c) => { c.suit = 'Diamonds'; c.selected = false; run.refreshCardDebuff(c); });
          return { ok: true, message: '已转化为方块 ♦！', sfx: 'tarot' };
        case 'c_moon':
          selectedOrdered.forEach((c) => { c.suit = 'Clubs'; c.selected = false; run.refreshCardDebuff(c); });
          return { ok: true, message: '已转化为梅花 ♣！', sfx: 'tarot' };
        case 'c_sun':
          selectedOrdered.forEach((c) => { c.suit = 'Hearts'; c.selected = false; run.refreshCardDebuff(c); });
          return { ok: true, message: '已转化为红桃 ♥！', sfx: 'tarot' };
        case 'c_world':
          selectedOrdered.forEach((c) => { c.suit = 'Spades'; c.selected = false; run.refreshCardDebuff(c); });
          return { ok: true, message: '已转化为黑桃 ♠！', sfx: 'tarot' };
        case 'c_judgement': {
          const jk = run.spawnShopOrRandomJoker(null, 'judgement', true);
          if (jk) {
            run.addJoker(jk);
            return { ok: true, message: `审判召唤了「${jk.name}」！`, sfx: 'tarot' };
          }
          return { ok: true, message: '无可用小丑牌', sfx: 'nope' };

        default:
          break;
      }
    }

    // 3. 幻灵牌处理
    if (cons.kind === 'Spectral') {
      Balatro.storage.discover('spectrals', id, run.isSeeded);
      const enhKeys = ['bonus', 'mult', 'wild', 'glass', 'steel', 'stone', 'gold', 'lucky'];

      switch (id) {
        case 'c_familiar':
        case 'c_grim':
        case 'c_incantation': {
          const victim = run.rng.pick(activeHand, 'spec_victim');
          if (victim) {
            burnedCards.push(victim);
            run.destroyPlayingCard(victim);
          }
          const addCount = id === 'c_familiar' ? 3 : (id === 'c_grim' ? 2 : 4);
          const rankPool = id === 'c_familiar' ? [11, 12, 13] : (id === 'c_grim' ? [14] : [2, 3, 4, 5, 6, 7, 8, 9, 10]);
          for (let i = 0; i < addCount; i++) {
            const s = run.rng.pick(Balatro.SUITS, 'spec_add');
            const r = run.rng.pick(rankPool, 'spec_add');
            const enh = run.rng.pick(enhKeys, 'spec_enh');
            const nc = Balatro.createPlayingCard(s, r, { enhancement: enh });
            run.addPlayingCardToDeck(nc, true);
            activeHand.push(nc);
          }
          run.sortCardList(activeHand, run.sortMode || 'rank');
          return { ok: true, message: `献祭 1 张并生成了 ${addCount} 张增强牌！`, sfx: 'spectral', burnedCards };
        }
        case 'c_talisman':
          selectedOrdered[0].seal = 'Gold';
          selectedOrdered[0].selected = false;
          return { ok: true, message: '已烙印金蜡封！', sfx: 'coin' };
        case 'c_deja_vu':
          selectedOrdered[0].seal = 'Red';
          selectedOrdered[0].selected = false;
          return { ok: true, message: '已烙印红蜡封 (重触发)！', sfx: 'spectral' };
        case 'c_trance':
          selectedOrdered[0].seal = 'Blue';
          selectedOrdered[0].selected = false;
          return { ok: true, message: '已烙印蓝蜡封！', sfx: 'planet' };
        case 'c_medium':
          selectedOrdered[0].seal = 'Purple';
          selectedOrdered[0].selected = false;
          return { ok: true, message: '已烙印紫蜡封！', sfx: 'tarot' };
        case 'c_aura': {
          const ed = run.rng.weightedPick([
            { item: 'foil', weight: 50 },
            { item: 'holo', weight: 35 },
            { item: 'polychrome', weight: 15 }
          ], 'aura_ed');
          selectedOrdered[0].edition = ed;
          selectedOrdered[0].selected = false;
          return { ok: true, message: `已赋予「${Balatro.EDITIONS[ed].name}」版本！`, sfx: ed };
        }
        case 'c_wraith': {
          run.money = 0;
          const rareJk = run.spawnShopOrRandomJoker(3, 'wraith', true);
          if (rareJk) {
            run.addJoker(rareJk);
            return { ok: true, message: `怨灵召唤了稀有「${rareJk.name}」，资金归零！`, sfx: 'spectral' };
          }
          return { ok: true, message: '资金归零', sfx: 'spectral' };
        }
        case 'c_sigil': {
          const targetSuit = run.rng.pick(Balatro.SUITS, 'sigil');
          activeHand.forEach((c) => { c.suit = targetSuit; c.selected = false; run.refreshCardDebuff(c); });
          return { ok: true, message: `全手牌已化为${Balatro.SUIT_META[targetSuit].name}！`, sfx: 'spectral' };
        }
        case 'c_ouija': {
          const targetRank = run.rng.pick(Balatro.RANKS, 'ouija');
          activeHand.forEach((c) => { c.rank = targetRank; c.selected = false; run.refreshCardDebuff(c); });
          run.baseHandSize = Math.max(1, run.baseHandSize - 1);
          return { ok: true, message: `全手牌化为 ${Balatro.RANK_LABELS[targetRank]}，手牌上限 -1！`, sfx: 'spectral' };
        }
        case 'c_ectoplasm': {
          const baseJks = run.jokers.filter((j) => !j.edition);
          const pick = run.rng.pick(baseJks, 'ectoplasm');

            run.ectoplasmPenalty = (run.ectoplasmPenalty || 0) + 1;
            run.baseHandSize = Math.max(1, run.baseHandSize - run.ectoplasmPenalty);
            return { ok: true, message: `${pick.name} 变为负片 (+1槽)，手牌上限 -${run.ectoplasmPenalty}！`, sfx: 'spectral' };
          }
          return { ok: false, message: '没有无版本小丑牌', sfx: 'nope' };
        }
        case 'c_immolate': {
          const copyHand = activeHand.slice();
          const shuffled = run.rng.shuffle(copyHand, 'immolate');
          const victims = shuffled.slice(0, Math.min(5, shuffled.length));
          victims.forEach((v) => {
            burnedCards.push(v);
            run.destroyPlayingCard(v);
          });
          run.addMoney(20);
          return { ok: true, message: `献祭摧毁 ${victims.length} 张牌，获得 +$20！`, sfx: 'burn', burnedCards };
        }
        case 'c_ankh': {
          const chosen = run.rng.pick(run.jokers, 'ankh');
          if (chosen) {
            // 摧毁其他非永恒小丑
            run.jokers = run.jokers.filter((j) => j.uid === chosen.uid || j.eternal);
            const dup = Balatro.createJokerInstance(chosen.id, {
              edition: chosen.edition === 'negative' ? null : chosen.edition, // 原版规则：安卡复制不继承负片！
              eternal: chosen.eternal,
              perishable: chosen.perishable,
              perishRounds: 5,
              rental: chosen.rental,
              state: JSON.parse(JSON.stringify(chosen.state || {}))
            });
            run.addJoker(dup);
            return { ok: true, message: `安卡复制了「${chosen.name}」！`, sfx: 'spectral' };
          }
          break;
        }
        case 'c_hex': {
          const baseJks = run.jokers.filter((j) => !j.edition);
          const chosen = run.rng.pick(baseJks, 'hex');
          if (chosen) {
            chosen.edition = 'polychrome';
            run.jokers = run.jokers.filter((j) => j.uid === chosen.uid || j.eternal);
            return { ok: true, message: `妖术赋予「${chosen.name}」多彩版本！`, sfx: 'polychrome' };
          }
          break;
        }
        case 'c_cryptid': {
          const src = selectedOrdered[0];
          src.selected = false;
          for (let i = 0; i < 2; i++) {
            const clone = Balatro.clonePlayingCard(src, false);
            run.addPlayingCardToDeck(clone, true);
            activeHand.push(clone);
          }
          run.sortCardList(activeHand, run.sortMode || 'rank');
          return { ok: true, message: '神秘生物复制了 2 张精确手牌！', sfx: 'spectral' };
        }
        case 'c_soul': {
          const ownedIds = new Set(run.jokers.map((j) => j.id));
          let legPool = Balatro.JOKERS_LEGENDARY.filter((l) => run.hasActiveJoker('j_showman') || !ownedIds.has(l.id));
          if (legPool.length === 0) legPool = Balatro.JOKERS_LEGENDARY;
          const pickedMeta = run.rng.pick(legPool, 'the_soul');
          const legInst = Balatro.createJokerInstance(pickedMeta.id);
          run.addJoker(legInst);
          Balatro.storage.discover('jokers', legInst.id, run.isSeeded);
          return { ok: true, message: `灵魂降临：召唤传奇小丑「${legInst.name}」！`, sfx: 'win' };
        }
        case 'c_black_hole': {
          Balatro.POKER_HANDS.forEach((h) => run.upgradeHand(h.id, 1));
          return { ok: true, message: '黑洞：全部 12 种牌型均升 1 级！', sfx: 'planet' };
        }
        default:
          break;
      }
    }

    return { ok: true, message: '已使用', sfx: 'button' };
  };

  /**
   * 激活并永久应用一张优惠券 (Voucher)
   */
  Balatro.applyVoucher = function applyVoucher(run, voucherId) {
    const meta = Balatro.VOUCHER_MAP[voucherId];
    if (!meta || run.vouchers[voucherId]) return;
    run.vouchers[voucherId] = true;
    Balatro.storage.discover('vouchers', voucherId, run.isSeeded);

    switch (voucherId) {
      case 'v_crystal_ball':
        run.consumableSlots += 1;
        break;
      case 'v_grabber':
      case 'v_nacho_tong':
        run.baseHands += 1;
        run.handsLeft += 1;
        break;
      case 'v_wasteful':
      case 'v_recyclomancy':
        run.baseDiscards += 1;
        run.discardsLeft += 1;
        break;
      case 'v_antimatter':
        run.jokerSlots += 1;
        break;
      case 'v_paint_brush':
      case 'v_palette':
        run.baseHandSize += 1;
        break;
      case 'v_hieroglyph':
        run.ante = Math.max(1, run.ante - 1);
        run.baseHands = Math.max(1, run.baseHands - 1);
        run.handsLeft = Math.min(run.handsLeft, run.baseHands);
        break;
      case 'v_petroglyph':
        run.ante = Math.max(1, run.ante - 1);
        run.baseDiscards = Math.max(0, run.baseDiscards - 1);
        run.discardsLeft = Math.min(run.discardsLeft, run.baseDiscards);
        break;
      case 'v_reroll_surplus':
      case 'v_reroll_glut':
        run.recalcRerollCost();
        break;
      default:
        break;
    }
  };
})(window);

  <script>
'use strict';

/**
 * 原版商店权重生成器、补充包开包生成器与防重复规则 (Showman)
 */
(function initShopEngine(global) {
  const Balatro = global.Balatro;

  /**
   * 收集当前已在场（小丑栏/消耗品栏/当前商店货架/当前卡包）的唯一卡牌 ID，用于非 Showman 防重复过滤
   */
  function getBlockedIds(run, extraItems) {
    if (run.hasActiveJoker('j_showman')) return new Set();
    const set = new Set();
    run.jokers.forEach((j) => set.add(j.id));
    run.consumables.forEach((c) => set.add(c.id));
    if (run.shop && run.shop.items) {
      run.shop.items.forEach((it) => { if (it && it.id) set.add(it.id); });
    }
    if (extraItems) {
      extraItems.forEach((it) => { if (it && it.id) set.add(it.id); });
    }
    return set;
  }

  /**
   * 根据 Hone / Glow Up 优惠券掷骰决定新生成小丑牌的特殊版本
   */
  function rollJokerEdition(run, channel) {
    const mult = run.vouchers['v_glow_up'] ? 4 : (run.vouchers['v_hone'] ? 2 : 1);
    const r = run.rng.next(channel || 'joker_ed');
    // 原版基础概率：负片 0.3%（不受 Hone 放大！），多彩 0.6%，全息 1.4%，闪箔 2.0%
    if (r < 0.003) return 'negative';
    const r2 = run.rng.next((channel || 'joker_ed') + '_2');
    if (r2 < 0.006 * mult) return 'polychrome';
    if (r2 < (0.006 + 0.014) * mult) return 'holo';
    if (r2 < (0.006 + 0.014 + 0.02) * mult) return 'foil';
    return null;
  }

  /**
   * 根据当前赌注等级 (黑注永恒 / 橙注易腐 / 金注租赁) 赋予商店小丑负面词条
   */
  function rollJokerStickers(run, meta, channel) {
    const res = { eternal: false, perishable: false, rental: false };
    const rules = run.challengeRules || {};
    if (rules.allJokersEternal && !meta.noEternal) {
      res.eternal = true;
    } else if (run.stake >= 4 && !meta.noEternal) {
      if (run.rng.next(channel + '_et') < 0.30) res.eternal = true;
    }
    if (!res.eternal && run.stake >= 7 && !meta.noEternal) {
      if (run.rng.next(channel + '_pe') < 0.30) res.perishable = true;
    }
    if (run.stake >= 8) {
      if (run.rng.next(channel + '_re') < 0.30) res.rental = true;
    }
    return res;
  }

  /**
   * 生成一张符合卡池条件的小丑牌实例
   * @param forcedRarity 1 | 2 | 3 | null (null 则按原版 70% / 25% / 5% 掷骰)
   * @param channel RNG 通道名
   * @param cleanStickers 若为审判塔罗/补给标签生成，不带赌注租赁易腐词条（除非挑战强制全永恒）
   */
  Balatro.rollRandomJoker = function rollRandomJoker(run, forcedRarity, channel, cleanStickers, extraItems) {
    const rules = run.challengeRules || {};
    const banned = new Set(rules.bannedJokers || []);
    const blocked = getBlockedIds(run, extraItems);

    let rarity = forcedRarity;
    if (!rarity) {
      const r = run.rng.next(channel + '_rar');
      rarity = r < 0.70 ? 1 : (r < 0.95 ? 2 : 3);
    }

    const filterPool = (rar) => Balatro.JOKERS.filter((j) => {
      if (j.rarity !== rar) return false;
      if (banned.has(j.id)) return false;
      if (j.needExtinct && !run.grosMichelExtinct) return false;
      if (j.id === 'j_gros_michel' && run.grosMichelExtinct) return false;
      if (blocked.has(j.id)) return false;
      return true;
    });

    let pool = filterPool(rarity);
    if (pool.length === 0) pool = filterPool(1);
    if (pool.length === 0) pool = [Balatro.JOKER_MAP['j_joker']];

    const picked = run.rng.pick(pool, channel + '_pick');
    const edition = rollJokerEdition(run, channel + '_ed');
    const stickers = cleanStickers
      ? { eternal: !!(rules.allJokersEternal && !picked.noEternal), perishable: false, rental: false }
      : rollJokerStickers(run, picked, channel);

    const inst = Balatro.createJokerInstance(picked.id, {
      edition,
      eternal: stickers.eternal,
      perishable: stickers.perishable,
      rental: stickers.rental

    return inst;
  };

  /**
   * 生成随机塔罗 / 星球 / 幻灵消耗品实例
   */
  Balatro.rollRandomConsumable = function rollRandomConsumable(run, kind, channel, extraItems) {
    const blocked = getBlockedIds(run, extraItems);
    const rules = run.challengeRules || {};
    const bannedTarots = new Set(rules.bannedTarots || []);

    let pool = [];
    if (kind === 'Tarot') {
      pool = Balatro.TAROTS.filter((t) => !blocked.has(t.id) && !bannedTarots.has(t.id));
      if (pool.length === 0) pool = Balatro.TAROTS.filter((t) => !bannedTarots.has(t.id));
    } else if (kind === 'Planet') {
      pool = Balatro.PLANETS.filter((p) => {
        if (p.secret && !run.unlockedSecretHands[p.handId]) return false;
        return !blocked.has(p.id);
      });
      if (pool.length === 0) pool = Balatro.PLANETS.filter((p) => !p.secret);
    } else if (kind === 'Spectral') {
      pool = Balatro.SPECTRALS.filter((s) => !s.rareSpecial && !blocked.has(s.id));
      if (pool.length === 0) pool = Balatro.SPECTRALS.filter((s) => !s.rareSpecial);
    }

    const picked = run.rng.pick(pool, channel || ('cons_' + kind));
    if (!picked) return null;
    return Balatro.createConsumableInstance(picked.id);
  };

  /**
   * 生成随机标准扑克牌（用于标准包或魔术戏法商店）
   */
  Balatro.rollRandomPlayingCard = function rollRandomPlayingCard(run, channel, allowModifiers) {
    const suit = run.rng.pick(Balatro.SUITS, channel + '_s');
    const rank = run.rng.pick(Balatro.RANKS, channel + '_r');
    let enhancement = null;
    let edition = null;
    let seal = null;

    if (allowModifiers) {
      if (run.rng.next(channel + '_enh') < 0.40) {
        enhancement = run.rng.pick(['bonus', 'mult', 'wild', 'glass', 'steel', 'stone', 'gold', 'lucky'], channel + '_enh_k');
      }
      const edMult = run.vouchers['v_glow_up'] ? 4 : (run.vouchers['v_hone'] ? 2 : 1);
      const er = run.rng.next(channel + '_ed');
      if (er < 0.012 * edMult) edition = 'polychrome';
      else if (er < 0.04 * edMult) edition = 'holo';
      else if (er < 0.08 * edMult) edition = 'foil';

      if (run.rng.next(channel + '_seal') < 0.20) {
        seal = run.rng.pick(['Gold', 'Red', 'Blue', 'Purple'], channel + '_seal_k');
      }
    }

    const pc = Balatro.createPlayingCard(suit, rank, { enhancement, edition, seal });
    pc.baseCost = 1;
    return pc;
  };

  /**
   * 生成或重掷商店单品货架
   */
  Balatro.populateShopShelf = function populateShopShelf(run, isInitialEnter) {
    const slotCount = 2 + (run.vouchers['v_overstock_norm'] ? 1 : 0) + (run.vouchers['v_overstock_plus'] ? 1 : 0);
    const items = [];
    const rules = run.challengeRules || {};

    // 先处理排队中的“罕见标签 / 稀有标签”生成的免费指定稀有度小丑
    if (isInitialEnter && run.pendingShopTags && run.pendingShopTags.length > 0) {
      const restTags = [];
      for (let i = 0; i < run.pendingShopTags.length; i++) {
        const tid = run.pendingShopTags[i];
        if ((tid === 'tag_uncommon' || tid === 'tag_rare') && items.length < slotCount && !rules.noShopJokers) {
          const jk = Balatro.rollRandomJoker(run, tid === 'tag_rare' ? 3 : 2, 'tag_joker_' + run.round, false, items);
          jk.freeTag = true;
          items.push(jk);
        } else {
          restTags.push(tid);
        }
      }
      run.pendingShopTags = restTags;
    }

    // 权重池配置（原版精确比例）
    const jokerWeight = rules.noShopJokers ? 0 : 20;
    const tarotWeight = run.vouchers['v_tarot_tycoon'] ? 32 : (run.vouchers['v_tarot_merchant'] ? 9.6 : 4);
    const planetWeight = run.vouchers['v_planet_tycoon'] ? 32 : (run.vouchers['v_planet_merchant'] ? 9.6 : 4);
    const cardWeight = run.vouchers['v_magic_trick'] ? 4 : 0;
    const spectralWeight = (run.deckConfig && run.deckConfig.spectralInShop) ? 2 : 0;

    while (items.length < slotCount) {
      const ch = `shop_${run.ante}_${run.round}_${run.shopRerolls}_${items.length}`;
      const kind = run.rng.weightedPick([
        { item: 'Joker', weight: jokerWeight },
        { item: 'Tarot', weight: tarotWeight },
        { item: 'Planet', weight: planetWeight },
        { item: 'PlayingCard', weight: cardWeight },
        { item: 'Spectral', weight: spectralWeight }
      ], ch);

      let generated = null;
      if (kind === 'Joker') {
        generated = Balatro.rollRandomJoker(run, null, ch, false, items);
      } else if (kind === 'PlayingCard') {
        generated = Balatro.rollRandomPlayingCard(run, ch, !!run.vouchers['v_illusion']);
      } else {
        generated = Balatro.rollRandomConsumable(run, kind, ch, items);
      }
      if (generated) items.push(generated);
      else break;
    }

    // 处理排队中的版本修饰标签（闪箔 / 全息 / 多彩 / 负片）与代金券全免标签
    if (isInitialEnter && run.pendingShopTags && run.pendingShopTags.length > 0) {
      const modMap = {
        tag_foil: 'foil',
        tag_holo: 'holo',
        tag_polychrome: 'polychrome',
        tag_negative: 'negative'
      };
      const leftover = [];
      run.pendingShopTags.forEach((tid) => {
        if (modMap[tid]) {
          let targetJk = items.find((it) => it.kind === 'Joker' && !it.edition);
          if (!targetJk && !rules.noShopJokers && items.length > 0) {
            targetJk = Balatro.rollRandomJoker(run, null, 'tag_mod_force_' + tid, false, items);
            items[0] = targetJk;
          }
          if (targetJk) {
            targetJk.edition = modMap[tid];
            targetJk.freeTag = true;
          }
        } else if (tid === 'tag_coupon') {
          items.forEach((it) => { it.freeTag = true; });
          run.shopPacksFreeThisVisit = true;
        } else {
          leftover.push(tid);
        }
      });
      run.pendingShopTags = leftover;
    }

    return items;
  };

  /**
   * 为当前底注抽取优惠券（排除已购券与未满足前置的一级券）
   */
  Balatro.rollShopVoucher = function rollShopVoucher(run, existingIds) {
    const exclude = new Set(existingIds || []);
    const candidates = Balatro.VOUCHERS.filter((v) => {
      if (run.vouchers[v.id] || exclude.has(v.id)) return false;
      if (v.req && !run.vouchers[v.req]) return false;
      return true;
    });
    if (candidates.length === 0) return null;
    const picked = run.rng.pick(candidates, `voucher_ante_${run.ante}_${exclude.size}`);
    return {
      uid: Balatro.uid('vc'),
      kind: 'Voucher',
      id: picked.id,
      name: picked.name,
      baseCost: picked.cost,
      desc: picked.desc
    };
  };

  /**
   * 为本次进入商店生成 2 个补充包（原版保底：第一底注首个商店第 1 槽必为普通小丑包！）
   */
  Balatro.rollShopBoosterPacks = function rollShopBoosterPacks(run) {
    const rules = run.challengeRules || {};
    const packs = [];
    const pool = Balatro.BOOSTER_PACKS.filter((p) => {
      if (rules.noShopJokers && p.kind === 'Buffoon') return false;
      if (rules.noStandardPacks && p.kind === 'Standard') return false;
      return true;
    });

    for (let i = 0; i < 2; i++) {
      let meta = null;
      if (!run.firstShopVisited && i === 0 && !rules.noShopJokers) {
        meta = Balatro.PACK_MAP['p_buffoon_normal'];
      } else {
        meta = run.rng.weightedPick(
          pool.map((p) => ({ item: p, weight: p.weight })),
          `pack_${run.ante}_${run.round}_${i}`
        );
      }
      if (meta) {
        packs.push({
          uid: Balatro.uid('pk'),
          kind: 'Pack',
          id: meta.id,
          packKind: meta.kind,
          tier: meta.tier,
          name: meta.name,
          baseCost: meta.cost,
          size: meta.size,
          choose: meta.choose,
          needHand: meta.needHand,
          color: meta.color,
          desc: meta.desc,
          freeTag: !!run.shopPacksFreeThisVisit
        });
      }
    }
    run.firstShopVisited = true;
    run.shopPacksFreeThisVisit = false;
    return packs;
  };

  /**
   * 打开一个补充包，生成卡包内可供挑选的卡牌列表（含 0.3% 灵魂 / 黑洞、预兆天球与望远镜保底）
   */
  Balatro.generatePackCards = function generatePackCards(run, pack) {
    const cards = [];
    const kind = pack.packKind;
    const size = pack.size || 3;

    // 触发幻觉小丑 (Hallucination: 1/2 几率生成塔罗牌)
    const probMult = run.getProbMult();
    run.jokers.forEach((jk) => {
      const eff = Balatro.resolveJokerEffect(jk, run.jokers);
      if (eff && eff.id === 'j_hallucination') {
        if (run.rng.chance(1, 2, probMult, 'hallucination')) {
          run.spawnRandomConsumable('Tarot');
        }
      }
    });

    // 望远镜保底：天体包第 1 张固定为最常打出的牌型星球牌
    let telescopePlanetId = null;
    if (kind === 'Celestial' && run.vouchers['v_telescope'] && run.totalHandsPlayed > 0) {
      const most = run.getMostPlayedHands()[0];
      if (most && Balatro.POKER_HAND_MAP[most]) {
        telescopePlanetId = Balatro.POKER_HAND_MAP[most].planetId;
      }
    }

    for (let i = 0; i < size; i++) {
      const ch = `open_${pack.uid}_${i}`;
      if (kind === 'Buffoon') {
        cards.push(Balatro.rollRandomJoker(run, null, ch, false, cards));
      } else if (kind === 'Standard') {
        cards.push(Balatro.rollRandomPlayingCard(run, ch, true));
      } else if (kind === 'Celestial') {
        if (i === 0 && telescopePlanetId) {
          cards.push(Balatro.createConsumableInstance(telescopePlanetId));
        } else if (run.rng.next(ch + '_bh') < 0.003 && !cards.some((x) => x.id === 'c_black_hole')) {
          cards.push(Balatro.createConsumableInstance('c_black_hole'));
        } else {
          cards.push(Balatro.rollRandomConsumable(run, 'Planet', ch, cards));
        }
      } else if (kind === 'Arcana') {
        if (run.rng.next(ch + '_soul') < 0.003 && !cards.some((x) => x.id === 'c_soul')) {
          cards.push(Balatro.createConsumableInstance('c_soul'));
        } else if (run.vouchers['v_omen_globe'] && run.rng.next(ch + '_omen') < 0.20) {
          cards.push(Balatro.rollRandomConsumable(run, 'Spectral', ch, cards));
        } else {
          cards.push(Balatro.rollRandomConsumable(run, 'Tarot', ch, cards));
        }
      } else if (kind === 'Spectral') {
        const sr = run.rng.next(ch + '_spec_rare');
        if (sr < 0.003 && !cards.some((x) => x.id === 'c_soul')) {
          cards.push(Balatro.createConsumableInstance('c_soul'));
        } else if (sr >= 0.003 && sr < 0.006 && !cards.some((x) => x.id === 'c_black_hole')) {
          cards.push(Balatro.createConsumableInstance('c_black_hole'));
        } else {
          cards.push(Balatro.rollRandomConsumable(run, 'Spectral', ch, cards));
        }
      }
    }

    return cards.filter(Boolean);
  };

  <script>
'use strict';

/**
 * 牌局全生命周期状态机 (GameRun)
 * 负责：开局构建、三阶盲注与标签队列、Boss能力钩子、抽牌/出牌/弃牌、回合收据套现、商店交易、帕克奥与无尽模式
 */
(function initGameState(global) {
  const Balatro = global.Balatro;

  class GameRun {
    constructor(opts) {
      const o = opts || {};
      this.deckId = o.deckId || 'b_red';
      this.stake = o.stake || 1;
      this.challengeId = o.challengeId || null;
      this.isSeeded = !!o.customSeed;
      this.rng = new Balatro.SeededRNG(o.customSeed || null);

      const deckMeta = Balatro.DECK_MAP[this.deckId] || Balatro.DECKS[0];
      this.deckConfig = Object.assign({}, deckMeta.config || {});
      const stakeMeta = Balatro.STAKE_MAP[this.stake] || Balatro.STAKES[0];
      this.scalingTier = stakeMeta.scalingTier || 1;

      const chMeta = this.challengeId ? Balatro.CHALLENGE_MAP[this.challengeId] : null;
      this.challengeRules = chMeta ? Object.assign({}, chMeta.rules) : {};

        this.handPlayCounts[h.id] = 0;

      (this.deckConfig.consumables || []).forEach((cid) => {

    /** 获取完整牌库引用（masterDeck 持有所有永久扑克牌对象，手牌/抽牌堆引用同一批对象） */
    getFullDeck() {

    }

    /** 获取当前可交互的手牌区（打牌态为 this.hand，秘术/幻灵开包态为 packState.tempHand） */
    getInteractiveHand() {
      if (this.state === Balatro.STATES.PACK_OPEN && this.packState && this.packState.tempHand) {
        return this.packState.tempHand;

      return this.hand;

    /** 检查是否拥有指定未失效的小丑牌（或蓝图复制的兼容主动类） */
    hasActiveJoker(jokerId) {
      return this.jokers.some((j) => !j.debuffed && j.id === jokerId);
    }

    /** 获取全都是6！(Oops! All 6s) 叠加后的概率翻倍系数 */
    getProbMult() {
      const cnt = this.jokers.filter((j) => !j.debuffed && j.id === 'j_oops').length;
      return Math.pow(2, cnt);
    }

    /** 计算含负片小丑加成后的实际最大小丑槽位 */
    getEffectiveJokerSlots() {
      const negCount = this.jokers.filter((j) => j.edition === 'negative').length;
      return Math.max(0, this.jokerSlots + negCount);
    }

    /** 计算含负片消耗品加成后的实际最大消耗品槽位 */
    getEffectiveConsumableSlots() {
      const negCount = this.consumables.filter((c) => c.edition === 'negative').length;
      return Math.max(0, this.consumableSlots + negCount);

    canAddConsumable() {
      return this.consumables.length < this.getEffectiveConsumableSlots();

    getEffectiveHandSize() {
      let sz = this.baseHandSize + (this.juggleStacks || 0);
      this.jokers.forEach((j) => {
        if (j.debuffed) return;
        if (j.id === 'j_juggler') sz += 1;
        else if (j.id === 'j_troubadour') sz += 2;
        else if (j.id === 'j_merry_andy') sz -= 1;
        else if (j.id === 'j_stuntman') sz -= 2;
        else if (j.id === 'j_turtle_bean') sz += (j.state && j.state.hSize) || 0;

      if (this.currentBlind && this.currentBlind.id === 'bl_manacle' && !this.bossDisabled && this.state === Balatro.STATES.PLAYING) {

    /** 允许的最低负债额度（信用卡叠加每张 -$20） */
    getMinAllowedMoney() {

      const entry = this.handLevels[handId];
      if (!meta || !entry) return;
      const newLv = Math.max(1, entry.level + deltaLevels);
      entry.level = newLv;
      entry.chips = meta.baseChips + (newLv - 1) * meta.lChips;
      entry.mult = meta.baseMult + (newLv - 1) * meta.lMult;

      Object.keys(this.handPlayCounts).forEach((k) => {
        if (this.handPlayCounts[k] > max) max = this.handPlayCounts[k];

      return Object.keys(this.handPlayCounts).filter((k) => this.handPlayCounts[k] === max);

    addPlayingCardToDeck(card, triggerHologram) {

    destroyPlayingCard(card) {
      this.masterDeck = this.masterDeck.filter((c) => c.uid !== card.uid);
      this.hand = this.hand.filter((c) => c.uid !== card.uid);
      this.drawPile = this.drawPile.filter((c) => c.uid !== card.uid);
      this.discardPile = this.discardPile.filter((c) => c.uid !== card.uid);
      if (this.packState && this.packState.tempHand) {
        this.packState.tempHand = this.packState.tempHand.filter((c) => c.uid !== card.uid);
