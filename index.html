      this.onPlayingCardDestroyed(card);
    }

    onPlayingCardDestroyed(card, eventsOut) {
      const isFace = Balatro.isFaceCard(card, this);
      const isGlass = card.enhancement === 'glass';
      this.jokers.forEach((jk) => {
        if (jk.debuffed) return;
        if (isGlass && jk.id === 'j_glass') {
          jk.state.xMult = Number(((jk.state.xMult || 1.0) + 0.75).toFixed(2));
          if (eventsOut) eventsOut.push({ type: 'joker_scale', jokerUid: jk.uid, text: `X${jk.state.xMult}`, color: '#ef4444', sfx: 'xmult' });
        }
        if (isFace && jk.id === 'j_caino') {
          jk.state.xMult = Number(((jk.state.xMult || 1.0) + 1.0).toFixed(2));
          if (eventsOut) eventsOut.push({ type: 'joker_scale', jokerUid: jk.uid, text: `卡尼奥 X${jk.state.xMult}!`, color: '#ef4444', sfx: 'xmult' });
        }
      });
    }

    spawnRandomConsumable(kind) {
      if (!this.canAddConsumable()) return null;
      const c = Balatro.rollRandomConsumable(this, kind, `spawn_${kind}_${this.round}_${this.consumables.length}`);
      if (c) {
        this.consumables.push(c);
        return c;
      }
      return null;
    }

    spawnShopOrRandomJoker(forcedRarity, ch, clean) {
      return Balatro.rollRandomJoker(this, forcedRarity, ch, clean);
    }

    /** 为当前底注抽取 Boss 盲注与小/大盲注跳过标签 */
    _setupAnteBlinds() {
      this.bossRerolledThisAnte = false;
      this.anteTags = [
        this._rollSkipTag(0),
        this._rollSkipTag(1)
      ];
      this.anteBoss = this._rollBossBlind();
      this.anteBlinds = [
        Balatro.BLIND_MAP['bl_small'],
        Balatro.BLIND_MAP['bl_big'],
        this.anteBoss
      ];
      // 每个新底注补充 1 张新优惠券
      const v = Balatro.rollShopVoucher(this, []);
      this.anteVouchers = v ? [v] : [];
      // 重置本底注出牌记录（供支柱 Boss 使用）
      this.masterDeck.forEach((c) => { c.playedThisAnte = false; });
    }

    _rollSkipTag(slotIdx) {
      const pool = Balatro.TAGS.filter((t) => this.ante >= t.minAnte);
      const picked = this.rng.pick(pool, `ante_tag_${this.ante}_${slotIdx}`);
      if (picked.id === 'tag_orbital') {
        const hands = Balatro.POKER_HANDS.filter((h) => !h.secret || this.unlockedSecretHands[h.id]);
        const h = this.rng.pick(hands, `orbital_${this.ante}_${slotIdx}`);
        return Object.assign({}, picked, { orbitalHandId: h.id, orbitalHandName: h.name });
      }
      return Object.assign({}, picked);
    }

    _rollBossBlind() {
      const isShowdown = this.ante > 0 && this.ante % 8 === 0;
      let pool = Balatro.BLINDS.filter((b) => {
        if (!b.boss) return false;
        if (isShowdown !== !!b.showdown) return false;
        if (this.ante < b.minAnte) return false;
        return !this.usedBosses[b.id];
      });
      if (pool.length === 0) {
        // 所有常规 Boss 轮过一遍后重置池
        this.usedBosses = {};
        pool = Balatro.BLINDS.filter((b) => b.boss && (isShowdown === !!b.showdown) && this.ante >= b.minAnte);
      }
      const b = this.rng.pick(pool, `boss_${this.ante}_${Object.keys(this.usedBosses).length}`);
      this.usedBosses[b.id] = true;
      return b;
    }

    rerollBossBlind(freeFromTag) {
      if (!freeFromTag) {
        const canReroll = this.vouchers['v_retcon'] || (this.vouchers['v_directors_cut'] && !this.bossRerolledThisAnte);
        if (!canReroll || !this.canAfford(10)) return false;
        this.addMoney(-10);
        this.bossRerolledThisAnte = true;
      }
      this.anteBoss = this._rollBossBlind();
      this.anteBlinds[2] = this.anteBoss;
      return true;
    }

    getBlindTargetScore(blindMeta) {
      const base = Balatro.getAnteBaseScore(this.ante, this.scalingTier);
      const deckMult = (this.deckConfig && this.deckConfig.blindMult) || 1;
      return Math.floor(base * (blindMeta.mult || 1) * deckMult);
    }

    /** 跳过当前小盲注或大盲注并立即结算标签（支持双倍标签复制栈！） */
    skipCurrentBlind() {
      if (this.state !== Balatro.STATES.BLIND_SELECT || this.blindIdx >= 2) return null;
      const tag = this.anteTags[this.blindIdx];
      this.blindsSkipped += 1;
      this.blindIdx += 1;

      const results = this.grantTag(tag);
      return results;
    }

    grantTag(tag) {
      if (!tag) return [];
      Balatro.storage.discover('tags', tag.id, this.isSeeded);
      const messages = [];

      if (tag.id === 'tag_double') {
        this.doubleTagStack += 1;
        messages.push('获得「双倍标签」！');
        return messages;
      }

      const copies = 1 + this.doubleTagStack;
      this.doubleTagStack = 0;

      for (let i = 0; i < copies; i++) {
        switch (tag.id) {
          case 'tag_economy': {
            const gain = Balatro.clamp(Math.max(0, this.money), 0, 40);
            this.addMoney(gain);
            messages.push(`经济标签 +$${gain}`);
            break;
          }
          case 'tag_speed': {
            const gain = this.blindsSkipped * 5;
            this.addMoney(gain);
            messages.push(`速度标签 +$${gain}`);
            break;
          }
          case 'tag_handy': {
            const gain = this.totalHandsPlayed;
            this.addMoney(gain);
            messages.push(`顺手标签 +$${gain}`);
            break;
          }
          case 'tag_garbage': {
            const gain = this.unusedDiscardsTotal;
            this.addMoney(gain);
            messages.push(`垃圾标签 +$${gain}`);
            break;
          }
          case 'tag_boss':
            this.rerollBossBlind(true);
            messages.push(`Boss 重掷为「${this.anteBoss.name}」`);
            break;
          case 'tag_orbital': {
            const hid = tag.orbitalHandId || 'Pair';
            this.upgradeHand(hid, 3);
            messages.push(`${Balatro.POKER_HAND_MAP[hid].name} 提升 +3 级！`);
            break;
          }
          case 'tag_top_up': {
            let made = 0;
            for (let k = 0; k < 2; k++) {
              if (this.jokers.length < this.getEffectiveJokerSlots()) {
                this.addJoker(Balatro.rollRandomJoker(this, 1, `topup_${this.round}_${i}_${k}`, true));
                made++;
              }
            }
            messages.push(made > 0 ? `补给生成 ${made} 张普通小丑` : '小丑槽位已满');
            break;
          }
          case 'tag_investment':
            this.investmentTags += 1;
            messages.push('投资标签已就绪（击败Boss得$25）');
            break;
          case 'tag_juggle':
            this.juggleStacks += 3;
            messages.push('下回合手牌上限 +3');
            break;
          case 'tag_d6':
            this.freeShopRerollTag = true;
            messages.push('下个商店初始重掷 $0');
            break;
          case 'tag_voucher': {
            const extraV = Balatro.rollShopVoucher(this, this.anteVouchers.map((v) => v.id));
            if (extraV) this.anteVouchers.push(extraV);
            messages.push('下个商店额外 +1 优惠券');
            break;
          }
          case 'tag_standard':
          case 'tag_charm':
          case 'tag_meteor':
          case 'tag_buffoon':
          case 'tag_ethereal': {
            const mapPack = {
              tag_standard: 'p_standard_mega',
              tag_charm: 'p_arcana_mega',
              tag_meteor: 'p_celestial_mega',
              tag_buffoon: 'p_buffoon_mega',
              tag_ethereal: 'p_spectral_normal'
            };
            const pm = Balatro.PACK_MAP[mapPack[tag.id]];
            if (pm && !this.packState) {
              this.openFreePack(pm, Balatro.STATES.BLIND_SELECT);
              messages.push(`免费开启「${pm.name}」！`);
            }
            break;
          }
          default:
            this.pendingShopTags.push(tag.id);
            messages.push(`${tag.name} 已挂入下个商店`);
            break;
        }
      }

      return messages;
    }

    /** 进入并开战当前激活盲注 */
    startBlind() {
      const blind = this.anteBlinds[this.blindIdx];
      this.currentBlind = blind;
      this.round += 1;
      this.state = Balatro.STATES.PLAYING;
      Balatro.storage.discover('blinds', blind.id, this.isSeeded);

      this.roundScore = 0;
      this.targetScore = this.getBlindTargetScore(blind);
      this.handsPlayedInRound = 0;
      this.discardsUsedInRound = 0;
      this.handsPlayedThisRoundMap = {};
      this.lockedMouthHand = null;
      this.verdantLeafSatisfied = false;
      this.bossDisabled = blind.boss && this.hasActiveJoker('j_chicot');

      // 计算本回合出牌与弃牌次数
      let h = this.baseHands;
      let d = this.baseDiscards;
      this.jokers.forEach((j) => {
        if (j.debuffed) return;
        if (j.id === 'j_drunkard') d += 1;
        else if (j.id === 'j_merry_andy') d += 3;
        else if (j.id === 'j_troubadour') h = Math.max(1, h - 1);
      });

      if (blind.boss && !this.bossDisabled) {
        if (blind.id === 'bl_water') d = 0;
        if (blind.id === 'bl_needle') h = 1;
      }

      this.handsLeft = Math.max(1, h);
      this.discardsLeft = Math.max(0, d);

      // 选盲注时小丑牌效果（仪式匕首、疯狂恶魔、窃贼、大理石、乌合之众、占卜师）
      // 1. 仪式匕首
      for (let i = 0; i < this.jokers.length; i++) {
        const jk = this.jokers[i];
        if (!jk.debuffed && jk.id === 'j_ceremonial' && i + 1 < this.jokers.length) {
          const victim = this.jokers[i + 1];
          if (!victim.eternal) {
            const sv = Balatro.getSellValue(victim, this);
            jk.state.mult = (jk.state.mult || 0) + sv * 2;
            this.jokers.splice(i + 1, 1);
          }
        }
      }

      // 2. 疯狂恶魔（小/大盲注时 +X0.5 并随机摧毁一张非永恒小丑）
      this.jokers.slice().forEach((jk) => {
        if (!jk.debuffed && jk.id === 'j_madness' && !blind.boss) {
          jk.state.xMult = Number(((jk.state.xMult || 1.0) + 0.5).toFixed(2));
          const destructible = this.jokers.filter((o) => o.uid !== jk.uid && !o.eternal);
          if (destructible.length > 0) {
            const v = this.rng.pick(destructible, `madness_${this.round}`);
            this.jokers = this.jokers.filter((o) => o.uid !== v.uid);
          }
        }
      });

      // 3. 支持蓝图复制的开场触发器
      this.jokers.slice().forEach((jk) => {
        const eff = Balatro.resolveJokerEffect(jk, this.jokers);
        if (!eff) return;
        if (eff.id === 'j_burglar') {
          this.handsLeft += 3;
          this.discardsLeft = 0;
        } else if (eff.id === 'j_marble') {
          const stCard = Balatro.createPlayingCard(this.rng.pick(Balatro.SUITS, 'marble'), this.rng.pick(Balatro.RANKS, 'marble'), { enhancement: 'stone' });
          this.addPlayingCardToDeck(stCard, true);
        } else if (eff.id === 'j_riff_raff') {
          for (let r = 0; r < 2; r++) {
            if (this.jokers.length < this.getEffectiveJokerSlots()) {
              this.addJoker(Balatro.rollRandomJoker(this, 1, `riff_${this.round}_${r}`, true));
            }
          }
        } else if (eff.id === 'j_cartomancer') {
          this.spawnRandomConsumable('Tarot');
        }
      });

      // 琥珀橡果 Boss：翻转并洗乱所有小丑牌
      this.jokers.forEach((j) => { j.faceDown = false; if (j.perishRounds > 0) j.debuffed = false; });
      if (blind.boss && !this.bossDisabled && blind.id === 'bl_final_acorn' && this.jokers.length > 0) {
        const pinned = this.jokers.filter((j) => j.pinnedLeft);
        const others = this.rng.shuffle(this.jokers.filter((j) => !j.pinnedLeft), `acorn_${this.round}`);
        this.jokers = pinned.concat(others);
        this.jokers.forEach((j) => { j.faceDown = true; });
      }

      // 准备牌库并抽初始手牌（每回合开局默认重置为按点数排序）
      this.sortMode = 'rank';
      this.hand = [];
      this.discardPile = [];
      this.playedZone = [];
      this.masterDeck.forEach((c) => {
        c.selected = false;
        c.faceDown = false;
        c.forcedSelect = false;
        this.refreshCardDebuff(c);
      });
      this.drawPile = this.rng.shuffle(this.masterDeck.slice(), `shuffle_${this.ante}_${this.round}`);

      // 证书小丑 (Certificate)：回合开始生成一张随机蜡封牌入手
      this.jokers.forEach((jk) => {
        const eff = Balatro.resolveJokerEffect(jk, this.jokers);
        if (eff && eff.id === 'j_certificate') {
          const certCard = Balatro.createPlayingCard(
            this.rng.pick(Balatro.SUITS, 'cert'),
            this.rng.pick(Balatro.RANKS, 'cert'),
            { seal: this.rng.pick(['Gold', 'Red', 'Blue', 'Purple'], 'cert_seal') }
          );
          this.addPlayingCardToDeck(certCard, true);
          this.hand.push(certCard);
        }
      });

      this.drawToHandSize(true, false);
      this._applyStartOfHandBossHooks();
    }

    /** 刷新单张扑克牌是否受当前 Boss 或永久规则失效 */
    refreshCardDebuff(card) {
      if (card.permaDebuffed) {
        card.debuffed = true;
        return;
      }
      if (this.state !== Balatro.STATES.PLAYING && this.state !== Balatro.STATES.SCORING) {
        card.debuffed = false;
        return;
      }
      const b = this.currentBlind;
      if (!b || !b.boss || this.bossDisabled) {
        card.debuffed = false;
        return;
      }
      if (b.id === 'bl_final_leaf' && !this.verdantLeafSatisfied) {
        card.debuffed = true;
        return;
      }
      if (b.id === 'bl_pillar' && card.playedThisAnte) {
        card.debuffed = true;
        return;
      }
      if (b.debuffFace && Balatro.isFaceCard(card, this)) {
        card.debuffed = true;
        return;
      }
      if (b.debuffSuit) {
        if (card.enhancement === 'stone') {
          card.debuffed = false;
        } else if (card.enhancement === 'wild' || Balatro.matchesSuit(card, b.debuffSuit, this)) {
          card.debuffed = true;
        } else {
          card.debuffed = false;
        }
        return;
      }
      card.debuffed = false;
    }

    refreshAllDebuffs() {
      this.masterDeck.forEach((c) => this.refreshCardDebuff(c));
    }

    /** 使当前 Boss 盲注特殊能力立即失效（摔角手出售或获得奇科） */
    disableCurrentBoss() {
      if (!this.currentBlind || !this.currentBlind.boss || this.bossDisabled) return;
      this.bossDisabled = true;
      this.lockedMouthHand = null;
      this.jokers.forEach((j) => {
        j.faceDown = false;
        if (!j.perishable || j.perishRounds > 0) j.debuffed = false;
      });
      this.hand.forEach((c) => {
        c.faceDown = false;
        if (c.forcedSelect) {
          c.forcedSelect = false;
        }
      });
      this.refreshAllDebuffs();
    }

    _applyStartOfHandBossHooks() {
      if (!this.currentBlind || !this.currentBlind.boss || this.bossDisabled) return;
      const b = this.currentBlind;

      // 深红之心：每手随机失效 1 张小丑牌
      if (b.id === 'bl_final_heart' && this.jokers.length > 0) {
        this.jokers.forEach((j) => {
          if (!j.perishable || j.perishRounds > 0) j.debuffed = false;
        });
        const pick = this.rng.pick(this.jokers, `heart_${this.round}_${this.handsPlayedInRound}`);
        if (pick) pick.debuffed = true;
      }

      // 蔚蓝铃铛：每手强制选中 1 张手牌
      if (b.id === 'bl_final_bell' && this.hand.length > 0) {
        this.hand.forEach((c) => { c.forcedSelect = false; });
        const pick = this.rng.pick(this.hand, `bell_${this.round}_${this.handsPlayedInRound}`);
        if (pick) {
          pick.forcedSelect = true;
          pick.selected = true;
        }
      }
    }

    /** 补充抽牌至当前手牌上限（或巨蛇 Boss 固定抽 3 张） */
    drawToHandSize(isInitialDeal, afterPlayAction) {
      const targetSize = this.getEffectiveHandSize();
      const serpentActive = !isInitialDeal && this.currentBlind && this.currentBlind.id === 'bl_serpent' && !this.bossDisabled;
      const needCount = serpentActive ? 3 : Math.max(0, targetSize - this.hand.length);
      const probMult = this.getProbMult();

      for (let i = 0; i < needCount; i++) {
        if (this.drawPile.length === 0) break;
        const c = this.drawPile.pop();
        c.selected = false;
        c.forcedSelect = false;
        c.faceDown = false;

        // 背面朝下判定（房屋 / 车轮 / 游鱼 / 印记 / 透视眼挑战）
        if (this.currentBlind && this.currentBlind.boss && !this.bossDisabled) {
          const bid = this.currentBlind.id;
          if (bid === 'bl_house' && isInitialDeal) c.faceDown = true;
          else if (bid === 'bl_fish' && afterPlayAction) c.faceDown = true;
          else if (bid === 'bl_mark' && Balatro.isFaceCard(c, this)) c.faceDown = true;
          else if (bid === 'bl_wheel' && this.rng.chance(1, 7, probMult, 'wheel_boss')) c.faceDown = true;
        }
        if (this.challengeRules && this.challengeRules.faceDownChance) {
          if (this.rng.next('xray') < this.challengeRules.faceDownChance) c.faceDown = true;
        }

        this.refreshCardDebuff(c);
        this.hand.push(c);
      }
      // 每次发牌/补牌后自动按当前理牌模式（默认按点数 rank）排好手牌顺序
      this.sortHand(this.sortMode || 'rank');
    }

    sortCardList(cardsArr, mode) {
      if (!Array.isArray(cardsArr)) return;
      const suitOrder = { Spades: 0, Hearts: 1, Clubs: 2, Diamonds: 3 };
      if (mode === 'suit') {
        cardsArr.sort((a, b) => {
          if (a.enhancement === 'stone' && b.enhancement !== 'stone') return 1;
          if (b.enhancement === 'stone' && a.enhancement !== 'stone') return -1;
          return (suitOrder[a.suit] - suitOrder[b.suit]) || (b.rank - a.rank);
        });
      } else {
        cardsArr.sort((a, b) => {
          if (a.enhancement === 'stone' && b.enhancement !== 'stone') return 1;
          if (b.enhancement === 'stone' && a.enhancement !== 'stone') return -1;
          return (b.rank - a.rank) || (suitOrder[a.suit] - suitOrder[b.suit]);
        });
      }
    }

    sortHand(mode) {
      if (mode === 'rank' || mode === 'suit') {
        this.sortMode = mode;
      }
      this.sortCardList(this.hand, this.sortMode || 'rank');
    }

    /** 弃掉当前选中的手牌（1 ~ 5 张） */
    discardSelected() {
      if (this.state !== Balatro.STATES.PLAYING || this.discardsLeft <= 0) return null;
      const selected = this.hand.filter((c) => c.selected);
      if (selected.length === 0 || selected.length > 5) return null;

      if (this.challengeRules && this.challengeRules.discardCost) {
        if (!this.canAfford(this.challengeRules.discardCost)) return null;
        this.addMoney(-this.challengeRules.discardCost);
      }

      this.discardsLeft -= 1;
      this.discardsUsedInRound += 1;
      const isFirstDiscard = this.discardsUsedInRound === 1;
      const feedback = [];

      // 烧焦小丑 (Burnt Joker)：本回合第一次弃牌升级该牌型等级
      if (isFirstDiscard) {
        const evalDisc = Balatro.evaluatePokerHand(selected, this);
        this.jokers.forEach((jk) => {
          const eff = Balatro.resolveJokerEffect(jk, this.jokers);
          if (eff && eff.id === 'j_burnt' && evalDisc) {
            this.upgradeHand(evalDisc.handId, 1);
            feedback.push(`${evalDisc.displayName} 升级！`);
          }
        });
      }

      // 集换式卡牌：首次弃单张摧毁得 $3
      let tradingDestroyed = false;
      if (isFirstDiscard && selected.length === 1 && this.hasActiveJoker('j_trading')) {
        this.destroyPlayingCard(selected[0]);
        this.addMoney(3);
        tradingDestroyed = true;
        feedback.push('集换式卡牌摧毁 +$3');
      }

      if (!tradingDestroyed) {
        this.hand = this.hand.filter((c) => !c.selected);
        selected.forEach((c) => {
          c.selected = false;
          c.forcedSelect = false;
          this.discardPile.push(c);
        });
      }

      this._processDiscardedCardsHooks(selected, tradingDestroyed, feedback);
      this.drawToHandSize(false, false);
      this._applyStartOfHandBossHooks();
      return feedback;
    }

    _processDiscardedCardsHooks(discardedCards, alreadyDestroyedFirst, feedback) {
      this.cardsDiscardedTotal += discardedCards.length;

      // 紫蜡封生成塔罗牌
      discardedCards.forEach((c) => {
        if (!c.debuffed && c.seal === 'Purple') {
          if (this.spawnRandomConsumable('Tarot')) {
            feedback.push('紫蜡封 +塔罗牌');
          }
        }
      });

      // 无面小丑：同时弃 >=3 张人头牌
      const faceCnt = discardedCards.filter((c) => !c.debuffed && Balatro.isFaceCard(c, this)).length;
      if (faceCnt >= 3) {
        this.jokers.forEach((jk) => {
          const eff = Balatro.resolveJokerEffect(jk, this.jokers);
          if (eff && eff.id === 'j_faceless') {
            this.addMoney(5);
            feedback.push('无面小丑 +$5');
          }
        });
      }

      // 逐张弃牌钩子（邮寄返利、城堡、上路、拉面、约里克）
      discardedCards.forEach((c) => {
        const isStone = Balatro.isStoneCard(c);
        // 邮寄返利（支持蓝图！）
        this.jokers.forEach((jk) => {
          const eff = Balatro.resolveJokerEffect(jk, this.jokers);
          if (eff && eff.id === 'j_mail' && !c.debuffed && !isStone && c.rank === ((eff.state && eff.state.rank) || 14)) {
            this.addMoney(5);
            feedback.push('邮寄返利 +$5');
          }
        });

        // 自身成长/衰减类
        for (let i = this.jokers.length - 1; i >= 0; i--) {
          const jk = this.jokers[i];
          if (jk.debuffed) continue;
          if (jk.id === 'j_castle' && !c.debuffed && Balatro.matchesSuit(c, (jk.state && jk.state.suit) || 'Spades', this)) {
            jk.state.chips = (jk.state.chips || 0) + 3;
          } else if (jk.id === 'j_hit_the_road' && !c.debuffed && !isStone && c.rank === 11) {
            jk.state.xMult = Number(((jk.state.xMult || 1.0) + 0.5).toFixed(2));
          } else if (jk.id === 'j_ramen') {
            jk.state.xMult = Number(((jk.state.xMult || 2.0) - 0.01).toFixed(2));
            if (jk.state.xMult <= 1.0) {
              this.jokers.splice(i, 1);
              feedback.push('拉面吃光了！');
            }
          } else if (jk.id === 'j_yorick') {
            jk.state.remDiscards = (jk.state.remDiscards !== undefined ? jk.state.remDiscards : 23) - 1;
            if (jk.state.remDiscards <= 0) {
              jk.state.remDiscards = 23;
              jk.state.xMult = (jk.state.xMult || 1) + 1;
              feedback.push(`约里克升级 X${jk.state.xMult}！`);
            }
          }
        }
      });

      // 绿色小丑每次弃牌 -1 倍率（仅扣1次）
      this.jokers.forEach((jk) => {
        if (!jk.debuffed && jk.id === 'j_green_joker') {
          jk.state.mult = Math.max(0, (jk.state.mult || 0) - 1);
        }
      });
    }

    /** 打出当前选中的 1~5 张手牌，执行完整 7 阶段管线并返回动画数据包 */
    playSelectedHand() {
      if (this.state !== Balatro.STATES.PLAYING || this.handsLeft <= 0) return null;
      const played = this.hand.filter((c) => c.selected);
      if (played.length === 0 || played.length > 5) return null;

      this.state = Balatro.STATES.SCORING;
      this.handsLeft -= 1;
      this.handsPlayedInRound += 1;
      this.cardsPlayedTotal += played.length;

      // 出牌移入中央出牌区，翻开背面牌
      this.hand = this.hand.filter((c) => !c.selected);
      played.forEach((c) => {
        c.selected = false;
        c.forcedSelect = false;
        c.faceDown = false;
      });
      this.playedZone = played.slice();

      // 钩子 Boss：出牌时随机弃掉手牌中的 2 张牌（同时触发紫蜡封与弃牌钩子！）
      const hookFeedback = [];
      if (this.currentBlind && this.currentBlind.id === 'bl_hook' && !this.bossDisabled && this.hand.length > 0) {
        const shuffledH = this.rng.shuffle(this.hand.slice(), `hook_${this.round}_${this.handsPlayedInRound}`);
        const hooked = shuffledH.slice(0, Math.min(2, shuffledH.length));
        const hookedSet = new Set(hooked.map((x) => x.uid));
        this.hand = this.hand.filter((c) => !hookedSet.has(c.uid));
        hooked.forEach((c) => this.discardPile.push(c));
        this._processDiscardedCardsHooks(hooked, false, hookFeedback);
      }

      const result = Balatro.executeScoringPipeline(this, played);
      this.lastPlayedHandId = result.handId;
      if (result.handScore > this.bestHandScore) {
        this.bestHandScore = result.handScore;
      }

      return {
        played,
        hookFeedback,
        pipelineResult: result
      };
    }

    /** 在动画导演播放完单手计分动画后调用，落地总分并推进胜负或下一手抽牌 */
    finishHandResolution(pipelineResult) {
      this.roundScore += pipelineResult.handScore;

      // 清理碎裂玻璃牌与第六感销毁牌，其余打出的牌进弃牌堆
      const destroyedSet = new Set(pipelineResult.shatteredUids || []);
      if (pipelineResult.sixthSenseDestroyUid) destroyedSet.add(pipelineResult.sixthSenseDestroyUid);

      this.playedZone.forEach((c) => {
        if (destroyedSet.has(c.uid)) {
          this.masterDeck = this.masterDeck.filter((m) => m.uid !== c.uid);
        } else {
          this.discardPile.push(c);
        }
      });
      this.playedZone = [];

      // 判断是否已击破盲注！
      if (this.roundScore >= this.targetScore) {
        this._completeBlindVictory(false);
        return 'BLIND_WON';
      }

      // 若出牌次数耗尽，检查骨头先生 (Mr. Bones >= 25% 免死)
      if (this.handsLeft <= 0) {
        const bonesIdx = this.jokers.findIndex((j) => !j.debuffed && j.id === 'j_mr_bones');
        if (bonesIdx !== -1 && this.roundScore >= this.targetScore * 0.25) {
          this.jokers.splice(bonesIdx, 1);
          this._completeBlindVictory(true);
          return 'SAVED_BY_BONES';
        }
        this.state = Balatro.STATES.GAME_OVER;
        Balatro.storage.clearSavedRun();
        return 'GAME_OVER';
      }

      // 继续下一手抽牌
      this.state = Balatro.STATES.PLAYING;
      this.drawToHandSize(false, true);
      this._applyStartOfHandBossHooks();
      return 'NEXT_HAND';
    }

    /** 盲注击破：结算手牌蓝蜡封、黄金牌、回合末经济小丑、食物衰减并生成收据单 */
    _completeBlindVictory(savedByBones) {
      this.unusedDiscardsTotal += this.discardsLeft;
      this.juggleStacks = 0;

      // 1. 统计哑剧演员重触发次数
      let mimeCount = 0;
      this.jokers.forEach((jk) => {
        const eff = Balatro.resolveJokerEffect(jk, this.jokers);
        if (eff && eff.id === 'j_mime') mimeCount += 1;
      });

      // 2. 手牌留存蓝蜡封与黄金牌结算
      let goldCardsMoney = 0;
      this.hand.forEach((hc) => {
        if (hc.debuffed) return;
        const passes = 1 + (hc.seal === 'Red' ? 1 : 0) + mimeCount;
        for (let p = 0; p < passes; p++) {
          if (hc.seal === 'Blue' && this.canAddConsumable()) {
            const pMeta = Balatro.POKER_HAND_MAP[this.lastPlayedHandId];
            if (pMeta && pMeta.planetId) {
              const pl = Balatro.createConsumableInstance(pMeta.planetId);
              if (pl) this.consumables.push(pl);
            }
          }
          if (hc.enhancement === 'gold') {
            goldCardsMoney += 3;
          }
        }
      });

      // 3. 计算回合收据明细
      const lines = [];
      let totalPayout = 0;
      const b = this.currentBlind;
      const rules = this.challengeRules || {};

      // 盲注基础赏金
      let blindReward = savedByBones ? 0 : (b.dollars || 3);
      if (this.stake >= 2 && b.id === 'bl_small') blindReward = 0;
      if (rules.noBlindReward) blindReward = 0;
      if (rules.noSmallBigReward && !b.boss) blindReward = 0;
      if (blindReward > 0) {
        lines.push({ label: `${b.name} 过关赏金`, amount: blindReward });
        totalPayout += blindReward;
      } else if (savedByBones) {
        lines.push({ label: '骨头先生舍身免死！', amount: 0 });
      }

      // 剩余出牌奖励
      const perHandDollar = (this.deckConfig && this.deckConfig.handDollar) || 1;
      if (!rules.noHandMoney && this.handsLeft > 0) {
        const hm = this.handsLeft * perHandDollar;
        lines.push({ label: `剩余出牌 (${this.handsLeft})`, amount: hm });
        totalPayout += hm;
      }

      // 绿色牌组剩余弃牌奖励
      if (this.deckConfig && this.deckConfig.discardDollar && this.discardsLeft > 0) {
        const dm = this.discardsLeft * this.deckConfig.discardDollar;
        lines.push({ label: `剩余弃牌 (${this.discardsLeft})`, amount: dm });
        totalPayout += dm;
      }

      // 利息计算
      const noInterest = !!(this.deckConfig && this.deckConfig.noInterest) || !!rules.noInterest;
      if (!noInterest && this.money >= 5) {
        const maxUnits = this.vouchers['v_money_tree'] ? 20 : (this.vouchers['v_seed_money'] ? 10 : 5);
        const units = Math.min(maxUnits, Math.floor(this.money / 5));
        const moonCount = this.jokers.filter((j) => !j.debuffed && j.id === 'j_to_the_moon').length;
        const interest = units * (1 + moonCount);
        if (interest > 0) {
          lines.push({ label: `利息收益 (每$5得$${1 + moonCount})`, amount: interest });
          totalPayout += interest;
        }
      }

      if (goldCardsMoney > 0) {
        lines.push({ label: '手牌黄金牌收益', amount: goldCardsMoney });
        totalPayout += goldCardsMoney;
      }

      // 投资标签（Boss 击败时触发）
      if (b.boss && this.investmentTags > 0) {
        const inv = this.investmentTags * 25;
        this.investmentTags = 0;
        lines.push({ label: '投资标签兑现', amount: inv });
        totalPayout += inv;
      }

      // 经济小丑结算与火箭升级
      this.jokers.forEach((jk) => {
        if (jk.debuffed) return;
        if (jk.id === 'j_golden') {
          lines.push({ label: '黄金小丑', amount: 4 });
          totalPayout += 4;
        } else if (jk.id === 'j_delayed_grat' && this.discardsUsedInRound === 0 && this.baseDiscards > 0) {
          const dg = this.discardsLeft * 2;
          if (dg > 0) {
            lines.push({ label: '延迟满足', amount: dg });
            totalPayout += dg;
          }
        } else if (jk.id === 'j_cloud_9') {
          const c9 = this.masterDeck.filter((c) => !Balatro.isStoneCard(c) && c.rank === 9).length;
          if (c9 > 0) {
            lines.push({ label: `九霄云外 (${c9}张9)`, amount: c9 });
            totalPayout += c9;
          }
        } else if (jk.id === 'j_rocket') {
          const pay = (jk.state && jk.state.payout) || 1;
          lines.push({ label: '火箭分红', amount: pay });
          totalPayout += pay;
          if (b.boss) jk.state.payout = pay + 2;
        } else if (jk.id === 'j_satellite') {
          const sat = Object.keys(this.uniquePlanetsUsed).length;
          if (sat > 0) {
            lines.push({ label: `卫星 (${sat}种星球)`, amount: sat });
            totalPayout += sat;
          }
        }
      });

      // 4. 回合末小丑状态变更（租赁扣费、鸡蛋/礼品卡增值、隐形进度、香蕉/爆米花/黑龟豆、易腐倒计时）
      const probMult = this.getProbMult();
      const roundEndNotes = [];

      for (let i = this.jokers.length - 1; i >= 0; i--) {
        const jk = this.jokers[i];

        if (jk.rental) {
          this.addMoney(-3);
          roundEndNotes.push(`${jk.name} 租金 -$3`);
        }

        if (!jk.debuffed) {
          if (jk.id === 'j_egg') {
            jk.extraSellValue = (jk.extraSellValue || 0) + 3;
            roundEndNotes.push('鸡蛋增值 +$3');
          } else if (jk.id === 'j_gift') {
            this.jokers.forEach((o) => { o.extraSellValue = (o.extraSellValue || 0) + 1; });
            this.consumables.forEach((o) => { o.extraSellValue = (o.extraSellValue || 0) + 1; });
            roundEndNotes.push('礼品卡全场售价 +$1');
          } else if (jk.id === 'j_invisible') {
            jk.state.rounds = (jk.state.rounds || 0) + 1;
          } else if (jk.id === 'j_hit_the_road') {
            jk.state.xMult = 1.0;
          } else if (jk.id === 'j_campfire' && b.boss) {
            jk.state.xMult = 1.0;
            roundEndNotes.push('篝火已重置');
          } else if (jk.id === 'j_gros_michel') {
            if (this.rng.chance(1, 6, probMult, 'gros_michel')) {
              this.grosMichelExtinct = true;
              this.jokers.splice(i, 1);
              roundEndNotes.push('大麦克香蕉灭绝了！');
              continue;
            }
          } else if (jk.id === 'j_cavendish') {
            if (this.rng.chance(1, 1000, probMult, 'cavendish')) {
              this.jokers.splice(i, 1);
              roundEndNotes.push('卡文迪什奇迹般灭绝了！');
              continue;
            }
          } else if (jk.id === 'j_popcorn') {
            jk.state.mult -= 4;
            if (jk.state.mult <= 0) {
              this.jokers.splice(i, 1);
              roundEndNotes.push('爆米花吃完了！');
              continue;
            }
          } else if (jk.id === 'j_turtle_bean') {
            jk.state.hSize -= 1;
            if (jk.state.hSize <= 0) {
              this.jokers.splice(i, 1);
              roundEndNotes.push('黑龟豆吃完了！');
              continue;
            }
          }
        }

        if (jk.perishable && jk.perishRounds > 0) {
          jk.perishRounds -= 1;
          if (jk.perishRounds <= 0) {
            jk.debuffed = true;
            roundEndNotes.push(`${jk.name} 已腐烂失效！`);
          }
        }
      }

      // 浮雕牌组：击败 Boss 获得双倍标签
      if (b.boss && this.deckConfig && this.deckConfig.bossDoubleTag) {
        this.doubleTagStack += 1;
        roundEndNotes.push('浮雕牌组：获得双倍标签！');
      }

      // 定型角色挑战：击败 Ante 4 Boss 锁死小丑
      if (b.boss && this.ante === 4 && rules.typecastAnte4) {
        this.jokers.forEach((j) => { j.eternal = true; });
        this.jokerSlots = 0;
        roundEndNotes.push('定型角色：小丑已锁定永恒！');
      }

      this._rotateRoundTargets();

      // 检查是否刚刚首次通关底注 8 Boss！
      if (b.boss && this.ante === 8 && !this.wonAnte8) {
        this.wonAnte8 = true;
        this.cashOutSummary = { lines, totalPayout, roundEndNotes };
        Balatro.storage.recordWin(this);
        this.state = Balatro.STATES.VICTORY;
        return;
      }

      this.cashOutSummary = { lines, totalPayout, roundEndNotes };
      this.state = Balatro.STATES.ROUND_EVAL;
    }

    /** 每回合结束轮换：远古小丑花色、城堡花色、邮寄返利点数、神像牌与待办清单牌型 */
    _rotateRoundTargets() {
      const nonStones = this.masterDeck.filter((c) => c.enhancement !== 'stone');
      this.jokers.forEach((jk) => {
        if (jk.id === 'j_ancient') {
          const others = Balatro.SUITS.filter((s) => s !== (jk.state && jk.state.suit));
          jk.state.suit = this.rng.pick(others, `ancient_${this.round}`);
        } else if (jk.id === 'j_castle') {
          const picked = nonStones.length > 0 ? this.rng.pick(nonStones, `castle_${this.round}`).suit : this.rng.pick(Balatro.SUITS, `castle_${this.round}`);
          jk.state.suit = picked;
        } else if (jk.id === 'j_mail') {
          const picked = nonStones.length > 0 ? this.rng.pick(nonStones, `mail_${this.round}`).rank : this.rng.pick(Balatro.RANKS, `mail_${this.round}`);
          jk.state.rank = picked;
        } else if (jk.id === 'j_idol') {
          if (nonStones.length > 0) {
            const c = this.rng.pick(nonStones, `idol_${this.round}`);
            jk.state.rank = c.rank;
            jk.state.suit = c.suit;
          }
        } else if (jk.id === 'j_todo_list') {
          const hands = Balatro.POKER_HANDS.filter((h) => (!h.secret || this.unlockedSecretHands[h.id]) && h.id !== (jk.state && jk.state.targetHand));
          const h = this.rng.pick(hands, `todo_${this.round}`);
          if (h) jk.state.targetHand = h.id;
        }
      });
    }

    /** 从胜利弹窗选择进入无尽模式或从收据单点击套现进入商店 */
    cashOutAndEnterShop() {
      if (this.cashOutSummary) {
        this.addMoney(this.cashOutSummary.totalPayout);
        this.cashOutSummary = null;
      }

      // 若刚打完 Boss，底注 +1 并抽新一轮三阶盲注
      if (this.currentBlind && this.currentBlind.boss) {
        this.ante += 1;
        this.blindIdx = 0;
        this._setupAnteBlinds();
      } else {
        this.blindIdx += 1;
      }

      this.state = Balatro.STATES.SHOP;
      this.shopRerolls = 0;
      this.chaosUsedThisShop = false;

      this.shop = {
        items: Balatro.populateShopShelf(this, true),
        vouchers: this.anteVouchers.slice(),
        packs: Balatro.rollShopBoosterPacks(this),
        rerollCost: 5
      };
      this.recalcRerollCost();
    }

    recalcRerollCost() {
      if (!this.shop) return;
      const chaosCount = this.jokers.filter((j) => !j.debuffed && j.id === 'j_chaos').length;
      if (this.freeShopRerollTag && this.shopRerolls === 0) {
        this.shop.rerollCost = 0;
        return;
      }
      if (chaosCount > 0 && this.shopRerolls < chaosCount) {
        this.shop.rerollCost = 0;
        return;
      }
      let base = 5 - (this.vouchers['v_reroll_surplus'] ? 2 : 0) - (this.vouchers['v_reroll_glut'] ? 2 : 0);
      base = Math.max(0, base);
      const paidRolls = Math.max(0, this.shopRerolls - chaosCount - (this.freeShopRerollTag ? 1 : 0));
      this.shop.rerollCost = base + paidRolls + (this.inflationBonus || 0);
    }

    rerollShop() {
      if (this.state !== Balatro.STATES.SHOP) return false;
      const cost = this.shop.rerollCost;
      if (!this.canAfford(cost)) return false;
      this.addMoney(-cost);
      this.shopRerolls += 1;
      this.rerollsTotal += 1;
      if (this.freeShopRerollTag && this.shopRerolls === 1) {
        this.freeShopRerollTag = false;
      }

      // 闪卡小丑每次重掷 +2 倍率
      this.jokers.forEach((jk) => {
        if (!jk.debuffed && jk.id === 'j_flash') {
          jk.state.mult = (jk.state.mult || 0) + 2;
        }
      });

      this.shop.items = Balatro.populateShopShelf(this, false);
      this.recalcRerollCost();
      return true;
    }

    /** 购买商店货架单品 / 优惠券 / 补充包 */
    buyShopEntry(category, uid, useImmediately) {
      if (this.state !== Balatro.STATES.SHOP) return { ok: false, msg: '不在商店中' };
      const list = category === 'voucher' ? this.shop.vouchers : (category === 'pack' ? this.shop.packs : this.shop.items);
      const idx = list.findIndex((x) => x.uid === uid);
      if (idx === -1) return { ok: false, msg: '商品不存在' };

      const item = list[idx];
      const cost = Balatro.getBuyCost(item, this);
      if (!this.canAfford(cost)) return { ok: false, msg: '资金不足！' };

      if (item.kind === 'Joker') {
        const maxSlots = item.edition === 'negative' ? this.getEffectiveJokerSlots() + 1 : this.getEffectiveJokerSlots();
        if (this.jokers.length >= maxSlots) return { ok: false, msg: '小丑牌槽位已满！' };
        this.addMoney(-cost);
        list.splice(idx, 1);
        delete item.freeTag;
        this.addJoker(item);
      } else if (item.kind === 'PlayingCard') {
        this.addMoney(-cost);
        list.splice(idx, 1);
        this.addPlayingCardToDeck(item, true);
      } else if (item.kind === 'Voucher') {
        this.addMoney(-cost);
        list.splice(idx, 1);
        this.anteVouchers = this.anteVouchers.filter((v) => v.id !== item.id);
        Balatro.applyVoucher(this, item.id);
      } else if (item.kind === 'Pack') {
        this.addMoney(-cost);
        list.splice(idx, 1);
        this.openFreePack(item, Balatro.STATES.SHOP);
      } else {
        // Tarot / Planet / Spectral
        if (useImmediately) {
          const check = Balatro.canUseConsumable(this, item);
          if (!check.ok) return { ok: false, msg: check.reason };
          this.addMoney(-cost);
          list.splice(idx, 1);
          const res = Balatro.applyConsumable(this, item, false);
          this._afterPurchaseBump();
          return { ok: true, msg: res.message, sfx: res.sfx };
        } else {
          if (!this.canAddConsumable() && item.edition !== 'negative') {
            return { ok: false, msg: '消耗品槽位已满！' };
          }
          this.addMoney(-cost);
          list.splice(idx, 1);
          delete item.freeTag;
          this.consumables.push(item);
        }
      }

      this._afterPurchaseBump();
      return { ok: true, msg: `已购买「${item.name || '扑克牌'}」`, sfx: 'coin' };
    }

    _afterPurchaseBump() {
      this.cardsPurchasedTotal += 1;
      if (this.challengeRules && this.challengeRules.inflation) {
        this.inflationBonus = (this.inflationBonus || 0) + 1;
        this.recalcRerollCost();
      }
    }

    /** 出售拥有的小丑牌或消耗品 */
    sellOwnedCard(uid) {
      const jIdx = this.jokers.findIndex((j) => j.uid === uid);
      if (jIdx !== -1) {
        const jk = this.jokers[jIdx];
        if (jk.eternal) return { ok: false, msg: '永恒小丑无法出售！' };
        const val = Balatro.getSellValue(jk, this);
        this.addMoney(val);
        this.jokers.splice(jIdx, 1);

        let extraMsg = '';
        if (!jk.debuffed && jk.id === 'j_luchador') {
          this.disableCurrentBoss();
          extraMsg = '（Boss能力已失效！）';
        } else if (!jk.debuffed && jk.id === 'j_diet_cola') {
          this.doubleTagStack += 1;
          extraMsg = '（获得双倍标签！）';
        } else if (!jk.debuffed && jk.id === 'j_invisible' && ((jk.state && jk.state.rounds) || 0) >= 2 && this.jokers.length > 0) {
          const target = this.rng.pick(this.jokers, `invis_${this.round}`);
          const dup = Balatro.createJokerInstance(target.id, {
            edition: target.edition === 'negative' ? null : target.edition,
            eternal: target.eternal,
            perishable: target.perishable,
            perishRounds: 5,
            rental: target.rental,
            state: JSON.parse(JSON.stringify(target.state || {}))
          });
          this.addJoker(dup);
          extraMsg = `（复制了「${target.name}」！`;
        }

        // 翠绿树叶 Boss 解锁扑克牌失效
        if (this.currentBlind && this.currentBlind.id === 'bl_final_leaf') {
          this.verdantLeafSatisfied = true;
          this.refreshAllDebuffs();
        }

        this._triggerCampfireOnSell();
        return { ok: true, msg: `出售获得 +$${val}${extraMsg}`, sfx: 'coin' };
      }

      const cIdx = this.consumables.findIndex((c) => c.uid === uid);
      if (cIdx !== -1) {
        const cs = this.consumables[cIdx];
        const val = Balatro.getSellValue(cs, this);
        this.addMoney(val);
        this.consumables.splice(cIdx, 1);
        this._triggerCampfireOnSell();
        return { ok: true, msg: `出售获得 +$${val}`, sfx: 'coin' };
      }

      return { ok: false, msg: '未找到卡牌' };
    }

    _triggerCampfireOnSell() {
      this.jokers.forEach((jk) => {
        if (!jk.debuffed && jk.id === 'j_campfire') {
          jk.state.xMult = Number(((jk.state.xMult || 1.0) + 0.25).toFixed(2));
        }
      });
    }

    openFreePack(packMetaOrInst, returnState) {
      const pack = Object.assign({}, packMetaOrInst);
      pack.packKind = pack.packKind || pack.kind;
      const cards = Balatro.generatePackCards(this, pack);

      let tempHand = null;
      if (pack.needHand) {
        const shuffled = this.rng.shuffle(this.masterDeck.slice(), `pack_hand_${this.round}_${cards.length}`);
        tempHand = shuffled.slice(0, this.getEffectiveHandSize());
        tempHand.forEach((c) => { c.selected = false; c.faceDown = false; c.debuffed = false; });
        this.sortCardList(tempHand, this.sortMode || 'rank');
      }

      this.packState = {
        pack,
        cards,
        choosesLeft: pack.choose || 1,
        tempHand,
        returnState: returnState || Balatro.STATES.SHOP
      };
      this.state = Balatro.STATES.PACK_OPEN;
    }

    pickCardFromPack(cardUid) {
      if (this.state !== Balatro.STATES.PACK_OPEN || !this.packState) return { ok: false, msg: '无打开的卡包' };
      const ps = this.packState;
      const idx = ps.cards.findIndex((c) => c.uid === cardUid);
      if (idx === -1) return { ok: false, msg: '卡牌不存在' };

      const card = ps.cards[idx];
      let resMsg = '';
      let sfx = 'cardSelect';
      let burnedCards = null;

      if (card.kind === 'Joker') {
        const maxSlots = card.edition === 'negative' ? this.getEffectiveJokerSlots() + 1 : this.getEffectiveJokerSlots();
        if (this.jokers.length >= maxSlots) return { ok: false, msg: '小丑牌槽位已满！（可先出售上方小丑牌）' };
        ps.cards.splice(idx, 1);
        this.addJoker(card);
        resMsg = `获得「${card.name}」！`;
      } else if (card.kind === 'PlayingCard') {
        ps.cards.splice(idx, 1);
        this.addPlayingCardToDeck(card, true);
        resMsg = '已将新扑克牌加入牌组！';
      } else {
        // 秘术包 / 天体包 / 幻灵包：当场立即发动效果！
        const check = Balatro.canUseConsumable(this, card);
        if (!check.ok) return { ok: false, msg: check.reason };
        ps.cards.splice(idx, 1);
        const applied = Balatro.applyConsumable(this, card, true);
        resMsg = applied.message;
        sfx = applied.sfx || 'tarot';
        burnedCards = applied.burnedCards || null;
      }

      ps.choosesLeft -= 1;
      if (ps.choosesLeft <= 0 || ps.cards.length === 0) {
        this._closePack(false);
      }

      return { ok: true, msg: resMsg, sfx, burnedCards };
    }

    skipCurrentPack() {
      if (this.state !== Balatro.STATES.PACK_OPEN || !this.packState) return;
      this.jokers.forEach((jk) => {
        if (!jk.debuffed && jk.id === 'j_red_card') {
          jk.state.mult = (jk.state.mult || 0) + 3;
        }
      });
      this._closePack(true);
    }

    _closePack() {
      if (!this.packState) return;
      if (this.packState.tempHand) {
        this.packState.tempHand.forEach((c) => { c.selected = false; });
      }
      const nextSt = this.packState.returnState || Balatro.STATES.SHOP;
      this.packState = null;
      this.state = nextSt;
    }

    /** 离开商店前往下一回合盲注选择（触发传奇帕克奥 Perkeo 复制负片消耗品！） */
    leaveShop() {
      if (this.state !== Balatro.STATES.SHOP) return [];
      const perkeoNotes = [];
      if (this.consumables.length > 0) {
        this.jokers.forEach((jk) => {
          const eff = Balatro.resolveJokerEffect(jk, this.jokers);
          if (eff && eff.id === 'j_perkeo') {
            const src = this.rng.pick(this.consumables, `perkeo_${this.round}`);
            const copy = Balatro.createConsumableInstance(src.id, { edition: 'negative' });
            if (copy) {
              this.consumables.push(copy);
              perkeoNotes.push(`帕克奥生成了负片「${copy.name}」！`);
            }
          }
        });
      }
      this.state = Balatro.STATES.BLIND_SELECT;
      return perkeoNotes;
    }

    /** 序列化完整牌局快照供断点续玩 */
    toJSON() {
      const uidOf = (arr) => (arr || []).map((c) => c.uid);
      return {

        stake: this.stake,
        challengeId: this.challengeId,
        isSeeded: this.isSeeded,

        jokerSlots: this.jokerSlots,
        consumableSlots: this.consumableSlots,
        money: this.money,
        startingDeckSize: this.startingDeckSize,
        masterDeck: this.masterDeck,
        drawPileUids: uidOf(this.drawPile),
        handUids: uidOf(this.hand),
        discardPileUids: uidOf(this.discardPile),
        jokers: this.jokers,
        consumables: this.consumables,
        vouchers: this.vouchers,
        handLevels: this.handLevels,
        handPlayCounts: this.handPlayCounts,
        unlockedSecretHands: this.unlockedSecretHands,
        totalHandsPlayed: this.totalHandsPlayed,
        unusedDiscardsTotal: this.unusedDiscardsTotal,
        blindsSkipped: this.blindsSkipped,
        tarotsUsed: this.tarotsUsed,
        planetsUsed: this.planetsUsed,
        uniquePlanetsUsed: this.uniquePlanetsUsed,
        lastTarotOrPlanetId: this.lastTarotOrPlanetId,

        cardsDiscardedTotal: this.cardsDiscardedTotal,
        cardsPurchasedTotal: this.cardsPurchasedTotal,
        rerollsTotal: this.rerollsTotal,
        doubleTagStack: this.doubleTagStack,
        pendingShopTags: this.pendingShopTags,
        investmentTags: this.investmentTags,
        juggleStacks: this.juggleStacks,
        freeShopRerollTag: this.freeShopRerollTag,
        firstShopVisited: this.firstShopVisited,
        anteVouchers: this.anteVouchers,
        bossRerolledThisAnte: this.bossRerolledThisAnte,
        usedBosses: this.usedBosses,
        anteTags: this.anteTags,
        anteBossId: this.anteBoss ? this.anteBoss.id : 'bl_hook',
        currentBlindId: this.currentBlind ? this.currentBlind.id : null,
        sortMode: this.sortMode || 'rank',
        handsLeft: this.handsLeft,
        discardsLeft: this.discardsLeft,
        handsPlayedInRound: this.handsPlayedInRound,
        discardsUsedInRound: this.discardsUsedInRound,
        handsPlayedThisRoundMap: this.handsPlayedThisRoundMap,
        lastPlayedHandId: this.lastPlayedHandId,
        lockedMouthHand: this.lockedMouthHand,
        verdantLeafSatisfied: this.verdantLeafSatisfied,
        bossDisabled: this.bossDisabled,
        roundScore: this.roundScore,
        targetScore: this.targetScore,
        cashOutSummary: this.cashOutSummary,
        shop: this.shop,
        shopRerolls: this.shopRerolls,
        packState: this.packState ? {
          pack: this.packState.pack,
          cards: this.packState.cards,
          choosesLeft: this.packState.choosesLeft,
          tempHandUids: uidOf(this.packState.tempHand),
          returnState: this.packState.returnState
        } : null
      };
    }

    static fromJSON(snap) {
      const run = new GameRun({
        deckId: snap.deckId,
        stake: snap.stake,
        challengeId: snap.challengeId,
        customSeed: snap.rng ? snap.rng.seed : null
      });
      run.isSeeded = !!snap.isSeeded;
      run.rng = new Balatro.SeededRNG(snap.rng.seed, snap.rng.counters);

      const scalarKeys = [
        'state', 'ante', 'round', 'blindIdx', 'wonAnte8', 'endless',
        'baseHands', 'baseDiscards', 'baseHandSize', 'jokerSlots', 'consumableSlots',
        'money', 'startingDeckSize', 'jokers', 'consumables', 'vouchers',
        'handLevels', 'handPlayCounts', 'unlockedSecretHands', 'totalHandsPlayed',
        'unusedDiscardsTotal', 'blindsSkipped', 'tarotsUsed', 'planetsUsed',
        'uniquePlanetsUsed', 'lastTarotOrPlanetId', 'grosMichelExtinct',
        'ectoplasmPenalty', 'inflationBonus', 'bestHandScore', 'cardsPlayedTotal',
        'cardsDiscardedTotal', 'cardsPurchasedTotal', 'rerollsTotal',
        'doubleTagStack', 'pendingShopTags', 'investmentTags', 'juggleStacks',
        'freeShopRerollTag', 'firstShopVisited', 'anteVouchers', 'bossRerolledThisAnte',
        'usedBosses', 'anteTags', 'sortMode', 'handsLeft', 'discardsLeft', 'handsPlayedInRound',
        'discardsUsedInRound', 'handsPlayedThisRoundMap', 'lastPlayedHandId',
        'lockedMouthHand', 'verdantLeafSatisfied', 'bossDisabled', 'roundScore',
        'targetScore', 'cashOutSummary', 'shop', 'shopRerolls'
      ];
      scalarKeys.forEach((k) => {
        if (snap[k] !== undefined) run[k] = snap[k];
      });

      run.masterDeck = (snap.masterDeck || []).map((c) => Object.assign({}, c));
      const cmap = {};
      run.masterDeck.forEach((c) => { cmap[c.uid] = c; });
      const mapUids = (uids) => (uids || []).map((u) => cmap[u]).filter(Boolean);

      run.drawPile = mapUids(snap.drawPileUids);
      run.hand = mapUids(snap.handUids);
      run.discardPile = mapUids(snap.discardPileUids);
      run.playedZone = [];

      run.anteBoss = Balatro.BLIND_MAP[snap.anteBossId] || Balatro.BLIND_MAP['bl_hook'];
      run.anteBlinds = [Balatro.BLIND_MAP['bl_small'], Balatro.BLIND_MAP['bl_big'], run.anteBoss];
      run.currentBlind = snap.currentBlindId ? Balatro.BLIND_MAP[snap.currentBlindId] : null;

      if (snap.packState) {
        run.packState = {
          pack: snap.packState.pack,
          cards: snap.packState.cards || [],
          choosesLeft: snap.packState.choosesLeft || 1,
          tempHand: snap.packState.tempHandUids && snap.packState.tempHandUids.length > 0
            ? mapUids(snap.packState.tempHandUids)
            : null,
          returnState: snap.packState.returnState || Balatro.STATES.SHOP
        };
      } else {
        run.packState = null;
      }

      return run;
    }
  }

  Balatro.GameRun = GameRun;

  function buildPlayingCardTooltip(card) {

      lx = cardRect ? Math.max(pad, cardRect.left - bw - 10) : Math.max(pad, x - bw - 18);

    if (ly < pad) ly = pad;
    if (ly + bh + pad > global.innerHeight) ly = Math.max(pad, global.innerHeight - bh - pad);

    box.style.top = `${Math.round(ly)}px`;

  <script>
'use strict';

/**
 * 弹簧阻尼拖拽排序与点击判别引擎（支持 PC 键鼠、iPhone 横屏等比缩放与竖屏锁定 90° 横置坐标映射）
 */
(function initPhysicsDrag(global) {
  const Balatro = global.Balatro;

  Balatro.bindSortableCardRow = function bindSortableCardRow(containerEl, list, opts) {
    if (!containerEl || !Array.isArray(list)) return;
    const o = opts || {};

    const cardEls = Array.from(containerEl.querySelectorAll(':scope > .bal-card'));
    cardEls.forEach((el) => {
      el.addEventListener('pointerdown', (downEvt) => {
        if (downEvt.target.closest('.mini-act-btn')) return;
        if (downEvt.button !== 0 && downEvt.pointerType === 'mouse') return;

        const uid = el.dataset.uid;
        const item = list.find((x) => x.uid === uid);
        if (!item) return;

        const startX = downEvt.clientX;
        const startY = downEvt.clientY;
        let lastMainCoord = Balatro.viewportRotated ? startY : startX;
        let dragging = false;
        const allowDrag = o.canDragItem ? o.canDragItem(item) : !item.pinnedLeft;
        const dragThreshold = downEvt.pointerType === 'touch' ? 11 : 7;

        try { el.setPointerCapture(downEvt.pointerId); } catch (_) {}

        const onMove = (moveEvt) => {
          const rawDx = moveEvt.clientX - startX;
          const rawDy = moveEvt.clientY - startY;

          if (!dragging && allowDrag && Math.hypot(rawDx, rawDy) > dragThreshold) {
            dragging = true;
            el.classList.add('is-dragging');
            Balatro.hideTooltip();
          }

          if (dragging) {
            const scale = Balatro.viewportScale || 1;
            const rotated = !!Balatro.viewportRotated;

            // 将屏幕坐标位移转换回牌桌内部坐标系（完美兼容缩放与 90° 竖屏横置）
            const stageDx = (rotated ? rawDy : rawDx) / scale;
            const stageDy = (rotated ? -rawDx : rawDy) / scale;

            const curMain = rotated ? moveEvt.clientY : moveEvt.clientX;
            const vx = Balatro.clamp(curMain - lastMainCoord, -28, 28);
            lastMainCoord = curMain;
            const tiltZ = (vx * 0.55).toFixed(1);
            el.style.transform = `translate3d(${stageDx.toFixed(1)}px, ${(stageDy - 12).toFixed(1)}px, 30px) rotateZ(${tiltZ}deg) scale(1.08)`;

            // 检查是否越过相邻卡牌中心点实现实时交换
            const siblings = Array.from(containerEl.querySelectorAll(':scope > .bal-card'));
            const curIdx = siblings.indexOf(el);
            for (let i = 0; i < siblings.length; i++) {
              if (i === curIdx) continue;
              const sib = siblings[i];
              const sibUid = sib.dataset.uid;
              const sibItem = list.find((x) => x.uid === sibUid);
              if (sibItem && sibItem.pinnedLeft) continue;

              const rect = sib.getBoundingClientRect();
              const mid = rotated ? (rect.top + rect.height * 0.5) : (rect.left + rect.width * 0.5);
              if ((i < curIdx && curMain < mid) || (i > curIdx && curMain > mid)) {
                const aIdx = list.indexOf(item);
                const bIdx = list.indexOf(sibItem);
                if (aIdx !== -1 && bIdx !== -1) {
                  list.splice(aIdx, 1);
                  list.splice(bIdx, 0, item);
                  if (i < curIdx) containerEl.insertBefore(el, sib);
                  else containerEl.insertBefore(el, sib.nextSibling);
                  Balatro.audio.play('cardSlide');
                }
                break;
              }
            }
          }
        };

        const onUp = () => {
          el.removeEventListener('pointermove', onMove);
          el.removeEventListener('pointerup', onUp);
          el.removeEventListener('pointercancel', onUp);
          try { el.releasePointerCapture(downEvt.pointerId); } catch (_) {}

          if (dragging) {
            el.classList.remove('is-dragging');
            el.style.transform = '';
            if (o.onReorder) o.onReorder();
          } else if (o.onClick) {
            o.onClick(item, el);
          }
        };

        el.addEventListener('pointermove', onMove);
        el.addEventListener('pointerup', onUp);
        el.addEventListener('pointercancel', onUp);
      });
    });
  };
})(window);

'use strict';

/**
 * 结算动画导演系统 (Animation Director)
 * 将 7 阶段计分事件队列按全局倍速 (0.5x ~ 4x) 与连击自动加速曲线渲染为弹跳、爆字、音效升调与火焰特效
 */
(function initAnimDirector(global) {
  const Balatro = global.Balatro;

  function sleep(ms) {
    return new Promise((resolve) => setTimeout(resolve, Math.max(12, ms)));
  }

  function spawnFloatingBadge(targetEl, text, bgColor) {
    const div = document.createElement('div');
    div.className = 'score-float-pop';
    div.textContent = text;
    div.style.background = bgColor || '#ef4444';

    let x = global.innerWidth * 0.56;
    let y = global.innerHeight * 0.46;
    if (targetEl) {
      const r = targetEl.getBoundingClientRect();
      x = r.left + r.width * 0.5 + (Math.random() - 0.5) * 18;
      y = r.top + r.height * 0.28;
    }

    div.style.left = `${Math.round(x)}px`;
    div.style.top = `${Math.round(y)}px`;
    document.body.appendChild(div);
    setTimeout(() => div.remove(), 620);
    return { x, y };
  }

  function triggerBounce(el, cls) {
    if (!el) return;
    el.classList.remove(cls);
    void el.offsetWidth;
    el.classList.add(cls);
  }

  Balatro.playScoringTimeline = async function playScoringTimeline(run, playPacket, hooks) {
    const res = playPacket.pipelineResult;
    const events = res.events || [];
    const speedSetting = (Balatro.storage && Balatro.storage.settings.gameSpeed) || 1;
    Balatro.audio.resetChain();

    let flameTriggered = false;

    for (let i = 0; i < events.length; i++) {
      const ev = events[i];
      // 原版精髓：连击越长单步间隔按指数收窄，既保留前几拍清晰节奏又让百连重触发爽快不拖沓
      const accel = Math.max(0.24, Math.pow(0.935, i));
      const baseDelay = (ev.type === 'hand_total' ? 320 : 245) * accel / speedSetting;

      // 更新左侧筹码与倍率数字盘
      if (hooks.onCalcUpdate && ev.chips !== undefined && ev.mult !== undefined) {
        hooks.onCalcUpdate(ev.chips, ev.mult, ev.type === 'plasma_balance');
        const est = ev.chips * ev.mult;
        if (est >= run.targetScore && run.targetScore > 0) {
          const ratio = Math.min(2.0, 0.55 + Math.log10(Math.max(1, est / run.targetScore)) * 0.65);
          if (!flameTriggered) {
            flameTriggered = true;
            Balatro.audio.play('flame');
          }
          if (hooks.fx) hooks.fx.setFlame(ratio, ev.type === 'plasma_balance' || (run.deckConfig && run.deckConfig.plasmaBalance));
        }
      }

      if (ev.sfx) {
        Balatro.audio.play(ev.sfx);
      }

      const cardEl = ev.cardUid ? document.querySelector(`.bal-card[data-uid="${ev.cardUid}"]`) : null;
      const jokerEl = ev.jokerUid ? document.querySelector(`.bal-card[data-uid="${ev.jokerUid}"]`) : null;
      const consEl = ev.consumableUid ? document.querySelector(`.bal-card[data-uid="${ev.consumableUid}"]`) : null;

      if (cardEl) triggerBounce(cardEl, 'anim-pop');
      if (jokerEl) triggerBounce(jokerEl, 'anim-joker-wig');
      if (consEl) triggerBounce(consEl, 'anim-joker-wig');

      const anchorEl = jokerEl || cardEl || consEl || document.getElementById('center-arena');
      if (ev.text && ev.type !== 'hand_base') {
        const pt = spawnFloatingBadge(anchorEl, ev.text, ev.color || '#ef4444');
        if (ev.sfx === 'xmult' || ev.type === 'plasma_balance') {
          if (hooks.fx) {
            hooks.fx.shake(7);
            hooks.fx.spawnBurst(pt.x, pt.y, ev.color || '#fe5f55', 14);
          }
          if (hooks.bg) hooks.bg.triggerPulse(0.55);
        } else if (ev.type === 'glass_shatter' && hooks.fx) {
          hooks.fx.spawnGlassShatter(pt.x, pt.y);
        } else if (ev.sfx === 'coin' && hooks.fx) {
          hooks.fx.spawnBurst(pt.x, pt.y, '#facc15', 10);
          if (hooks.onMoneySync) hooks.onMoneySync();
        }
      }

      await sleep(baseDelay);
    }

    if (hooks.fx) hooks.fx.setFlame(0, false);
  };
})(window);
